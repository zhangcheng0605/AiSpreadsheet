# Publishes index.html to GitHub Pages.
#
# There is nothing to build — the app is one static file — so this just copies
# it into the site root and hands it to Pages. `enablement: true` turns Pages on
# for the repository the first time this runs, so no manual setup is needed.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/env-repo-markdown-k2or0j
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3

      - id: deploy
        uses: actions/deploy-pages@v4

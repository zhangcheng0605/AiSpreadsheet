    const axis = vertical ? "row" : "col";
    const writes = [];
    const label = "Fill " + rectLabel(src) + " → " + rectLabel(cur);

    if (vertical) {
      for (let c = cur.c1; c <= cur.c2; c++) {
        const lane = [];
        for (let r = src.r1; r <= src.r2; r++) { const cell = Engine.cell(K(r, c)); lane.push({ raw: cell ? cell.raw : "", value: cell ? cell.value : null, fmt: cell && cell.fmt }); }
        const gen = pattern(lane, axis), n = lane.length;
        for (let r = cur.r1; r <= cur.r2; r++) {
          if (r >= src.r1 && r <= src.r2) continue;
          const i = r - src.r1;
          const j = ((i % n) + n) % n;
          writes.push([K(r, c), { raw: gen(i), fmt: lane[j].fmt ? JSON.parse(JSON.stringify(lane[j].fmt)) : null }]);
        }
      }
    } else {
      for (let r = cur.r1; r <= cur.r2; r++) {
        const lane = [];
        for (let c = src.c1; c <= src.c2; c++) { const cell = Engine.cell(K(r, c)); lane.push({ raw: cell ? cell.raw : "", value: cell ? cell.value : null, fmt: cell && cell.fmt }); }
        const gen = pattern(lane, axis), n = lane.length;
        for (let c = cur.c1; c <= cur.c2; c++) {
          if (c >= src.c1 && c <= src.c2) continue;
          const i = c - src.c1;
          const j = ((i % n) + n) % n;
          writes.push([K(r, c), { raw: gen(i), fmt: lane[j].fmt ? JSON.parse(JSON.stringify(lane[j].fmt)) : null }]);
        }
      }
    }
    if (writes.length) { Commands.apply(label, writes); Sound.tick(Math.min(writes.length, 12)); }
  }
  return { run, pattern };
})();

const Clipboard = (() => {
  let buf = null;          // {rect, items:[{dr,dc,raw,fmt}], cut, tsv}
  const march = $("#cutmarch");

  const tsvEscape = s => /[\t\n"]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  function toTSV(q, useRaw) {
    const rows = [];
    for (let r = q.r1; r <= q.r2; r++) {
      const row = [];
      for (let c = q.c1; c <= q.c2; c++) {
        const cell = Engine.cell(K(r, c));
        row.push(tsvEscape(useRaw ? (cell ? cell.raw : "") : displayText(cell)));
      }
      rows.push(row.join("\t"));
    }
    return rows.join("\n");
  }
  /** A tolerant TSV/CSV reader: quoted fields, embedded separators and CRLF. */
  function parseDelimited(text, sep) {
    const rows = [];
    let row = [], field = "", q = false, i = 0;
    while (i < text.length) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i += 2; continue; } q = false; i++; continue; }
        field += ch; i++; continue;
      }
      if (ch === '"' && field === "") { q = true; i++; continue; }
      if (ch === sep) { row.push(field); field = ""; i++; continue; }
      if (ch === "\r") { i++; continue; }
      if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += ch; i++;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function capture(cut) {
    const q = Grid.rect();
    const items = [];
    for (let r = q.r1; r <= q.r2; r++) for (let c = q.c1; c <= q.c2; c++) {
      const cell = Engine.cell(K(r, c));
      items.push({ dr: r - q.r1, dc: c - q.c1, raw: cell ? cell.raw : "", fmt: cell && cell.fmt ? JSON.parse(JSON.stringify(cell.fmt)) : null });
    }
    buf = { rect: q, items, cut, tsv: toTSV(q, false) };
    if (cut) {
      const p = Grid.rangePx(q);
      march.classList.remove("hidden");
      march.style.cssText = "transform:translate(" + p.x + "px," + p.y + "px);width:" + p.w + "px;height:" + p.h + "px";
    } else clearMarch();
    return buf.tsv;
  }
  function clearMarch() { march.classList.add("hidden"); if (buf) buf.cut = false; }

  document.addEventListener("copy", e => {
    if (Editor.editing || Modal.isOpen() || Palette.isOpen) return;
    e.clipboardData.setData("text/plain", capture(false));
    e.preventDefault();
    toast("Copied " + rectLabel(Grid.rect()));
  });
  document.addEventListener("cut", e => {
    if (Editor.editing || Modal.isOpen() || Palette.isOpen) return;
    e.clipboardData.setData("text/plain", capture(true));
    e.preventDefault();
    toast("Cut " + rectLabel(Grid.rect()) + " — paste to move");
  });
  document.addEventListener("paste", e => {
    if (Editor.editing || Modal.isOpen() || Palette.isOpen) return;
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text/plain");
    // If the OS clipboard still matches what we copied, use the rich internal copy.
    if (buf && text === buf.tsv) pasteInternal();
    else if (text) pasteText(text);
  });

  function targetOrigin() { const q = Grid.rect(); return { r: q.r1, c: q.c1 }; }

  function pasteInternal(mode) {
    if (!buf) return;
    const o = targetOrigin();
    const q = Grid.rect();
    const h = buf.rect.r2 - buf.rect.r1 + 1, w = buf.rect.c2 - buf.rect.c1 + 1;
    // A single copied cell fills whatever you have selected — the expected shortcut.
    const tileR = (h === 1 && w === 1) ? (q.r2 - q.r1 + 1) : 1;
    const tileC = (h === 1 && w === 1) ? (q.c2 - q.c1 + 1) : 1;
    const dr = o.r - buf.rect.r1, dc = o.c - buf.rect.c1;
    const writes = [];
    for (let tr = 0; tr < tileR; tr++) for (let tc = 0; tc < tileC; tc++) {
      for (const it of buf.items) {
        const r = o.r + it.dr + tr, c = o.c + it.dc + tc;
        if (!inBounds(r, c)) continue;
        const spec = {};
        if (mode !== "formats") spec.raw = it.raw && it.raw[0] === "=" ? shiftFormula(it.raw, dr + tr, dc + tc) : it.raw;
        if (mode === "values" && it.raw && it.raw[0] === "=") {
          const srcCell = Engine.cell(K(buf.rect.r1 + it.dr, buf.rect.c1 + it.dc));
          spec.raw = srcCell ? String(displayText(srcCell)) : "";
        }
        if (mode !== "values") spec.fmt = it.fmt;
        writes.push([K(r, c), spec]);
      }
    }
    if (buf.cut) {
      // Move semantics: clear the source and redirect every inbound reference.
      const moveMap = new Map();
      for (const it of buf.items) moveMap.set(K(buf.rect.r1 + it.dr, buf.rect.c1 + it.dc), { r: o.r + it.dr, c: o.c + it.dc });
      for (const [k] of moveMap) if (!writes.some(([wk]) => wk === k)) writes.push([k, null]);
      redirect(moveMap, writes);
    }
    const label = (buf.cut ? "Move " : "Paste ") + h + "×" + w + " at " + A1(o.r, o.c);
    Commands.apply(label, writes);
    Grid.selectRect({ r1: o.r, c1: o.c, r2: Math.min(MAXROW, o.r + h * tileR - 1), c2: Math.min(MAXCOL, o.c + w * tileC - 1) }, true);
    if (buf.cut) { buf = null; clearMarch(); }
  }

  /** Rewrite formulas elsewhere in the sheet that pointed at moved cells. */
  function redirect(moveMap, writes) {
    const already = new Set(writes.map(([k]) => k));
    for (const [k, cell] of Engine.cells) {
      if (!cell.ast || already.has(k)) continue;
      let touches = false;
      if (cell.refs) for (const d of cell.refs) if (moveMap.has(d)) { touches = true; break; }
      if (!touches && cell.ranges) for (const rc of cell.ranges) { for (const [mk] of moveMap) { const p = parseKey(mk); if (p.r >= rc.r1 && p.r <= rc.r2 && p.c >= rc.c1 && p.c <= rc.c2) { touches = true; break; } } if (touches) break; }
      if (!touches) continue;
      try { writes.push([k, { raw: "=" + stringifyAst(remapAst(cell.ast, moveMap)) }]); } catch (err) { /* leave it alone */ }
    }
  }

  function pasteText(text) {
    const sep = text.includes("\t") || !text.includes(",") ? "\t" : ",";
    const rows = parseDelimited(text, sep);
    const o = targetOrigin();
    const writes = [];
    rows.forEach((row, i) => row.forEach((v, j) => {
      const r = o.r + i, c = o.c + j;
      if (inBounds(r, c)) writes.push([K(r, c), { raw: v }]);
    }));
    if (!writes.length) return;
    Commands.apply("Paste " + rows.length + "×" + (rows[0] || []).length + " at " + A1(o.r, o.c), writes);
    Grid.selectRect({ r1: o.r, c1: o.c, r2: Math.min(MAXROW, o.r + rows.length - 1), c2: Math.min(MAXCOL, o.c + (rows[0] || []).length - 1) }, true);
  }

  function toMarkdown() {
    const q = Grid.rect();
    const lines = [];
    for (let r = q.r1; r <= q.r2; r++) {
      const row = [];
      for (let c = q.c1; c <= q.c2; c++) row.push(displayText(Engine.cell(K(r, c))).replace(/\|/g, "\\|"));
      lines.push("| " + row.join(" | ") + " |");
      if (r === q.r1) lines.push("|" + row.map(() => " --- ").join("|") + "|");
    }
    return lines.join("\n");
  }

  async function writeOS(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = el("textarea");
      ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
      document.body.append(ta); ta.select();
      const ok = document.execCommand("copy");
      ta.remove();
      return ok;
    }
  }

  return {
    capture, pasteInternal, pasteText, toMarkdown, toTSV, parseDelimited, writeOS, clearMarch,
    get hasMarching() { return !!(buf && buf.cut); },
    get buffer() { return buf; },
  };
})();

/* Optional WebAudio tick on fill steps — off by default (§9). */
const Sound = (() => {
  let on = false, ctx = null;
  function tick(n) {
    if (!on) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < Math.min(n || 1, 12); i++) {
        const t = ctx.currentTime + i * 0.03;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880 + i * 40;
        g.gain.setValueAtTime(0.05, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
        o.connect(g).connect(ctx.destination);
        o.start(t); o.stop(t + 0.06);
      }
    } catch (e) { /* audio is a luxury, never a requirement */ }
  }
  return { tick, toggle() { on = !on; return on; }, get on() { return on; } };
})();

/* ============================================================ *
 * ===== FEATURE: FORMULA X-RAY (§8.1) =========================
 * Select a formula cell, hit Ctrl+Shift+X. Precedents flow in
 * blue, dependents flow out orange, and editing the cell while
 * the overlay is open ripples through the dependents in true
 * topological order. This is the money shot.
 * ============================================================ */
const XRay = (() => {
  const svg = $("#xray"), hud = $("#xrayHud"), layer = $("#cellLayer");
  const MAX_DEPTH = 4, MAX_ARROWS = 200;
  let active = false, root = null, model = null;
  const NS = "http://www.w3.org/2000/svg";
  const mk = (t, attrs) => { const n = document.createElementNS(NS, t); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };

  /** Screen-space box for a cell or a rectangle of cells. */
  function box(rect) {
    const b = Grid.scroller.getBoundingClientRect();
    const p = Grid.rangePx(rect);
    return {
      x: b.left + p.x - Grid.scroller.scrollLeft,
      y: b.top + p.y - Grid.scroller.scrollTop,
      w: p.w, h: p.h, clip: b,
    };
  }
  const cellRectOf = k => { const p = parseKey(k); return { r1: p.r, c1: p.c, r2: p.r, c2: p.c }; };

  function precedents(key) {
    if (!key || key[0] === "R" && key[1] === ":") return [];
    const cell = Engine.cell(key);
    if (!cell) return [];
    const out = [];
    if (cell.refs) for (const k of cell.refs) out.push({ id: k, kind: "cell", rect: cellRectOf(k) });
    if (cell.ranges) for (const rc of cell.ranges) out.push({ id: "R:" + rectLabel(rc), kind: "range", rect: rc, label: rectLabel(rc) });
    return out;
  }

  /** Build the two-directional graph around `key`, breadth-first, depth-capped. */
  function build(key) {
    const nodes = new Map(), arrows = [];
    const addNode = n => { if (!nodes.has(n.id)) nodes.set(n.id, n); return nodes.get(n.id); };
    addNode({ id: key, kind: "root", rect: cellRectOf(key), depth: 0, dir: 0 });
    let truncated = 0;

    // upstream (precedents) — blue
    let frontier = [{ id: key, rect: cellRectOf(key) }];
    for (let d = 1; d <= MAX_DEPTH && frontier.length; d++) {
      const next = [];
      for (const f of frontier) {
        for (const p of precedents(f.id)) {
          if (arrows.length >= MAX_ARROWS) { truncated++; continue; }
          addNode(Object.assign({}, p, { depth: d, dir: -1 }));
          arrows.push({ from: p.id, to: f.id, depth: d, dir: -1 });
          if (p.kind === "cell") next.push({ id: p.id, rect: p.rect });
          else {
            // expand a range one level: only the formula cells inside it matter
            let n = 0;
            for (const k of rectKeys(p.rect)) {
              if (n >= 12) break;
              const c = Engine.cell(k);
              if (c && c.ast) { next.push({ id: k, rect: cellRectOf(k) }); n++; }
            }
          }
        }
      }
      frontier = next.filter(f => !f.id.startsWith("R:"));
    }
    // downstream (dependents) — orange
    let dfront = [key];
    const seenDown = new Set([key]);
    const topoOrder = [];
    for (let d = 1; d <= MAX_DEPTH && dfront.length; d++) {
      const next = [];
      for (const f of dfront) {
        for (const dk of Engine.dependentsOf(f)) {
          if (dk === f) continue;
          if (arrows.length >= MAX_ARROWS) { truncated++; continue; }
          arrows.push({ from: f, to: dk, depth: d, dir: 1 });
          if (!seenDown.has(dk)) { seenDown.add(dk); addNode({ id: dk, kind: "cell", rect: cellRectOf(dk), depth: d, dir: 1 }); next.push(dk); topoOrder.push(dk); }
        }
      }
      dfront = next;
    }
    return { nodes, arrows, truncated, downstream: seenDown, topoOrder };
  }

  function draw() {
    if (!model) return;
    svg.innerHTML = "";
    const defs = mk("defs");
    defs.innerHTML =
      '<marker id="ah-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="' + arrowColor(-1) + '"/></marker>' +
      '<marker id="ah-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="' + arrowColor(1) + '"/></marker>' +
      '<filter id="xglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
    svg.append(defs);

    const clip = Grid.scroller.getBoundingClientRect();
    const gArrows = mk("g"), gHalos = mk("g"), gChips = mk("g");

    // Edge chips stack up when several precedents are off-screen in the same
    // direction; nudge each one clear of its neighbours so all stay readable.
    const placed = [];
    function placeChip(g, x, y, text, color) {
      if (placed.some(p => p.text === text && Math.abs(p.x - x) < 30 && Math.abs(p.y - y) < 30)) return;
      const w = text.length * 5.6 + 14;
      let yy = y, guard = 0;
      while (guard++ < 10 && placed.some(p => Math.abs(p.x - x) < (w + p.w) / 2 && Math.abs(p.y - yy) < 19)) yy += 19;
      placed.push({ x, y: yy, w, text });
      g.append(chipAt(x, yy, text, color));
    }


    // halos first so arrows sit on top
    for (const n of model.nodes.values()) {
      const b = box(n.rect);
      const vis = b.x + b.w > clip.left && b.x < clip.right && b.y + b.h > clip.top && b.y < clip.bottom;
      if (!vis) continue;
      const col = n.dir === 0 ? "var(--accent)" : arrowColor(n.dir);
      const op = n.dir === 0 ? 1 : depthOpacity(n.depth);
      gHalos.append(mk("rect", {
        x: b.x + 1, y: b.y + 1, width: Math.max(2, b.w - 2), height: Math.max(2, b.h - 2), rx: 3,
        class: "halo", stroke: col, "stroke-opacity": op, filter: "url(#xglow)",
        fill: col, "fill-opacity": n.dir === 0 ? 0.14 : 0.07,
      }));
      if (n.kind === "range") placeChip(gChips, b.x + b.w / 2, b.y - 8, n.label + " · " + areaOf(n.rect), arrowColor(-1));
    }
    // arrows
    let offscreen = 0;
    const drawn = new Set();
    for (const a of model.arrows) {
      const from = model.nodes.get(a.from) || { rect: cellRectOf(a.from) };
      const to = model.nodes.get(a.to) || { rect: cellRectOf(a.to) };
      const p1 = center(box(from.rect)), p2 = center(box(to.rect));
      const c1 = clampPt(p1, clip), c2 = clampPt(p2, clip);
      if (c1.clamped && c2.clamped) { offscreen++; continue; }
      const sig2 = a.from + ">" + a.to;
      if (drawn.has(sig2)) continue;
      drawn.add(sig2);
      const path = bezier(c1, c2);
      gArrows.append(mk("path", {
        d: path, fill: "none", stroke: arrowColor(a.dir), "stroke-width": a.dir === 0 ? 2 : 1.9,
        "stroke-opacity": depthOpacity(a.depth), class: "flow", "stroke-linecap": "round",
        "marker-end": a.dir === -1 ? "url(#ah-in)" : "url(#ah-out)",
      }));
      if (c1.clamped) placeChip(gChips, c1.x, c1.y, edgeLabel(from), arrowColor(a.dir));
      if (c2.clamped) placeChip(gChips, c2.x, c2.y, edgeLabel(to), arrowColor(a.dir));
    }
    svg.append(gArrows, gHalos, gChips);

    const nIn = model.arrows.filter(a => a.dir === -1).length, nOut = model.arrows.filter(a => a.dir === 1).length;
    hud.innerHTML = "";
    const k = (color, label) => { const s = el("span", "k"); const d = el("span", "dot"); d.style.background = color; s.append(d, el("b", null, label)); return s; };
    hud.append(el("b", null, A1(parseKey(root).r, parseKey(root).c)));
    hud.append(k(arrowColor(-1), nIn + " precedent" + (nIn === 1 ? "" : "s")));
    hud.append(k(arrowColor(1), nOut + " dependent" + (nOut === 1 ? "" : "s")));
    if (model.truncated) hud.append(el("span", null, "+" + model.truncated + " more"));
    if (offscreen) hud.append(el("span", null, offscreen + " off-screen"));
    hud.append(el("span", null, "Esc to close"));
  }
  const areaOf = rc => ((rc.r2 - rc.r1 + 1) * (rc.c2 - rc.c1 + 1)) + " cells";
  const edgeLabel = n => (n.label || (n.id && !n.id.startsWith("R:") ? A1(parseKey(n.id).r, parseKey(n.id).c) : "…"));
  const depthOpacity = d => [1, 1, .68, .45, .3][clamp(d, 0, 4)];
  const arrowColor = dir => dir === 1 ? getVar("--orange") : getVar("--blue");
  const getVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#2563eb";
  const center = b => ({ x: b.x + b.w / 2, y: b.y + b.h / 2 });
  function clampPt(p, clip) {
    const pad = 10;
    const x = clamp(p.x, clip.left + pad, clip.right - pad);
    const y = clamp(p.y, clip.top + pad, clip.bottom - pad);
    return { x, y, clamped: x !== p.x || y !== p.y };
  }
  function bezier(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const bend = Math.min(120, Math.max(28, Math.hypot(dx, dy) * 0.38));
    const horizontal = Math.abs(dx) > Math.abs(dy);
    const c1 = horizontal ? { x: a.x + Math.sign(dx || 1) * bend, y: a.y } : { x: a.x, y: a.y + Math.sign(dy || 1) * bend };
    const c2 = horizontal ? { x: b.x - Math.sign(dx || 1) * bend, y: b.y } : { x: b.x, y: b.y - Math.sign(dy || 1) * bend };
    return `M${a.x.toFixed(1)} ${a.y.toFixed(1)} C${c1.x.toFixed(1)} ${c1.y.toFixed(1)} ${c2.x.toFixed(1)} ${c2.y.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
  }
  function chipAt(x, y, text, color) {
    const g = mk("g", { class: "chip" });
    const w = text.length * 5.6 + 14;
    g.append(mk("rect", { x: x - w / 2, y: y - 9, width: w, height: 17, fill: color, opacity: .92 }));
    const t = mk("text", { x, y: y + 3.5, "text-anchor": "middle" });
    t.textContent = text;
    g.append(t);
    return g;
  }

  /** Paint the dim/undim classes on the live grid nodes. */
  function applyDim() {
    layer.classList.toggle("xdim", active);
    for (const n of layer.children) n.classList.remove("xhot");
    if (!active || !model) return;
    for (const n of model.nodes.values()) {
      for (const k of rectKeys(n.rect)) {
        const node = Grid.node(k);
        if (node) node.classList.add("xhot");
        if (areaTooBig(n.rect)) break;
      }
    }
  }
  const areaTooBig = rc => (rc.r2 - rc.r1 + 1) * (rc.c2 - rc.c1 + 1) > 4000;

  function open() {
    const key = Grid.activeKey();
    const cell = Engine.cell(key);
    const hasDeps = Engine.dependentsOf(key).length;
    if (!cell || (!cell.ast && !hasDeps)) { toast("Select a formula cell (or one that something depends on) first"); return; }
    root = key;
    active = true;
    model = build(key);
    svg.classList.remove("hidden");
    hud.classList.remove("hidden");
    $("#dimmer").classList.add("on");
    applyDim();
    draw();
    Clippy.say("xray");
  }
  function close() {
    active = false; model = null; root = null;
    svg.classList.add("hidden"); svg.innerHTML = "";
    hud.classList.add("hidden");
    $("#dimmer").classList.remove("on");
    applyDim();
  }
  function toggle() { active ? close() : open(); }
  function retarget() { if (!active) return; root = Grid.activeKey(); model = build(root); applyDim(); draw(); }
  function redraw() { if (active) { applyDim(); draw(); } }

  /** Live ripple: dependents flash in topological order, 40 ms apart. */
  Engine.on((kind, payload) => {
    if (kind !== "recalc" || !active || !model) return;
    const order = (payload.order || []).filter(k => model.downstream.has(k) && k !== root);
    order.forEach((k, i) => setTimeout(() => {
      const n = Grid.node(k);
      if (n) { n.classList.remove("ripple"); void n.offsetWidth; n.classList.add("ripple"); setTimeout(() => n.classList.remove("ripple"), 500); }
    }, i * 40));
  });

  return { open, close, toggle, retarget, redraw, get active() { return active; }, build };
})();

/* ============================================================ *
 * ===== FEATURE: TIME TRAVEL (§8.2) ===========================
 * Undo/redo and the scrubber are the same system: undo is just
 * cursor movement over the command log. Snapshots every 50
 * commands keep any seek under a frame's worth of work.
 * ============================================================ */
const TimeTravel = (() => {
  const drawer = $("#drawer"), range = $("#ttRange"), ticks = $("#ttTicks"),
        label = $("#ttLabel"), banner = $("#ttBanner"), pos = $("#ttPos");
  let open = false, scrubbing = false, playing = null, speed = 1, at = 0;
  const SPEEDS = [1, 4, 16];

  function refresh() {
    const n = Commands.log.length;
    range.max = String(n);
    if (!scrubbing) at = Commands.cursor;
    range.value = String(at);
    pos.textContent = "#" + at + " of " + n + (at < n ? " · " + (n - at) + " ahead" : " · present");
    drawTicks();
  }
  function drawTicks() {
    const n = Commands.log.length;
    ticks.innerHTML = "";
    if (!n) return;
    const snapSet = new Set(Commands.snapshotIndices);
    const step = Math.max(1, Math.ceil(n / 140));
    for (let i = 0; i <= n; i += step) {
      const t = el("i");
      t.style.left = (i / n * 100) + "%";
      if (snapSet.has(i)) t.className = "snap";
      ticks.append(t);
    }
  }
  function describe(i) {
    if (i <= 0) return "#0 · empty sheet";
    const e = Commands.log[i - 1];
    return "#" + e.seq + " · " + e.label;
  }

  /** Move the sheet to state `n`, flashing whatever changed on the way. */
  function seek(n) {
    n = clamp(n, 0, Commands.log.length);
    const from = at;
    const touched = new Set();
    const lo = Math.min(from, n), hi = Math.max(from, n);
    for (let i = lo; i < hi; i++) for (const [k] of Commands.log[i].after) touched.add(k);
    at = n;
    scrubbing = n !== Commands.log.length;
    Commands.materialise(n);
    Commands.setFrozen(scrubbing);
    banner.classList.toggle("on", scrubbing);
    for (const k of touched) Grid.flash(k, "tt");
    Grid.invalidate(touched);
    Grid.scheduleRender();
    refresh();
  }

  function show() {
    open = true;
    drawer.classList.add("on");
    at = Commands.cursor;
    refresh();
    if (!Commands.log.length) toast("No history yet — edit a few cells, then come back");
  }
  function close() {
    stop();
    if (scrubbing) jumpToPresent();
    open = false;
    drawer.classList.remove("on");
  }
  function toggle() { open ? close() : show(); }

  function jumpToPresent() {
    seek(Commands.log.length);
    Commands.cursor = Commands.log.length;
    scrubbing = false;
    Commands.setFrozen(false);
    banner.classList.remove("on");
    refresh();
  }

  function play() {
    if (playing) return stop();
    if (at >= Commands.log.length) seek(0);
    $("#ttPlay").textContent = "⏸ Pause";
    playing = setInterval(() => {
      if (at >= Commands.log.length) { stop(); return; }
      seek(at + 1);
    }, 250 / speed);
  }
  function stop() { if (playing) clearInterval(playing); playing = null; $("#ttPlay").textContent = "▶ Play"; }

  /** Make the scrubbed state the present, as ONE undoable command.
   *  We keep the log intact rather than deleting it — that way the scrubber
   *  still shows where you came from and Ctrl+Z still walks back out. */
  function restoreHere() {
    if (!scrubbing) { toast("Already at the present"); return; }
    const targetIdx = at;
    const target = new Map(Engine.snapshot().map(([k, raw, fmt, imp]) => [k, { raw, fmt, imported: !!imp }]));
    jumpToPresent();
    const present = new Map(Engine.snapshot().map(([k, raw, fmt, imp]) => [k, { raw, fmt, imported: !!imp }]));
    const keys = new Set([...target.keys(), ...present.keys()]);
    const writes = [];
    for (const k of keys) {
      const t = target.get(k);
      writes.push([k, t ? { raw: t.raw, fmt: t.fmt || null, imported: t.imported } : null]);
    }
    Commands.apply("Restore to #" + targetIdx, writes);
    toast("Restored the sheet as it was at #" + targetIdx, { action: "Undo", onAction: () => Commands.undo() });
    refresh();
  }

  range.addEventListener("input", () => seek(+range.value));
  range.addEventListener("mousemove", e => {
    const n = Commands.log.length;
    if (!n) return;
    const r = range.getBoundingClientRect();
    const frac = clamp((e.clientX - r.left) / r.width, 0, 1);
    const i = Math.round(frac * n);
    label.textContent = describe(i);
    label.style.left = (frac * 100) + "%";
    label.classList.add("on");
  });
  range.addEventListener("mouseleave", () => label.classList.remove("on"));
  $("#ttPlay").onclick = play;
  $("#ttSpeed").onclick = () => {
    speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
    $("#ttSpeed").textContent = "×" + speed;
    if (playing) { stop(); play(); }
  };
  $("#ttNow").onclick = () => { stop(); jumpToPresent(); };
  $("#ttRestore").onclick = restoreHere;
  $("#ttClose").onclick = close;
  Commands.on(() => { if (open) refresh(); });

  return {
    show, close, toggle, seek, jumpToPresent, restoreHere,
    get open() { return open; },
    get scrubbing() { return scrubbing; },
    get position() { return at; },
  };
})();

/* ============================================================ *
 * ===== FEATURE: LIVE CELL WIDGETS (§8.4) =====================
 * A widget IS its formula: =SLIDER(0,100,5,42). Dragging rewrites
 * the 4th argument, so widgets survive copy/paste, undo, time
 * travel and the URL hash without a single line of extra state.
 * ============================================================ */
const Widgets = (() => {
  let dragging = null;

  function beginDrag(key, kindLabel) {
    if (Commands.frozen) return false;
    dragging = key;
    Commands.beginGesture(kindLabel + " " + A1(parseKey(key).r, parseKey(key).c), [key]);
    return true;
  }
  function endDrag() {
    if (!dragging) return;
    dragging = null;
    Commands.endGesture();
    Persist.save();
  }
  window.addEventListener("mouseup", endDrag);
  window.addEventListener("touchend", endDrag);

  function write(key, v) {
    const cell = Engine.cell(key);
    if (!cell) return;
    Commands.gestureWrite(key, { raw: widgetFormula(cell, v) });
  }

  function render(node, key, cell, w) {
    let wrap = node.firstElementChild && node.firstElementChild.classList.contains("wg") ? node.firstElementChild : null;
    if (!wrap) { node.textContent = ""; wrap = el("div", "wg"); node.append(wrap); wrap._type = null; }
    const v = cell.value;

    if (w.type === "slider") {
      if (wrap._type !== "slider") {
        wrap.innerHTML = "";
        wrap._type = "slider";
        const inp = el("input");
        inp.type = "range";
        const out = el("span", "wv");
        wrap.append(inp, out);
        inp.addEventListener("mousedown", e => { e.stopPropagation(); beginDrag(node._k, "Slider"); });
        inp.addEventListener("touchstart", e => { e.stopPropagation(); beginDrag(node._k, "Slider"); }, { passive: true });
        inp.addEventListener("input", () => {
          if (!dragging) beginDrag(node._k, "Slider");
          write(node._k, +inp.value);
        });
        inp.addEventListener("change", endDrag);
        inp.addEventListener("click", e => e.stopPropagation());
      }
      const inp = wrap.firstElementChild;
      inp.min = w.min; inp.max = w.max; inp.step = w.step || 1;
      if (document.activeElement !== inp || dragging !== node._k) inp.value = String(isNum(v) ? v : w.min);
      wrap.lastElementChild.textContent = numToStr(isNum(v) ? v : w.min);
      return;
    }
    if (w.type === "checkbox") {
      if (wrap._type !== "checkbox") {
        wrap.innerHTML = "";
        wrap._type = "checkbox";
        const cb = el("div", "cb");
        cb.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 5.2 4 7.6 8.6 2.4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        wrap.append(cb);
        cb.addEventListener("mousedown", e => {
          e.stopPropagation(); e.preventDefault();
          const k = node._k;
          if (Commands.frozen) return;
          const c = Engine.cell(k);
          Commands.apply("Toggle " + A1(parseKey(k).r, parseKey(k).c), [[k, { raw: widgetFormula(c, !(c.value === true)) }]]);
        });
      }
      wrap.firstElementChild.classList.toggle("on", v === true);
      wrap.firstElementChild.style.visibility = "visible";
      wrap.firstElementChild.firstChild.style.opacity = v === true ? "1" : "0";
      return;
    }
    // rating
    if (wrap._type !== "rating") {
      wrap.innerHTML = "";
      wrap._type = "rating";
      const stars = el("div", "stars");
      wrap.append(stars);
      stars.addEventListener("mousedown", e => {
        e.stopPropagation(); e.preventDefault();
        const i = Array.from(stars.children).indexOf(e.target.closest("i"));
        if (i < 0 || Commands.frozen) return;
        const k = node._k, c = Engine.cell(k);
        const cur = isNum(c.value) ? c.value : 0;
        Commands.apply("Rate " + A1(parseKey(k).r, parseKey(k).c), [[k, { raw: widgetFormula(c, cur === i + 1 ? 0 : i + 1) }]]);
      });
    }
    const stars = wrap.firstElementChild;
    const max = Math.max(1, Math.min(10, w.max || 5));
    if (stars.children.length !== max) { stars.innerHTML = ""; for (let i = 0; i < max; i++) stars.append(el("i", null, "★")); }
    const val = isNum(v) ? v : 0;
    Array.from(stars.children).forEach((s, i) => s.classList.toggle("on", i < val));
  }

  /** Palette entry: turn the selection into a widget. */
  function convert(kind) {
    const q = Grid.rect();
    const writes = [];
    for (const k of rectKeys(q)) {
      const cell = Engine.cell(k);
      const cur = cell && isNum(cell.value) ? cell.value : 0;
      if (kind === "slider") writes.push([k, { raw: "=SLIDER(0,100,1," + numToStr(clamp(cur, 0, 100)) + ")" }]);
      else if (kind === "checkbox") writes.push([k, { raw: "=CHECKBOX(" + (cur ? "TRUE" : "FALSE") + ")" }]);
      else writes.push([k, { raw: "=RATING(5," + numToStr(clamp(Math.round(cur), 0, 5)) + ")" }]);
      if (writes.length > 400) break;
    }
    Commands.apply("Turn " + rectLabel(q) + " into " + kind, writes);
  }

  return { render, convert, get dragging() { return dragging; } };
})();

/* ============================================================ *
 * ===== FEATURE: INSTANT CHARTS (§8.6) ========================
 * Every path, axis tick and tooltip below is hand-rolled SVG.
 * No chart library — that was the point. Charts are live: they
 * subscribe to the recalc event and redraw when their source
 * range changes.
 * ============================================================ */
const Charts = (() => {
  const host = $("#chartLayer");
  const MAX = 4;
  let charts = [];        // {id, rect, type, x, y, w, h, node}
  let nextId = 1;
  const PALETTE = ["#4f46e5", "#ea580c", "#059669", "#c026d3", "#0891b2", "#f59e0b"];
  const NS = "http://www.w3.org/2000/svg";
  const mk = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
  const tip = el("div", "ch-tip"); tip.style.display = "none"; document.body.append(tip);

  /* ---- nice axis numbers ---- */
  function niceNum(x, round) {
    if (x === 0) return 1;
    const exp = Math.floor(Math.log10(Math.abs(x)));
    const f = Math.abs(x) / Math.pow(10, exp);
    const nf = round ? (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) : (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10);
    return nf * Math.pow(10, exp);
  }
  function scaleOf(lo, hi, want) {
    if (lo === hi) { lo = Math.min(0, lo); hi = hi === 0 ? 1 : hi * 1.2; }
    if (lo > 0) lo = 0;                       // bars should start at zero
    if (hi < 0) hi = 0;
    const step = niceNum((hi - lo) / (want - 1), true);
    return { lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step, step };
  }

  /* ---- read a range and work out what kind of chart it wants ---- */
  function analyze(rect) {
    const g = [];
    for (let r = rect.r1; r <= rect.r2; r++) {
      const row = [];
      for (let c = rect.c1; c <= rect.c2; c++) row.push({ v: Engine.rawValue(r, c), cell: Engine.cell(K(r, c)) });
      g.push(row);
    }
    if (!g.length || !g[0].length) return null;
    const isNumAt = x => typeof x.v === "number";
    const isDateAt = x => x.cell && x.cell.fmt && x.cell.fmt.numFmt === "date";
    const cols = g[0].length;

    // a header row is text across the board with numbers underneath
    const headerRow = g.length > 1 && g[0].every(x => typeof x.v === "string" && x.v !== "") && g.slice(1).some(r => r.some(isNumAt));
    const body = headerRow ? g.slice(1) : g;
    if (!body.length) return null;

    const firstColText = cols > 1 && body.every(r => typeof r[0].v === "string" || r[0].v == null) && body.some(r => typeof r[0].v === "string");
    const firstColDate = cols > 1 && body.filter(r => r[0].v != null).every(r => isDateAt(r[0]) || /^\d{4}-\d{2}-\d{2}$/.test(String(r[0].v)));
    // A strictly increasing first column next to two-plus data columns is an
    // index (Year, Month, Step…) — treat it as labels, not as a flat series.
    // Requires 3+ columns so a plain two-column X/Y range still reads as scatter.
    const firstColIndex = cols > 2 && body.length > 2 && body.every(r => typeof r[0].v === "number")
      && body.every((r, i) => i === 0 || r[0].v > body[i - 1][0].v);
    const startCol = (firstColText || firstColDate || firstColIndex) ? 1 : 0;

    const series = [];
    for (let c = startCol; c < cols; c++) {
      const values = body.map(r => (r[c] && typeof r[c].v === "number") ? r[c].v : null);
      if (!values.some(v => v != null)) continue;
      series.push({
        name: headerRow ? String(g[0][c].v) : (cols - startCol === 1 ? "Series" : colName(rect.c1 + c)),
        values,
      });
    }
    if (!series.length) {
      // a single row of numbers, read horizontally
      const flatRow = g.map(r => r.filter(isNumAt).map(x => x.v)).find(a => a.length > 1);
      if (!flatRow) return null;
      return { labels: flatRow.map((_, i) => String(i + 1)), series: [{ name: "Series", values: flatRow }], suggested: "bar" };
    }
    let labels;
    if (startCol === 1) {
      labels = body.map(r => {
        const v = r[0].v;
        if (typeof v === "number" && isDateAt(r[0])) return fmtNumber(v, "date");
        return v == null ? "" : String(v);
      });
    } else labels = body.map((_, i) => String(rect.r1 + (headerRow ? 1 : 0) + i));

    let suggested;
    if (firstColDate || firstColIndex) suggested = "line";
    else if (firstColText && series.length === 1) suggested = "bar";
    else if (firstColText && series.length >= 2) suggested = "bar";
    else if (!firstColText && series.length === 2) suggested = "scatter";
    else suggested = "bar";
    return { labels, series, suggested, grouped: series.length > 1 };
  }

  /* ---- renderers ---- */
  function render(ch) {
    const data = analyze(ch.rect);
    const body = ch.node.querySelector(".ch-body");
    body.innerHTML = "";
    if (!data) { body.append(el("div", null, "Nothing numeric in " + rectLabel(ch.rect))); return; }
    const W = ch.w, H = ch.h;
    const svg = mk("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H });
    const type = ch.type === "auto" ? data.suggested : ch.type;
    const pad = { l: 44, r: 12, t: 12, b: 30 };
    const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const axisCol = "var(--line-2)", textCol = "var(--muted)";

    const all = data.series.flatMap(s => s.values.filter(v => v != null));
    if (!all.length) { body.append(el("div", null, "No data")); return; }

    if (type === "pie") return renderPie(svg, data, ch, body, W, H);
    if (type === "scatter") return renderScatter(svg, data, ch, body, W, H, pad, iw, ih);

    const sc = scaleOf(Math.min(...all), Math.max(...all), 6);
    const Y = v => pad.t + ih - ((v - sc.lo) / (sc.hi - sc.lo)) * ih;

    // grid lines + y ticks
    for (let v = sc.lo; v <= sc.hi + 1e-9; v += sc.step) {
      const y = Y(v);
      svg.append(mk("line", { x1: pad.l, x2: pad.l + iw, y1: y, y2: y, stroke: axisCol, "stroke-width": v === 0 ? 1.2 : .6, opacity: v === 0 ? .9 : .45 }));
      const t = mk("text", { x: pad.l - 6, y: y + 3.5, "text-anchor": "end", "font-size": 9.5, fill: textCol });
      t.textContent = shortNum(v);
      svg.append(t);
    }
    const n = data.labels.length;
    if (type === "line") {
      data.series.forEach((s, si) => {
        const col = PALETTE[si % PALETTE.length];
        const X = i => pad.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
        const pts = s.values.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
        if (pts.length > 1) svg.append(mk("path", { d: pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" "), fill: "none", stroke: col, "stroke-width": 2, "stroke-linejoin": "round", class: "grow" }));
        pts.forEach((p, i) => {
          const c = mk("circle", { cx: p[0], cy: p[1], r: 3, fill: col });
          hoverable(c, () => data.labels[i] + ": " + numToStr(s.values.filter(v => v != null)[i]));
          svg.append(c);
        });
      });
    } else {
      const groups = data.series.length;
      const slot = iw / n;
      const bw = Math.max(2, (slot * 0.7) / groups);
      data.series.forEach((s, si) => {
        const col = PALETTE[si % PALETTE.length];
        s.values.forEach((v, i) => {
          if (v == null) return;
          const x = pad.l + i * slot + slot * 0.15 + si * bw;
          const y = Y(Math.max(v, 0)), y0 = Y(0);
          const h = Math.max(1, Math.abs(y0 - y));
          const r = mk("rect", { x: x.toFixed(1), y: Math.min(y, y0).toFixed(1), width: bw.toFixed(1), height: h.toFixed(1), fill: col, rx: 2, class: "grow", style: "transform-origin:0 " + y0 + "px" });
          hoverable(r, () => (data.labels[i] || "") + (groups > 1 ? " · " + s.name : "") + ": " + numToStr(v));
          svg.append(r);
        });
      });
    }
    // x labels (thinned so they never collide)
    const every = Math.max(1, Math.ceil(n / Math.floor(iw / 46)));
    data.labels.forEach((lab, i) => {
      if (i % every) return;
      const x = type === "line" ? pad.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw) : pad.l + i * (iw / n) + (iw / n) / 2;
      const t = mk("text", { x, y: pad.t + ih + 14, "text-anchor": "middle", "font-size": 9.5, fill: textCol });
      t.textContent = String(lab).slice(0, 10);
      svg.append(t);
    });
    if (data.series.length > 1) {
      data.series.forEach((s, si) => {
        const g = mk("g");
        g.append(mk("rect", { x: pad.l + si * 78, y: 2, width: 8, height: 8, rx: 2, fill: PALETTE[si % PALETTE.length] }));
        const t = mk("text", { x: pad.l + si * 78 + 12, y: 9.5, "font-size": 9.5, fill: textCol });
        t.textContent = s.name.slice(0, 9);
        g.append(t);
        svg.append(g);
      });
    }
    body.append(svg);
  }
  function renderPie(svg, data, ch, body, W, H) {
    const vals = data.series[0].values.map(v => v == null ? 0 : Math.abs(v));
    const total = vals.reduce((a, b) => a + b, 0) || 1;
    const cx = W / 2 - 40, cy = H / 2, R = Math.min(W / 2 - 60, H / 2 - 14);
    let a0 = -Math.PI / 2;
    vals.forEach((v, i) => {
      const a1 = a0 + (v / total) * Math.PI * 2;
      const big = a1 - a0 > Math.PI ? 1 : 0;
      const d = `M${cx} ${cy} L${(cx + R * Math.cos(a0)).toFixed(1)} ${(cy + R * Math.sin(a0)).toFixed(1)} A${R} ${R} 0 ${big} 1 ${(cx + R * Math.cos(a1)).toFixed(1)} ${(cy + R * Math.sin(a1)).toFixed(1)} Z`;
      const p = mk("path", { d, fill: PALETTE[i % PALETTE.length], stroke: "var(--panel)", "stroke-width": 1.5 });
      hoverable(p, () => (data.labels[i] || i + 1) + ": " + numToStr(v) + " (" + Math.round(v / total * 100) + "%)");
      svg.append(p);
      a0 = a1;
    });
    data.labels.slice(0, 8).forEach((lab, i) => {
      const y = 16 + i * 14;
      svg.append(mk("rect", { x: W - 92, y: y - 7, width: 8, height: 8, rx: 2, fill: PALETTE[i % PALETTE.length] }));
      const t = mk("text", { x: W - 80, y: y + .5, "font-size": 9.5, fill: "var(--muted)" });
      t.textContent = String(lab).slice(0, 11);
      svg.append(t);
    });
    body.append(svg);
  }
  function renderScatter(svg, data, ch, body, W, H, pad, iw, ih) {
    const xs = data.series[0].values, ys = (data.series[1] || data.series[0]).values;
    const xv = xs.filter(v => v != null), yv = ys.filter(v => v != null);
    const sx = scaleOf(Math.min(...xv), Math.max(...xv), 5), sy = scaleOf(Math.min(...yv), Math.max(...yv), 5);
    const X = v => pad.l + ((v - sx.lo) / (sx.hi - sx.lo)) * iw;
    const Y = v => pad.t + ih - ((v - sy.lo) / (sy.hi - sy.lo)) * ih;
    for (let v = sy.lo; v <= sy.hi + 1e-9; v += sy.step) {
      svg.append(mk("line", { x1: pad.l, x2: pad.l + iw, y1: Y(v), y2: Y(v), stroke: "var(--line-2)", "stroke-width": .6, opacity: .45 }));
      const t = mk("text", { x: pad.l - 6, y: Y(v) + 3.5, "text-anchor": "end", "font-size": 9.5, fill: "var(--muted)" });
      t.textContent = shortNum(v); svg.append(t);
    }
    for (let v = sx.lo; v <= sx.hi + 1e-9; v += sx.step) {
      const t = mk("text", { x: X(v), y: pad.t + ih + 14, "text-anchor": "middle", "font-size": 9.5, fill: "var(--muted)" });
      t.textContent = shortNum(v); svg.append(t);
    }
    xs.forEach((x, i) => {
      if (x == null || ys[i] == null) return;
      const c = mk("circle", { cx: X(x), cy: Y(ys[i]), r: 3.6, fill: PALETTE[0], opacity: .82, class: "grow" });
      hoverable(c, () => "(" + numToStr(x) + ", " + numToStr(ys[i]) + ")");
      svg.append(c);
    });
    body.append(svg);
  }
  function shortNum(v) {
    const a = Math.abs(v);
    if (a >= 1e9) return (v / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
    if (a >= 1e6) return (v / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
    if (a >= 1e4) return (v / 1e3).toFixed(0) + "k";
    return numToStr(Math.round(v * 1000) / 1000);
  }
  function hoverable(node, text) {
    node.style.cursor = "crosshair";
    node.addEventListener("mouseenter", e => { tip.textContent = text(); tip.style.display = "block"; });
    node.addEventListener("mousemove", e => { tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY - 26) + "px"; });
    node.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  }

  /* ---- card chrome ---- */
  function card(ch) {
    const n = el("div", "chartcard");
    n.style.cssText = "left:" + ch.x + "px;top:" + ch.y + "px;width:" + (ch.w + 4) + "px";
    const head = el("div", "ch-head");
    const title = el("div", "ch-title", rectLabel(ch.rect));
    head.append(title);
    ["bar", "line", "pie", "scatter"].forEach(t => {
      const b = el("button", "ch-t" + (ch.type === t ? " on" : ""), t);
      b.onclick = () => { ch.type = t; Array.from(head.querySelectorAll(".ch-t")).forEach(x => x.classList.toggle("on", x.textContent === t)); render(ch); Persist.save(); };
      head.append(b);
    });
    const x = el("button", "ch-x", "✕");
    x.onclick = () => remove(ch.id);
    head.append(x);
    n.append(head, el("div", "ch-body"));
    host.append(n);
    ch.node = n;
    // drag by the header
    head.addEventListener("mousedown", e => {
      if (e.target.closest("button")) return;
      const sx = e.clientX - ch.x, sy = e.clientY - ch.y;
      const move = ev => {
        ch.x = clamp(ev.clientX - sx, 0, innerWidth - 120);
        ch.y = clamp(ev.clientY - sy, 0, innerHeight - 40);
        n.style.left = ch.x + "px"; n.style.top = ch.y + "px";
      };
      const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); Persist.save(); };
      window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
      e.preventDefault();
    });
    render(ch);
    return n;
  }

  function add(rect, type, xy) {
    rect = rect || Grid.rect();
    if (rect.r1 === rect.r2 && rect.c1 === rect.c2) {
      // one cell selected: chart whatever contiguous block it belongs to
      const u = Engine.usedRange();
      rect = { r1: rect.r1, c1: rect.c1, r2: Math.min(u.r2, rect.r1 + 20), c2: Math.min(u.c2, rect.c1 + 3) };
    }
    if (!analyze(rect)) { toast("Select a range with some numbers in it"); return null; }
    while (charts.length >= MAX) remove(charts[0].id);
    const p = Grid.rangePx(rect);
    const b = Grid.scroller.getBoundingClientRect();
    const ch = {
      id: nextId++, rect, type: type || "auto",
      x: xy ? xy.x : clamp(b.left + p.x - Grid.scroller.scrollLeft + p.w + 18, 12, innerWidth - 340),
      y: xy ? xy.y : clamp(b.top + p.y - Grid.scroller.scrollTop, 60, innerHeight - 260),
      w: 320, h: 190,
    };
    charts.push(ch);
    card(ch);
    Persist.save();
    return ch;
  }
  function remove(id) {
    const i = charts.findIndex(c => c.id === id);
    if (i < 0) return;
    charts[i].node.remove();
    charts.splice(i, 1);
    Persist.save();
  }
  function clearAll() { charts.slice().forEach(c => remove(c.id)); }
  function redrawAll() { charts.forEach(render); }

  Engine.on((kind, payload) => {
    if (kind !== "recalc" || !charts.length) return;
    const keys = payload.order || [];
    for (const ch of charts) {
      if (keys.some(k => { const p = parseKey(k); return p && p.r >= ch.rect.r1 && p.r <= ch.rect.r2 && p.c >= ch.rect.c1 && p.c <= ch.rect.c2; })) render(ch);
    }
  });

  return {
    add, remove, clearAll, redrawAll, reposition() {},
    serialize: () => charts.map(c => ({ rect: c.rect, type: c.type, x: c.x, y: c.y })),
    load(list) {
      clearAll();
      (list || []).forEach(c => { const ch = { id: nextId++, rect: c.rect, type: c.type || "auto", x: c.x, y: c.y, w: 320, h: 190 }; charts.push(ch); card(ch); });
    },
    get count() { return charts.length; },
  };
})();

/* ============================================================ *
 * ===== FEATURE: GOAL SEEK (§8.5) =============================
 * Bracket expansion → bisection, secant as a fallback. The
 * solve itself takes about a millisecond; the 1.5 s of animated
 * convergence afterwards is pure theatre, and worth every frame.
 * ============================================================ */
const GoalSeek = (() => {
  const boxes = [];
  function highlight(keys, color) {
    clearBoxes();
    const b = Grid.scroller.getBoundingClientRect();
    for (const k of keys) {
      const p = parseKey(k);
      const px = Grid.rangePx({ r1: p.r, c1: p.c, r2: p.r, c2: p.c });
      const n = el("div");
      n.style.cssText = "position:fixed;z-index:170;pointer-events:none;border:2px solid " + color +
        ";border-radius:3px;box-shadow:0 0 0 4px " + color + "33;left:" + (b.left + px.x - Grid.scroller.scrollLeft) +
        "px;top:" + (b.top + px.y - Grid.scroller.scrollTop) + "px;width:" + px.w + "px;height:" + px.h + "px";
      document.body.append(n);
      boxes.push(n);
    }
  }
  function clearBoxes() { boxes.splice(0).forEach(n => n.remove()); }

  /** Does `target` transitively read `variable`? Walk the real dep graph. */
  function reaches(variable, target) {
    const seen = new Set([variable]);
    const q = [variable];
    while (q.length) {
      const k = q.pop();
      for (const d of Engine.dependentsOf(k)) {
        if (d === target) return true;
        if (!seen.has(d)) { seen.add(d); q.push(d); }
      }
    }
    return false;
  }
  /** Guess a sensible variable: the nearest literal number this formula reads. */
  function guessVariable(target) {
    const seen = new Set([target]);
    let frontier = [target];
    for (let depth = 0; depth < 6 && frontier.length; depth++) {
      const next = [];
      for (const k of frontier) {
        const cell = Engine.cell(k);
        if (!cell) continue;
        const cands = [];
        if (cell.refs) cands.push(...cell.refs);
        if (cell.ranges) for (const rc of cell.ranges) { let n = 0; for (const kk of rectKeys(rc)) { if (n++ > 40) break; cands.push(kk); } }
        for (const c of cands) {
          if (seen.has(c)) continue;
          seen.add(c);
          const cc = Engine.cell(c);
          if (cc && !cc.ast && typeof cc.value === "number") return c;
          next.push(c);
        }
      }
      frontier = next;
    }
    return null;
  }

  function solve(varKey, targetKey, goal, trace) {
    const original = (Engine.cell(varKey) || { raw: "" }).raw;
    const f = x => {
      Engine.set(varKey, numToStr(x));
      const v = Engine.value(targetKey);
      if (trace) trace.push({ x, y: typeof v === "number" ? v : NaN });
      return typeof v === "number" ? v - goal : NaN;
    };
    const x0 = Engine.value(varKey);
    const start = typeof x0 === "number" ? x0 : 1;
    const tol = 1e-7 * Math.max(1, Math.abs(goal));
    let iters = 0, best = null;

    // 1. expand a bracket around the starting point
    let lo = start, hi = start, flo = f(lo), fhi = flo;
    iters++;
    if (isNaN(flo)) { Engine.set(varKey, original); return { ok: false, reason: "target isn't numeric" }; }
    if (Math.abs(flo) <= tol) { Engine.set(varKey, original); return { ok: true, x: start, iters, exact: true }; }
    let step = Math.max(1, Math.abs(start) * 0.5);
    for (let i = 0; i < 60 && iters < 200; i++, step *= 1.8) {
      lo = start - step; hi = start + step;
      flo = f(lo); fhi = f(hi); iters += 2;
      if (isNaN(flo) || isNaN(fhi)) continue;
      if (flo * fhi <= 0) { best = { lo, hi, flo, fhi }; break; }
    }
    // 2. bisection inside the bracket
    if (best) {
      let { lo: a, hi: b, flo: fa } = best;
      for (; iters < 200; iters++) {
        const m = (a + b) / 2, fm = f(m);
        if (Math.abs(fm) <= tol || Math.abs(b - a) < 1e-12 * Math.max(1, Math.abs(m))) {
          Engine.set(varKey, original);
          return { ok: true, x: m, iters };
        }
        if (fa * fm <= 0) b = m; else { a = m; fa = fm; }
      }
      Engine.set(varKey, original);
      return { ok: false, reason: "ran out of iterations" };
    }
    // 3. no sign change anywhere — try the secant method
    let p0 = start, p1 = start + (Math.abs(start) > 1e-9 ? start * 0.01 : 0.01);
    let f0 = f(p0), f1 = f(p1);
    iters += 2;
    for (; iters < 200; iters++) {
      if (!isFinite(f1) || Math.abs(f1 - f0) < 1e-15) break;
      const p2 = p1 - f1 * (p1 - p0) / (f1 - f0);
      if (!isFinite(p2)) break;
      const f2 = f(p2);
      if (Math.abs(f2) <= tol) { Engine.set(varKey, original); return { ok: true, x: p2, iters }; }
      p0 = p1; f0 = f1; p1 = p2; f1 = f2;
    }
    Engine.set(varKey, original);
    return { ok: false, reason: "couldn't find a solution" };
  }

  function dialog() {
    const target = Grid.activeKey();
    const tp = parseKey(target);
    const guess = guessVariable(target);
    const f1 = Modal.field("Set cell", { type: "text", value: A1(tp.r, tp.c) });
    const f2 = Modal.field("To value", { type: "text", value: "0" });
    const f3 = Modal.field("By changing cell", { type: "text", value: guess ? A1(parseKey(guess).r, parseKey(guess).c) : "" });
    const note = el("div", "note", "Tip: the “by changing” cell must hold a plain number, and the target must depend on it. We pre-filled a guess from the dependency graph.");
    Modal.open("Goal Seek", "Solve backwards: pick the answer, let the sheet find the input.",
      [f1.wrap, f2.wrap, f3.wrap, note],
      [{ label: "Cancel", onClick: c => c() }, {
        label: "Solve", primary: true, onClick: close => {
          const a = parseA1(f1.input.value), b = parseA1(f3.input.value);
          const goal = Number(f2.input.value);
          if (!a) return toast("“Set cell” isn't a valid reference");
          if (!b) return toast("“By changing” isn't a valid reference");
          if (!isFinite(goal)) return toast("Target value must be a number");
          const tk = K(a.r, a.c), vk = K(b.r, b.c);
          const tc = Engine.cell(tk), vc = Engine.cell(vk);
          if (!tc || !tc.ast) return toast(A1(a.r, a.c) + " isn't a formula — there's nothing to solve");
          if (!vc || vc.ast || typeof vc.value !== "number") return toast(A1(b.r, b.c) + " must contain a plain number");
          if (!reaches(vk, tk)) return toast(A1(a.r, a.c) + " doesn't depend on " + A1(b.r, b.c));
          close();
          run(vk, tk, goal);
        }
      }]);
  }

  function run(varKey, targetKey, goal) {
    const t0 = performance.now();
    const trace = [];
    const res = solve(varKey, targetKey, goal, trace);
    const ms = performance.now() - t0;
    if (!res.ok) { toast("Goal Seek failed — " + res.reason); return; }

    // Sample ~30 frames out of however many iterations it actually took.
    const frames = [];
    const want = Math.min(30, trace.length);
    for (let i = 0; i < want; i++) frames.push(trace[Math.floor(i * (trace.length - 1) / Math.max(1, want - 1))]);
    frames.push({ x: res.x });

    highlight([varKey, targetKey], getComputedStyle(document.documentElement).getPropertyValue("--green").trim() || "#16a34a");
    Commands.beginGesture("Goal Seek " + A1(parseKey(targetKey).r, parseKey(targetKey).c) + " = " + numToStr(goal), [varKey]);
    let i = 0;
    const timer = setInterval(() => {
      if (i >= frames.length) {
        clearInterval(timer);
        Commands.gestureWrite(varKey, { raw: numToStr(Math.round(res.x * 1e9) / 1e9) });
        Commands.endGesture();
        clearBoxes();
        [varKey, targetKey].forEach(k => { const n = Grid.node(k); if (n) { n.classList.add("gsdone"); setTimeout(() => n.classList.remove("gsdone"), 700); } });
        toast(A1(parseKey(varKey).r, parseKey(varKey).c) + " = " + numToStr(Math.round(res.x * 1e4) / 1e4) +
              " (" + res.iters + " iterations, " + (ms / 1000).toFixed(1) + " s)", { ms: 5000 });
        Persist.save();
        return;
      }
      Commands.gestureWrite(varKey, { raw: numToStr(Math.round(frames[i].x * 1e9) / 1e9) });
      i++;
    }, 50);   // 20 fps
  }

  return { dialog, run, solve, reaches };
})();

/* ============================================================ *
 * ===== FEATURE: =AI() (§8.8) =================================
 * Mock Mode is the default and needs no key, no network and no
 * apology: hash(prompt+input) seeds a deterministic fake model,
 * so a demo recorded today looks identical tomorrow. Add a key
 * in Settings and the same formula hits claude-haiku-latest,
 * resolving asynchronously through the normal recalc path.
 * ============================================================ */
const AIRuntime = (() => {
  const KEYSTORE = "onesheet.anthropic-key";
  const cache = new Map();     // hash -> resolved value (string or Err)
  const inflight = new Map();  // hash -> Promise
  let apiKey = "";
  try { apiKey = localStorage.getItem(KEYSTORE) || ""; } catch (e) { apiKey = ""; }

  const SENTIMENTS = ["positive", "negative", "neutral"];
  function tsvOf(v) {
    if (!(v instanceof RangeRef)) return v == null ? "" : Engine.str(v);
    return grid2d(v).map(row => row.map(x => x == null ? "" : Engine.str(x)).join("\t")).join("\n").slice(0, 4000);
  }
  /** Pull the option list out of prompts like "categorize as fruit/vegetable". */
  function options(prompt) {
    let m = /(?:as|into|either)\s+([^.?!]+)/i.exec(prompt);
    const tail = m ? m[1] : prompt;
    let parts = tail.split("/").map(s => s.trim()).filter(Boolean);
    if (parts.length < 2) parts = tail.split(/\s*(?:,|\bor\b)\s*/i).map(s => s.trim()).filter(Boolean);
    parts = parts.map(p => p.replace(/^["'`]|["'`]$/g, "").replace(/\s{2,}/g, " ")).filter(p => p && p.length < 28);
    return parts.length >= 2 ? parts : null;
  }
  function mock(prompt, input, h) {
    const rnd = seeded(h);
    const p = prompt.toLowerCase();
    const pick = list => list[Math.floor(rnd() * list.length) % list.length];
    if (/categori[sz]|classif|label|bucket|tag as/.test(p)) {
      const opts = options(prompt);
      return opts ? pick(opts) : pick(["A", "B", "C"]);
    }
    if (/sentiment|tone|mood|positive or negative/.test(p)) return pick(SENTIMENTS);
    if (/summari[sz]|tl;?dr|shorten|condense/.test(p)) {
      const src = (input || prompt).replace(/\s+/g, " ").trim();
      const words = src.split(" ").slice(0, 8).join(" ");
      return words + (src.split(" ").length > 8 ? "…" : "");
    }
    if (/translat/.test(p)) {
      const src = (input || prompt.replace(/translate[^:]*:?/i, "")).trim();
      return src.split("").reverse().join("") + " (mock)";
    }
    if (/extract|pull out|find the/.test(p)) {
      const m = /(\d[\d,.]*)/.exec(input || "");
      return m ? m[1] : "—";
    }
    return "🤖 mock: try 'categorize', 'sentiment', 'summarize'";
  }

  async function fire(h, prompt, input, cellKey) {
    const body = {
      model: "claude-haiku-latest",
      max_tokens: 200,
      system: "You are a spreadsheet cell. Answer with the value only — no preamble, no explanation, no markdown, no trailing punctuation unless it belongs in the value. Keep it under 15 words.",
      messages: [{ role: "user", content: prompt + (input ? "\n\nInput:\n" + input : "") }],
    };
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error("HTTP " + res.status + " " + (await res.text()).slice(0, 200));
      const json = await res.json();
      const text = (json.content || []).filter(b => b.type === "text").map(b => b.text).join("").trim();
      cache.set(h, text || "");
    } catch (e) {
      console.warn("[OneSheet] AI call failed:", e);
      cache.set(h, new Err("#AI!"));
      toast("AI call failed — check your key in AI settings");
    } finally {
      inflight.delete(h);
      // Rejoin the normal recalc path so dependents update too.
      Engine.recalc([cellKey]);
      Grid.invalidate([cellKey]);
    }
  }

  function evaluate(args, ctx) {
    if (!args.length) return new Err("#VALUE!");
    if (args[0] instanceof Err) return args[0];
    const prompt = Engine.str(args[0] instanceof RangeRef ? flat1d(args[0])[0] : args[0]);
    const input = args.length > 1 ? tsvOf(args[1]) : "";
    const h = hash32(prompt + "␀" + input + "␀" + (apiKey ? "live" : "mock"));
    const cell = Engine.cell(ctx.key);
    if (cell) cell.ai = true;
    if (!apiKey) return mock(prompt, input, h);
    if (cache.has(h)) return cache.get(h);
    if (!inflight.has(h)) inflight.set(h, fire(h, prompt, input, ctx.key));
    return new Pending(h);
  }

  function settings() {
    const f = Modal.field("Anthropic API key", { type: "password", value: apiKey, placeholder: "sk-ant-…" });
    const note = el("div", "note",
      "Stays in your browser. It is written to localStorage on this device only and sent straight to api.anthropic.com — OneSheet has no server to send it to. " +
      "Leave it empty to stay in Mock Mode, which works offline and always returns the same answer for the same inputs.");
    Modal.open("AI settings", apiKey ? "Real mode: calls claude-haiku-latest." : "Mock mode: deterministic, offline, zero-config.",
      [f.wrap, note],
      [
        { label: "Clear key", onClick: close => { apiKey = ""; try { localStorage.removeItem(KEYSTORE); } catch (e) {} cache.clear(); close(); toast("Back to Mock Mode"); Engine.rebuildAll(); Grid.scheduleRender(); } },
        { label: "Cancel", onClick: close => close() },
        { label: "Save", primary: true, onClick: close => {
            apiKey = f.input.value.trim();
            try { apiKey ? localStorage.setItem(KEYSTORE, apiKey) : localStorage.removeItem(KEYSTORE); } catch (e) { toast("Couldn't write to localStorage"); }
            cache.clear(); inflight.clear();
            close();
            toast(apiKey ? "Real mode on — =AI() now calls claude-haiku-latest" : "Mock Mode");
            Engine.rebuildAll(); Grid.scheduleRender();
          } },
      ]);
  }

  return {
    evaluate, settings,
    hasKey: () => !!apiKey,
    clearCache() { cache.clear(); inflight.clear(); Engine.rebuildAll(); Grid.scheduleRender(); toast("AI cache cleared"); },
    get cacheSize() { return cache.size; },
  };
})();

/* ============================================================ *
 * ===== IO: CSV / XLSX / PERSISTENCE / SHARE (§8.7, §8.9) =====
 * SheetJS is the single external dependency and it is fetched
 * lazily — the first time you touch .xlsx and never before.
 * With the network off, everything else still works.
 * ============================================================ */
const IO = (() => {
  const CDN = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  let sheetjs = null;

  /** Squash Excel's number-format zoo down to our six patterns (§4).
   *  Literals and colour/condition brackets are stripped first, otherwise
   *  `[Red]` in a currency format reads as a "d" and looks like a date. */
  function mapNumFmt(z) {
    const clean = z.replace(/"[^"]*"/g, "").replace(/\[[^\]]*\]/g, "").replace(/\\./g, "");
    if (/[yd]/i.test(clean) || /m{3,}/i.test(clean)) return "date";
    if (clean.includes("%")) return "0%";
    if (/[$£€¥]/.test(z)) return "$#,##0.00";
    if (/#,##0\.00/.test(clean)) return "0.00";
    if (/#,##0/.test(clean)) return "#,##0";
    if (/0\.0+/.test(clean)) return "0.00";
    return null;
  }

  /** Function names in an AST that we don't implement. */
  function unknownFns(ast) {
    const out = new Set();
    (function walk(n) {
      if (!n) return;
      switch (n.t) {
        case "call": if (!FN[n.n]) out.add(n.n); n.args.forEach(walk); break;
        case "bin": walk(n.l); walk(n.r); break;
        case "un": case "pct": case "paren": walk(n.e); break;
      }
    })(ast);
    return Array.from(out);
  }

  function loadSheetJS() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (sheetjs) return sheetjs;
    sheetjs = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = CDN;
      // deliberately no crossOrigin: we only execute this script, never read
      // its source, and requiring CORS headers only creates ways to fail.
      s.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error("loaded but empty"));
      s.onerror = () => { sheetjs = null; rej(new Error("offline")); };
      document.head.append(s);
    });
    return sheetjs;
  }
  function download(name, blob) {
    const a = el("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.append(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  const csvEscape = s => /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;

  /* ---------------- CSV ---------------- */
  function importCSV(text, name) {
    const sep = text.split("\n")[0].includes("\t") && !text.split("\n")[0].includes(",") ? "\t" : ",";
    const rows = Clipboard.parseDelimited(text, sep);
    const total = rows.reduce((a, r) => a + r.length, 0);
    const go = () => {
      const writes = [];
      rows.forEach((row, i) => row.forEach((v, j) => {
        if (i + 1 > MAXROW || j + 1 > MAXCOL) return;
        if (v !== "") writes.push([K(i + 1, j + 1), { raw: v }]);
      }));
      Commands.apply("Import " + (name || "CSV") + " (" + writes.length + " cells)", writes);
      Grid.select(1, 1, false);
      toast(writes.length.toLocaleString() + " cells imported from " + (name || "CSV"));
      Persist.save();
    };
    if (total > 50000) {
      Modal.open("That's a big file", total.toLocaleString() + " cells. It'll work, but the first render may take a moment.", [],
        [{ label: "Cancel", onClick: c => c() }, { label: "Import anyway", primary: true, onClick: c => { c(); go(); } }]);
    } else go();
  }
  function exportCSV() {
    const q = Engine.usedRange();
    const lines = [];
    for (let r = q.r1; r <= q.r2; r++) {
      const row = [];
      for (let c = q.c1; c <= q.c2; c++) row.push(csvEscape(displayText(Engine.cell(K(r, c)))));
      lines.push(row.join(","));
    }
    download("onesheet.csv", new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8" }));
    toast("Exported " + (q.r2 - q.r1 + 1) + " rows as CSV");
  }

  /* ---------------- XLSX ---------------- */
  async function importXLSX(file) {
    let XLSX;
    try { XLSX = await loadSheetJS(); }
    catch (e) {
      toast("Couldn't reach the CDN for the .xlsx reader — CSV import still works offline", { ms: 5000 });
      return;
    }
    const buf = await file.arrayBuffer();
    let wb;
    // cellNF gives us the number-format strings; without it every date comes
    // through as a bare serial and the sheet looks like it lost the dates.
    try { wb = XLSX.read(new Uint8Array(buf), { type: "array", cellFormula: true, cellNF: true, cellStyles: false }); }
    catch (e) { console.warn(e); toast("That file didn't parse as .xlsx"); return; }
    const name = wb.SheetNames[0];
    const ws = wb.Sheets[name];
    if (!ws || !ws["!ref"]) { toast("The first worksheet is empty"); return; }
    const range = XLSX.utils.decode_range(ws["!ref"]);
    const writes = [];
    let nCells = 0, nFormulas = 0, nDowngraded = 0;

    for (let R = range.s.r; R <= range.e.r; R++) {
      for (let C = range.s.c; C <= range.e.c; C++) {
        const r = R + 1, c = C + 1;
        if (r > MAXROW || c > MAXCOL) continue;
        const addr = XLSX.utils.encode_cell({ r: R, c: C });
        const cell = ws[addr];
        if (!cell) continue;
        // Every cell is wrapped: one weird formula must never abort the import.
        try {
          let raw = null, fmt = null, imported = false;
          if (cell.f) {
            nFormulas++;
            const f = String(cell.f).replace(/^=/, "");
            try {
              const ast = parseFormula(f);
              // Parsing is necessary but not sufficient: SUMPRODUCT(...) is
              // valid syntax we'd evaluate to #NAME?. Keeping Excel's computed
              // value is more honest than showing an error where a number was.
              const missing = unknownFns(ast);
              if (missing.length) throw new Error("unsupported: " + missing.join(", "));
              raw = "=" + f;
            } catch (err) { nDowngraded++; imported = true; raw = valueRaw(cell); }
          } else raw = valueRaw(cell);
          if (cell.t === "n" && cell.z) { const nf = mapNumFmt(String(cell.z)); if (nf) fmt = { numFmt: nf }; }
          if (raw === "" || raw == null) continue;
          const spec = { raw };
          if (fmt) spec.fmt = fmt;
          if (imported) spec.imported = true;
          writes.push([K(r, c), spec]);
          nCells++;
        } catch (err) { console.warn("[OneSheet] skipped cell " + addr, err); }
      }
    }
    function valueRaw(cell) {
      if (cell.t === "b") return cell.v ? "TRUE" : "FALSE";
      if (cell.t === "e") return "#N/A";
      if (cell.t === "d") return "'" + new Date(cell.v).toISOString().slice(0, 10);
      if (cell.t === "n") return numToStr(cell.v);
      const s = cell.w != null ? String(cell.w) : String(cell.v == null ? "" : cell.v);
      // "007" is a part number, not the number seven — keep it text
      return /^0\d/.test(s) ? "'" + s : s;
    }

    const merges = (ws["!merges"] || []).length;
    Commands.apply("Import " + file.name + " (" + nCells + " cells)", writes);
    Grid.select(1, 1, false);
    Persist.save();
    const bits = [nCells.toLocaleString() + " cells", nFormulas + " formulas" + (nDowngraded ? " (" + nDowngraded + " as values)" : "")];
    if (merges) bits.push(merges + " merged → top-left");
    toast(bits.join(", "), { ms: 5200 });
    if (nDowngraded) toast("Cells we couldn't parse are underlined — hover for why", { ms: 4000 });
  }

  async function exportXLSX() {
    let XLSX;
    try { XLSX = await loadSheetJS(); }
    catch (e) { toast("Couldn't reach the CDN for the .xlsx writer — try CSV export"); return; }
    const q = Engine.usedRange();
    const ws = {};
    for (let r = q.r1; r <= q.r2; r++) {
      for (let c = q.c1; c <= q.c2; c++) {
        const cell = Engine.cell(K(r, c));
        if (!cell || (!cell.raw && !cell.fmt)) continue;
        const addr = XLSX.utils.encode_cell({ r: r - 1, c: c - 1 });
        const v = cell.value;
        const out = {};
        if (cell.raw && cell.raw[0] === "=" && !widgetOf(cell)) out.f = cell.raw.slice(1);
        if (typeof v === "number") { out.t = "n"; out.v = v; }
        else if (typeof v === "boolean") { out.t = "b"; out.v = v; }
        else if (v instanceof Err) { out.t = "e"; out.v = 0x2A; }
        else if (v == null) { if (!out.f) continue; out.t = "s"; out.v = ""; }
        else { out.t = "s"; out.v = String(displayText(cell)); }
        if (cell.fmt && cell.fmt.numFmt === "date") out.z = "dd mmm yyyy";
        else if (cell.fmt && cell.fmt.numFmt === "0%") out.z = "0%";
        else if (cell.fmt && cell.fmt.numFmt) out.z = cell.fmt.numFmt;
        ws[addr] = out;
      }
    }
    ws["!ref"] = XLSX.utils.encode_range({ s: { r: q.r1 - 1, c: q.c1 - 1 }, e: { r: q.r2 - 1, c: q.c2 - 1 } });
    ws["!cols"] = [];
    for (let c = q.c1; c <= q.c2; c++) ws["!cols"].push({ wpx: Grid.width(c) });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "OneSheet");
    const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    download("onesheet.xlsx", new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    toast("Exported as .xlsx — formulas included");
  }

  /* ---------------- drag & drop ---------------- */
  function handleFile(file) {
    if (!file) return;
    if (/\.(xlsx|xlsm|xlsb)$/i.test(file.name)) return importXLSX(file);
    const reader = new FileReader();
    reader.onload = () => importCSV(String(reader.result), file.name);
    reader.readAsText(file);
  }
  window.addEventListener("dragover", e => { e.preventDefault(); document.body.style.outline = "3px dashed var(--accent)"; document.body.style.outlineOffset = "-6px"; });
  window.addEventListener("dragleave", e => { if (e.relatedTarget === null) document.body.style.outline = ""; });
  window.addEventListener("drop", e => {
    e.preventDefault();
    document.body.style.outline = "";
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  function pickFile(accept) {
    const inp = el("input");
    inp.type = "file";
    inp.accept = accept || ".csv,.tsv,.txt,.xlsx";
    inp.onchange = () => handleFile(inp.files[0]);
    inp.click();
  }

  return { importCSV, exportCSV, importXLSX, exportXLSX, handleFile, pickFile, loadSheetJS, download };
})();

/* ------------------------------------------------------------ *
 * Persistence + share links
 * ------------------------------------------------------------ */
const Persist = (() => {
  const STORE = "onesheet.state.v1";
  let readOnly = false;
  let ready = false;

  function serialize() {
    return {
      v: 1,
      cells: Engine.snapshot(),
      cols: Grid.dumpColWidths(),
      charts: Charts.serialize(),
      theme: document.documentElement.dataset.theme,
      sel: rectLabel(Grid.rect()),
    };
  }
  function hydrate(state) {
    if (!state || !state.cells) return false;
    Engine.restore(state.cells);
    Grid.setColWidths(state.cols);
    Charts.load(state.charts);
    if (state.theme) Theme.set(state.theme, true);
    Commands.reset(Engine.snapshot());
    if (state.sel) {
      const p = parseA1(String(state.sel).split(":")[0]);
      if (p) Grid.select(p.r, p.c, false);
    }
    Grid.scheduleRender();
    return true;
  }

  const save = debounce(() => {
    if (!ready || readOnly) return;
    try { localStorage.setItem(STORE, JSON.stringify(serialize())); }
    catch (e) { console.warn("[OneSheet] autosave failed (quota?)", e); }
  }, 500);

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }
  function clear() { try { localStorage.removeItem(STORE); } catch (e) {} }

  /* ---- share links: deflate-raw + base64url in the hash ---- */
  const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const unb64url = s => { const t = s.replace(/-/g, "+").replace(/_/g, "/"); const bin = atob(t + "=".repeat((4 - t.length % 4) % 4)); return Uint8Array.from(bin, ch => ch.charCodeAt(0)); };

  async function encode(str) {
    if (typeof CompressionStream === "undefined") return "p" + b64url(new TextEncoder().encode(str));
    const cs = new CompressionStream("deflate-raw");
    const w = cs.writable.getWriter();
    w.write(new TextEncoder().encode(str)); w.close();
    const buf = await new Response(cs.readable).arrayBuffer();
    return "d" + b64url(new Uint8Array(buf));
  }
  async function decode(payload) {
    const kind = payload[0], body = unb64url(payload.slice(1));
    if (kind === "p") return new TextDecoder().decode(body);
    const ds = new DecompressionStream("deflate-raw");
    const w = ds.writable.getWriter();
    w.write(body); w.close();
    return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
  }

  async function share() {
    const json = JSON.stringify(serialize());
    const payload = await encode(json);
    if (payload.length > 8192) {
      toast("Too big to share as a link (" + Math.round(payload.length / 1024) + " KB) — export a file instead", { ms: 5000 });
      return;
    }
    const url = location.origin + location.pathname + "#s=" + payload;
    const ok = await Clipboard.writeOS(url);
    toast(ok ? "Share link copied — " + Math.round(payload.length / 1024 * 10) / 10 + " KB in the URL" : "Couldn't reach the clipboard; the link is in the address bar");
    if (!ok) location.hash = "s=" + payload;
  }

  async function loadFromHash() {
    const m = /[#&]s=([^&]+)/.exec(location.hash);
    if (!m) return false;
    try {
      const state = JSON.parse(await decode(decodeURIComponent(m[1])));
      hydrate(state);
      readOnly = true;
      $("#readonlyBar").classList.add("on");
      return true;
    } catch (e) {
      console.warn("[OneSheet] bad share link", e);
      toast("That share link didn't decode");
      return false;
    }
  }
  function makeCopy() {
    readOnly = false;
    $("#readonlyBar").classList.remove("on");
    history.replaceState(null, "", location.pathname + location.search);
    save();
    toast("Copied into your sheet — edit away");
  }

  Commands.on(() => save());
  return {
    serialize, hydrate, save, load, clear, share, loadFromHash, makeCopy,
    get readOnly() { return readOnly; },
    setReady(v) { ready = v; },
  };
})();
$("#btnMakeCopy").onclick = () => Persist.makeCopy();

  [["general", "General"], ["0.00", "Number (0.00)"], ["#,##0", "Thousands (#,##0)"], ["0%", "Percent"], ["$#,##0.00", "Currency"], ["date", "Date"]]

  A("autofit", "Autofit column width", "Format", () => { const q = selRect(); for (let c = q.c1; c <= q.c2; c++) Grid.autofit(c); }, null, "↔");

  A("chart-clear", "Close all charts", "Analyse", () => { Charts.clearAll(); toast("Charts closed"); }, null, "✕");
  A("spark", "Insert sparkline for selection", "Analyse", () => {

    Grid.select(parseKey(target).r, parseKey(target).c, false);
  }, null, "∿");

  /* --- widgets --- */
  A("widget-slider", "Turn into slider…", "Widgets", () => Widgets.convert("slider"), null, "⇹");

  }, null, "✦");

  A("shake", "Shake volatiles (re-roll RAND/NOW)", "View", () => {

/* ============================================================ *
 * ===== DESIGN TOKENS =========================================
 * Three themes share one variable surface: light (default),
 * dark, and win97. Every component reads only from these vars,
 * which is why the Excel 97 toggle is a single attribute flip.
 * ============================================================ */
:root{
  --bg:#fafafa; --canvas:#ffffff; --panel:#ffffff; --panel-2:#f4f4f5;
  --ink:#1a1a1a; --ink-2:#52525b; --muted:#8b8b94;
  --line:#e6e6ea; --line-2:#d4d4d8; --gridline:#ececf1;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#eef2ff; --accent-line:#c7d2fe;
  --blue:#2563eb; --orange:#ea580c; --red:#dc2626; --green:#16a34a; --amber:#f59e0b;
  --shadow:0 1px 2px rgba(16,18,32,.06),0 8px 24px -6px rgba(16,18,32,.14);
  --shadow-lg:0 2px 6px rgba(16,18,32,.08),0 24px 60px -12px rgba(16,18,32,.28);
  --radius:10px; --radius-sm:6px;
  --cell-h:24px; --head-w:48px; --head-h:24px; --cell-fs:13px;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sel-bg:rgba(79,70,229,.08);
  --bevel-out:none; --bevel-in:none;
}
[data-theme="dark"]{
  --bg:#111318; --canvas:#15171d; --panel:#1a1d25; --panel-2:#22262f;
  --ink:#e7e9ee; --ink-2:#a8adba; --muted:#767c8c;
  --line:#272b35; --line-2:#333846; --gridline:#22262f;
  --accent:#7c74ff; --accent-ink:#0b0d12; --accent-soft:#1e1c3a; --accent-line:#3a3570;
  --blue:#5b93ff; --orange:#ff8a4c; --red:#ff6b6b; --green:#4ade80; --amber:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -6px rgba(0,0,0,.5);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 60px -12px rgba(0,0,0,.7);
  --sel-bg:rgba(124,116,255,.14);
}
/* ---- Excel 97. Silver, beveled, gloriously wrong for 2026. ---- */
[data-theme="win97"]{
  --bg:#008080; --canvas:#ffffff; --panel:#c0c0c0; --panel-2:#c0c0c0;
  --ink:#000000; --ink-2:#000000; --muted:#808080;
  --line:#808080; --line-2:#808080; --gridline:#c6c6c6;
  --accent:#000080; --accent-ink:#ffffff; --accent-soft:#000080; --accent-line:#000080;
  --blue:#0000a8; --orange:#a85400; --red:#a80000; --green:#008000; --amber:#a8a800;
  --shadow:none; --shadow-lg:2px 2px 0 rgba(0,0,0,.35);
  --radius:0px; --radius-sm:0px;
  --cell-h:20px; --head-h:20px; --head-w:44px; --cell-fs:12px;
  --font:"Pixelated MS Sans Serif",Tahoma,"MS Sans Serif",Geneva,sans-serif;
  --sel-bg:rgba(0,0,128,.10);
  --bevel-out:inset -1px -1px #0a0a0a,inset 1px 1px #ffffff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;
  --bevel-in:inset -1px -1px #ffffff,inset 1px 1px #0a0a0a,inset -2px -2px #dfdfdf,inset 2px 2px #808080;
}

/* ============================================================ *
 * ===== BASE ==================================================
 * ============================================================ */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;
  font-variant-numeric:tabular-nums;
}
[data-theme="win97"] body{-webkit-font-smoothing:none; font-smooth:never}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hidden{display:none !important}
kbd{
  font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:4px;
  background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink-2);
  box-shadow:0 1px 0 var(--line-2); white-space:nowrap;
}
[data-theme="win97"] kbd{box-shadow:var(--bevel-out);border:0;background:#c0c0c0}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:var(--panel-2)}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:3px solid var(--panel-2)}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
[data-theme="win97"] ::-webkit-scrollbar{width:16px;height:16px}
[data-theme="win97"] ::-webkit-scrollbar-track{background:#dfdfdf}
[data-theme="win97"] ::-webkit-scrollbar-thumb{background:#c0c0c0;border-radius:0;border:0;box-shadow:var(--bevel-out)}
[data-theme="win97"] ::-webkit-scrollbar-corner{background:#dfdfdf}

/* ============================================================ *
 * ===== APP SHELL =============================================
 * ============================================================ */
#app{
  position:fixed; inset:0; display:flex; flex-direction:column;
  background:var(--canvas);
}
[data-theme="win97"] #app{
  inset:8px; background:#c0c0c0; box-shadow:var(--bevel-out);
  padding:2px; border:1px solid #000;
}

/* --- fake 97 title bar --- */
#titlebar{display:none}
[data-theme="win97"] #titlebar{
  display:flex;align-items:center;gap:6px;height:20px;padding:0 2px 0 3px;
  background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;font-size:12px;
  flex:0 0 auto; user-select:none;
}
#titlebar .tb-icon{width:14px;height:14px;flex:0 0 auto}
#titlebar .sp{flex:1}
#titlebar .tb-btn{
  width:16px;height:14px;background:#c0c0c0;box-shadow:var(--bevel-out);
  display:grid;place-items:center;font-size:9px;color:#000;font-weight:700;line-height:1;
}
#titlebar .tb-btn:active{box-shadow:var(--bevel-in);padding:1px 0 0 1px}

/* --- fake 97 menu bar (menus actually work) --- */
#menubar{display:none}
[data-theme="win97"] #menubar{
  display:flex;align-items:stretch;height:19px;background:#c0c0c0;flex:0 0 auto;
  border-bottom:1px solid #dfdfdf; user-select:none; position:relative; z-index:60;
}
#menubar .mtop{padding:1px 8px;font-size:12px;display:flex;align-items:center}
#menubar .mtop:hover,#menubar .mtop.open{background:#000080;color:#fff}
.menu-pop{
  position:fixed;background:#c0c0c0;box-shadow:var(--bevel-out),2px 2px 0 rgba(0,0,0,.35);
  padding:2px;min-width:190px;z-index:400;font-size:12px;
}
.menu-pop .mi{padding:3px 22px 3px 20px;display:flex;justify-content:space-between;gap:24px;white-space:nowrap}
.menu-pop .mi:hover{background:#000080;color:#fff}
.menu-pop .mi .sc{color:#404040}
.menu-pop .mi:hover .sc{color:#c0c0c0}
.menu-pop .msep{height:2px;margin:3px 2px;box-shadow:inset 0 1px #808080,inset 0 -1px #fff}

/* ============================================================ *
 * ===== TOOLBAR ===============================================
 * ============================================================ */
#toolbar{
  flex:0 0 auto; display:flex; align-items:center; gap:6px;
  padding:8px 10px; border-bottom:1px solid var(--line);
  background:var(--panel); position:relative; z-index:30;
}
[data-theme="win97"] #toolbar{padding:2px 3px;gap:2px;border-bottom:1px solid #808080;box-shadow:0 1px 0 #dfdfdf}
.brand{display:flex;align-items:center;gap:8px;padding-right:10px;margin-right:2px;border-right:1px solid var(--line);user-select:none}
.brand svg{display:block}
.brand b{font-size:13.5px;letter-spacing:-.01em}
.brand .ver{font-size:10px;color:var(--muted);font-family:var(--mono)}
[data-theme="win97"] .brand{border-right:2px groove #dfdfdf}
[data-theme="win97"] .brand .ver{display:none}

.tb{
  height:28px;min-width:28px;padding:0 9px;border-radius:var(--radius-sm);
  display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);
  border:1px solid transparent;font-size:12.5px;white-space:nowrap;
  transition:background .12s,color .12s,border-color .12s;
}
.tb:hover{background:var(--panel-2);color:var(--ink)}
.tb.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.tb svg{display:block;flex:0 0 auto}
[data-theme="win97"] .tb{height:22px;padding:0 6px;border:0;box-shadow:none;border-radius:0}
[data-theme="win97"] .tb:hover{box-shadow:var(--bevel-out);background:#c0c0c0}
[data-theme="win97"] .tb.on{box-shadow:var(--bevel-in);background:#b8b8b8;color:#000}
.tb-sep{width:1px;height:20px;background:var(--line);margin:0 3px}
[data-theme="win97"] .tb-sep{box-shadow:inset 1px 0 #808080,inset -1px 0 #fff;width:2px;background:none}
.spacer{flex:1}
.sel{
  height:28px;border:1px solid var(--line-2);border-radius:var(--radius-sm);
  background:var(--panel);padding:0 6px;font-size:12.5px;color:var(--ink-2);
}
[data-theme="win97"] .sel{height:21px;border:0;box-shadow:var(--bevel-in);background:#fff;border-radius:0}
.tb.ghost{color:var(--muted);font-family:var(--mono);font-size:11px;pointer-events:none}

/* ============================================================ *
 * ===== FORMULA BAR ===========================================
 * ============================================================ */
#fbar{
  flex:0 0 auto;display:flex;align-items:stretch;gap:0;height:30px;
  border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:25;
}
[data-theme="win97"] #fbar{height:22px;background:#c0c0c0;border-bottom:1px solid #808080;box-shadow:0 1px 0 #dfdfdf;padding:1px 2px;gap:2px}
#namebox{
  width:96px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
  border-right:1px solid var(--line);background:var(--panel-2);
}
[data-theme="win97"] #namebox{background:#fff;box-shadow:var(--bevel-in);border:0;width:80px;font-family:var(--font);font-size:12px}
#fxlabel{
  width:34px;flex:0 0 auto;display:grid;place-items:center;color:var(--muted);
  font-style:italic;font-family:Georgia,serif;font-size:14px;border-right:1px solid var(--line);
}
[data-theme="win97"] #fxlabel{border:0;width:26px}
.edit-shell{position:relative;flex:1;min-width:0}
.edit-shell input{
  position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;
  padding:0 10px;font-family:var(--mono);font-size:12.5px;letter-spacing:0;
  color:transparent;caret-color:var(--ink);outline:none;z-index:2;
}
.edit-shell .ghost{
  position:absolute;inset:0;padding:0 10px;font-family:var(--mono);font-size:12.5px;
  letter-spacing:0;white-space:pre;overflow:hidden;pointer-events:none;z-index:1;
  display:flex;align-items:center;color:var(--ink);
}
.edit-shell .ghost span{white-space:pre}
[data-theme="win97"] #fxshell{box-shadow:var(--bevel-in);background:#fff}
/* formula token colors — these same 6 hues are reused for range outlines */
.t-num{color:var(--green)} .t-str{color:var(--orange)} .t-fn{color:var(--accent);font-weight:600}
.t-op{color:var(--muted)} .t-err{color:var(--red)} .t-bool{color:var(--blue)}
.rc0{color:#2563eb}.rc1{color:#c026d3}.rc2{color:#059669}.rc3{color:#ea580c}.rc4{color:#7c3aed}.rc5{color:#0891b2}

/* ============================================================ *
 * ===== GRID ==================================================
 * ============================================================ */
#gridwrap{flex:1;position:relative;overflow:hidden;background:var(--canvas);min-height:0}
#corner{
  position:absolute;left:0;top:0;width:var(--head-w);height:var(--head-h);z-index:14;
  background:var(--panel-2);border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
  cursor:pointer;
}
#corner::after{content:"";position:absolute;right:3px;bottom:3px;border:5px solid transparent;border-right-color:var(--muted);border-bottom-color:var(--muted)}
[data-theme="win97"] #corner{background:#c0c0c0;box-shadow:var(--bevel-out)}
#colhead{
  position:absolute;left:var(--head-w);top:0;right:0;height:var(--head-h);overflow:hidden;z-index:12;
  background:var(--panel-2);border-bottom:1px solid var(--line-2);
}
#rowhead{
  position:absolute;left:0;top:var(--head-h);bottom:0;width:var(--head-w);overflow:hidden;z-index:12;
  background:var(--panel-2);border-right:1px solid var(--line-2);
}
[data-theme="win97"] #colhead,[data-theme="win97"] #rowhead{background:#c0c0c0}
#colheadInner,#rowheadInner{position:absolute;left:0;top:0;will-change:transform}
.hcell{
  position:absolute;left:0;top:0;height:var(--head-h);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--ink-2);user-select:none;
  border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
  background:var(--panel-2);
}
.hcell.rowh{width:var(--head-w)}
.hcell.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
[data-theme="win97"] .hcell{box-shadow:var(--bevel-out);border:0;font-size:11px}
[data-theme="win97"] .hcell.on{box-shadow:var(--bevel-in);background:#b0b0b0;color:#000}
.hres{position:absolute;top:0;bottom:0;width:7px;cursor:col-resize;z-index:3}
.hres.row{left:0;right:0;width:auto;height:7px;cursor:row-resize;top:auto}

#scroller{
  position:absolute;left:var(--head-w);top:var(--head-h);right:0;bottom:0;
  overflow:auto;overscroll-behavior:contain;
}
#canvas{position:relative;transform:translateZ(0)}
#cellLayer{position:absolute;left:0;top:0;width:100%;height:100%}

.c{
  position:absolute;left:0;top:0;height:var(--cell-h);
  padding:0 5px;display:flex;align-items:center;
  font-size:var(--cell-fs);line-height:var(--cell-h);
  border-right:1px solid var(--gridline);border-bottom:1px solid var(--gridline);
  overflow:hidden;white-space:pre;contain:strict;
  background:var(--canvas);
}
.c.num{justify-content:flex-end}
.c.bool{justify-content:center;text-transform:uppercase;color:var(--blue)}
.c.err{color:var(--red);font-weight:600}
.c.err::before{
  content:"";position:absolute;left:0;top:0;border:4px solid transparent;
  border-left-color:var(--red);border-top-color:var(--red);
}
.c.spill{overflow:visible;contain:layout style;z-index:2;border-right-color:transparent}
.c.b{font-weight:700} .c.i{font-style:italic}
.c.al{justify-content:flex-start} .c.ac{justify-content:center} .c.ar{justify-content:flex-end}
.c.insel{background:var(--sel-bg)}
.c.imported{text-decoration:underline dotted var(--amber) 1.5px;text-underline-offset:3px}
.c.aicell::after{
  content:"";position:absolute;right:1px;top:1px;width:0;height:0;
  border:4px solid transparent;border-right-color:var(--accent);border-top-color:var(--accent);
}
@keyframes flashcalc{from{background:var(--accent-soft)}to{background:var(--canvas)}}
.c.flash{animation:flashcalc .25s ease-out}
@keyframes pulsecycle{0%,100%{background:var(--canvas)}25%,75%{background:rgba(220,38,38,.28)}}
.c.cyc{animation:pulsecycle .9s ease-in-out 2}
@keyframes halopop{from{box-shadow:0 0 0 0 var(--accent)}to{box-shadow:0 0 0 3px transparent}}
.c.ripple{animation:halopop .45s ease-out}
@keyframes amberflash{from{background:rgba(245,158,11,.5)}to{background:var(--canvas)}}
.c.tt{animation:amberflash .5s ease-out}
.c .sparkwrap{display:block;width:100%;height:100%;pointer-events:none}
.c .sparkwrap svg{display:block;width:100%;height:100%}

/* X-Ray desaturates the sheet so the graph is the only thing you can look at */
#cellLayer.xdim .c{opacity:.3;filter:saturate(.15);transition:opacity .25s ease,filter .25s ease}
#cellLayer.xdim .c.xhot{opacity:1;filter:none}

/* selection chrome */
#selbox{
  position:absolute;pointer-events:none;z-index:6;
  border:2px solid var(--accent);border-radius:2px;
  transition:transform .12s cubic-bezier(.22,1,.36,1),width .12s cubic-bezier(.22,1,.36,1),height .12s cubic-bezier(.22,1,.36,1);
  will-change:transform,width,height;
}
#selbox.noanim{transition:none}
[data-theme="win97"] #selbox{border:2px solid #000;border-radius:0}
#fillnub{
  position:absolute;right:-4px;bottom:-4px;width:7px;height:7px;background:var(--accent);
  border:1px solid var(--canvas);pointer-events:auto;cursor:crosshair;z-index:8;
}
[data-theme="win97"] #fillnub{background:#000}
#fillghost{position:absolute;pointer-events:none;z-index:5;border:1px dashed var(--accent);background:var(--sel-bg)}
#cutmarch{position:absolute;pointer-events:none;z-index:5;border:2px dashed var(--accent);animation:march 1s linear infinite}
@keyframes march{to{border-color:var(--muted)}}
#refLayer{position:absolute;left:0;top:0;pointer-events:none;z-index:5}
.refbox{position:absolute;border:2px solid;border-radius:2px;background:rgba(0,0,0,.02)}
#anchorbox{position:absolute;pointer-events:none;z-index:7;border:2px solid var(--accent);background:transparent;border-radius:2px;box-shadow:0 0 0 1px var(--canvas) inset}
#edshell{position:absolute;z-index:20;background:var(--canvas);box-shadow:var(--shadow);border:2px solid var(--accent);min-width:80px}
#edshell input{padding:0 4px;font-size:var(--cell-fs)}
#edshell .ghost{padding:0 4px;font-size:var(--cell-fs)}
[data-theme="win97"] #edshell{border:1px solid #000;box-shadow:none}

/* autocomplete for function names */
#acbox{
  position:absolute;z-index:210;background:var(--panel);border:1px solid var(--line-2);
  border-radius:var(--radius-sm);box-shadow:var(--shadow);min-width:230px;max-height:220px;overflow:auto;padding:4px;
}
#acbox .ac{padding:4px 8px;border-radius:4px;display:flex;justify-content:space-between;gap:12px;font-size:12px;cursor:pointer}
#acbox .ac b{font-family:var(--mono);font-weight:600}
#acbox .ac small{color:var(--muted);font-family:var(--mono);font-size:10.5px}
#acbox .ac.on{background:var(--accent-soft);color:var(--accent)}

/* in-cell widgets */
.wg{display:flex;align-items:center;width:100%;height:100%;gap:4px;padding:0 2px}
.wg input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:3px;
  background:var(--line-2);outline:none;min-width:20px;cursor:ew-resize;
}
.wg input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);
  border:2px solid var(--canvas);box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:ew-resize;
}
.wg input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--canvas)}
[data-theme="win97"] .wg input[type=range]{height:6px;border-radius:0;background:#fff;box-shadow:var(--bevel-in)}
[data-theme="win97"] .wg input[type=range]::-webkit-slider-thumb{border-radius:0;background:#c0c0c0;box-shadow:var(--bevel-out);border:0;width:10px;height:16px}
.wg .wv{font-size:10.5px;color:var(--muted);font-family:var(--mono);min-width:22px;text-align:right}
.wg .cb{
  width:14px;height:14px;border:1.5px solid var(--line-2);border-radius:3px;display:grid;place-items:center;
  margin:auto;background:var(--canvas);cursor:pointer;
}
.wg .cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="win97"] .wg .cb{border-radius:0;border:0;box-shadow:var(--bevel-in);background:#fff}
[data-theme="win97"] .wg .cb.on{background:#fff;color:#000}
.wg .stars{display:flex;gap:1px;margin:auto;cursor:pointer;font-size:12px;line-height:1}
.wg .stars i{font-style:normal;color:var(--line-2)}
.wg .stars i.on{color:var(--amber)}

/* ============================================================ *
 * ===== STATUS BAR ============================================
 * ============================================================ */
#statusbar{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;height:26px;padding:0 12px;
  border-top:1px solid var(--line);background:var(--panel);
  font-size:11.5px;color:var(--muted);user-select:none;
}
[data-theme="win97"] #statusbar{background:#c0c0c0;border-top:1px solid #dfdfdf;height:22px;padding:1px 2px;gap:2px}
#statusbar .st{font-family:var(--mono)}
[data-theme="win97"] #statusbar .st{box-shadow:var(--bevel-in);padding:1px 6px;font-family:var(--font);color:#000}
#statusbar .stats{display:flex;gap:14px}
[data-theme="win97"] #statusbar .stats{gap:2px}

/* ============================================================ *
 * ===== OVERLAYS: X-RAY =======================================
 * ============================================================ */
#dimmer{
  position:fixed;inset:0;background:rgba(10,12,20,.42);z-index:100;
  opacity:0;transition:opacity .28s ease;pointer-events:none;
}
#dimmer.on{opacity:1}
[data-theme="dark"] #dimmer{background:rgba(0,0,0,.55)}
#xray{position:fixed;inset:0;z-index:101;pointer-events:none;overflow:visible}
#xray .flow{stroke-dasharray:7 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
#xray .halo{fill:none;stroke-width:2.5;rx:3}
#xray text{font-family:var(--mono);font-size:10px;fill:#fff}
#xray .chip rect{rx:4}
#xrayHud{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:103;
  background:var(--panel);border:1px solid var(--line-2);border-radius:999px;
  padding:8px 16px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:14px;font-size:12px;
}
#xrayHud .k{display:inline-flex;align-items:center;gap:5px}
#xrayHud .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
#xrayHud b{font-family:var(--mono)}

/* ============================================================ *
 * ===== OVERLAYS: COMMAND PALETTE =============================
 * ============================================================ */
#paletteWrap{position:fixed;inset:0;z-index:300;display:none;background:rgba(10,12,20,.28);backdrop-filter:blur(2px)}
#paletteWrap.on{display:block}
#palette{
  position:absolute;left:50%;top:14vh;transform:translateX(-50%);width:min(620px,92vw);
  background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);
  overflow:hidden;animation:popin .16s cubic-bezier(.22,1,.36,1);
}
@keyframes popin{from{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.98)}}
[data-theme="win97"] #palette{border-radius:0;border:1px solid #000;box-shadow:var(--bevel-out),3px 3px 0 rgba(0,0,0,.4)}
#palette input{
  width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;
  padding:15px 18px;font-size:15px;outline:none;
}
#palList{max-height:min(52vh,440px);overflow:auto;padding:6px}
.pitem{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;
}
.pitem .pi-ic{width:18px;text-align:center;color:var(--muted);flex:0 0 auto}
.pitem .pi-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pi-t em{font-style:normal;color:var(--accent);font-weight:650}
.pitem .pi-g{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pitem.on{background:var(--accent-soft)}
.pitem.on .pi-ic,.pitem.on .pi-g{color:var(--accent)}
[data-theme="win97"] .pitem{border-radius:0}
[data-theme="win97"] .pitem.on{background:#000080;color:#fff}
[data-theme="win97"] .pitem.on .pi-t em{color:#ff0}
#palEmpty{padding:26px;text-align:center;color:var(--muted)}

/* ============================================================ *
 * ===== OVERLAYS: TIME TRAVEL DRAWER ==========================
 * ============================================================ */
#drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--panel);
  border-top:1px solid var(--line-2);box-shadow:0 -12px 40px -12px rgba(0,0,0,.3);
  transform:translateY(110%);transition:transform .3s cubic-bezier(.22,1,.36,1);padding:12px 16px 14px;
}
#drawer.on{transform:none}
[data-theme="win97"] #drawer{border-top:1px solid #dfdfdf;box-shadow:var(--bevel-out)}
#drawer .drow{display:flex;align-items:center;gap:12px;margin-bottom:8px}
#drawer h4{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#ttTrackWrap{position:relative;padding:14px 4px 4px}
#ttTicks{position:absolute;left:4px;right:4px;top:2px;height:11px;pointer-events:none}
#ttTicks i{position:absolute;top:0;width:1px;height:6px;background:var(--line-2)}
#ttTicks i.snap{height:11px;background:var(--accent);opacity:.55}
#ttRange{width:100%;accent-color:var(--accent)}
#ttLabel{
  position:absolute;transform:translateX(-50%);background:var(--ink);color:var(--canvas);
  padding:3px 8px;border-radius:6px;font-size:11px;white-space:nowrap;pointer-events:none;
  top:-16px;opacity:0;transition:opacity .12s;font-family:var(--mono);
}
#ttLabel.on{opacity:1}
#ttBanner{
  position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:160;
  background:linear-gradient(90deg,var(--amber),var(--orange));color:#1a1a1a;font-weight:700;
  padding:6px 22px;border-radius:0 0 12px 12px;letter-spacing:.14em;font-size:11px;
  box-shadow:var(--shadow);display:none;
}
#ttBanner.on{display:block}
.mini{
  height:26px;padding:0 10px;border-radius:var(--radius-sm);border:1px solid var(--line-2);
  background:var(--panel);color:var(--ink-2);font-size:12px;display:inline-flex;align-items:center;gap:6px;
}
.mini:hover{background:var(--panel-2);color:var(--ink)}
.mini.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini.pri:hover{filter:brightness(1.08);background:var(--accent);color:var(--accent-ink)}
[data-theme="win97"] .mini{border:0;box-shadow:var(--bevel-out);background:#c0c0c0;border-radius:0;color:#000;min-width:70px;justify-content:center}
[data-theme="win97"] .mini:active{box-shadow:var(--bevel-in)}
[data-theme="win97"] .mini.pri{background:#c0c0c0;color:#000;font-weight:700}

/* ============================================================ *
 * ===== OVERLAYS: TOASTS / MODAL / CHARTS / CLIPPY ============
 * ============================================================ */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:var(--ink);color:var(--canvas);padding:9px 16px;border-radius:999px;font-size:12.5px;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;max-width:min(520px,90vw);
  animation:toastin .22s cubic-bezier(.22,1,.36,1);
}
.toast.out{animation:toastout .2s ease-in forwards}
.toast .tact{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;flex:0 0 auto}
[data-theme="dark"] .toast{background:var(--panel);border:1px solid var(--line-2);color:var(--ink)}
[data-theme="win97"] .toast{border-radius:0;background:#c0c0c0;color:#000;box-shadow:var(--bevel-out),2px 2px 0 rgba(0,0,0,.4)}
@keyframes toastin{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes toastout{to{opacity:0;transform:translateY(6px) scale(.98)}}

#modalWrap{position:fixed;inset:0;z-index:400;display:none;background:rgba(10,12,20,.35);backdrop-filter:blur(2px)}
#modalWrap.on{display:grid;place-items:center}
#modal{
  background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);
  width:min(460px,92vw);padding:20px;animation:popin2 .16s cubic-bezier(.22,1,.36,1);
}
@keyframes popin2{from{opacity:0;transform:translateY(-8px) scale(.98)}}
[data-theme="win97"] #modal{border-radius:0;border:1px solid #000;box-shadow:var(--bevel-out),3px 3px 0 rgba(0,0,0,.4);padding:3px}
#modal h3{margin:0 0 4px;font-size:15px}
[data-theme="win97"] #modal h3{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:2px 4px;margin:0 0 8px;font-size:12px}
#modal .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
[data-theme="win97"] #modal .body{padding:0 10px 10px}
#modal label{display:block;font-size:11.5px;color:var(--ink-2);margin:10px 0 4px;font-weight:600}
#modal input[type=text],#modal input[type=number],#modal input[type=password]{
  width:100%;height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--radius-sm);
  background:var(--canvas);outline:none;font-family:var(--mono);font-size:12.5px;
}
#modal input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
[data-theme="win97"] #modal input{border:0;box-shadow:var(--bevel-in);border-radius:0;background:#fff}
#modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#modal .note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.pickbtn{width:34px;height:32px;flex:0 0 auto}

#chartLayer{position:fixed;inset:0;z-index:90;pointer-events:none}
.chartcard{
  position:absolute;pointer-events:auto;background:var(--panel);border:1px solid var(--line-2);
  border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;min-width:260px;
  animation:cardin .3s cubic-bezier(.22,1,.36,1);
}
@keyframes cardin{from{opacity:0;transform:scale(.9) translateY(10px)}}
[data-theme="win97"] .chartcard{border-radius:0;border:1px solid #000;box-shadow:var(--bevel-out),3px 3px 0 rgba(0,0,0,.35);background:#c0c0c0}
.chartcard .ch-head{
  display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:move;user-select:none;
  border-bottom:1px solid var(--line);background:var(--panel-2);
}
[data-theme="win97"] .chartcard .ch-head{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;border:0;padding:2px 3px}
.chartcard .ch-title{flex:1;font-size:11.5px;font-family:var(--mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-theme="win97"] .chartcard .ch-title{color:#fff;font-family:var(--font);font-weight:700;font-size:12px}
.chartcard .ch-t{font-size:10.5px;padding:2px 6px;border-radius:5px;color:var(--muted);border:1px solid transparent}
.chartcard .ch-t.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
[data-theme="win97"] .chartcard .ch-t{border-radius:0;background:#c0c0c0;color:#000;box-shadow:var(--bevel-out)}
[data-theme="win97"] .chartcard .ch-t.on{box-shadow:var(--bevel-in)}
.chartcard .ch-x{width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.chartcard .ch-x:hover{background:var(--red);color:#fff}
[data-theme="win97"] .chartcard .ch-x{box-shadow:var(--bevel-out);background:#c0c0c0;color:#000;border-radius:0;font-size:9px;font-weight:700}
.chartcard .ch-body{background:var(--panel);padding:2px}
[data-theme="win97"] .chartcard .ch-body{background:#fff;box-shadow:var(--bevel-in);margin:3px}
.chartcard svg{display:block}
.chartcard .grow{transform-origin:bottom;animation:growin .3s cubic-bezier(.22,1,.36,1)}
@keyframes growin{from{transform:scaleY(.02)}}
.ch-tip{
  position:fixed;z-index:200;background:var(--ink);color:var(--canvas);font-size:11px;padding:4px 8px;
  border-radius:6px;pointer-events:none;font-family:var(--mono);white-space:nowrap;
}

#clippy{
  position:fixed;right:22px;bottom:38px;z-index:250;width:78px;height:96px;cursor:pointer;
  display:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.28));
}
#clippy.on{display:block;animation:clippyin .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes clippyin{from{transform:translateY(120px) rotate(-14deg)}}
#clippy.bounce{animation:clippybounce .6s ease}
@keyframes clippybounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(-4deg)}60%{transform:translateY(-4px)}}
#clippyBubble{
  position:fixed;right:110px;bottom:60px;z-index:251;max-width:260px;background:#ffffe1;color:#000;
  border:1px solid #000;padding:9px 12px;font-size:12px;line-height:1.5;display:none;
  box-shadow:3px 3px 0 rgba(0,0,0,.35);
}
#clippyBubble.on{display:block;animation:popin2 .18s ease-out}
#clippyBubble::after{
  content:"";position:absolute;right:-9px;bottom:16px;width:0;height:0;
  border:8px solid transparent;border-left-color:#ffffe1;
}
#clippyBubble .cb-acts{display:flex;gap:8px;margin-top:9px;justify-content:flex-end}
#clippyBubble button{
  background:#c0c0c0;box-shadow:var(--bevel-out,inset -1px -1px #0a0a0a,inset 1px 1px #fff);
  padding:2px 10px;font-size:11px;border:0;color:#000;
}
#clippyBubble button:active{box-shadow:inset 1px 1px #0a0a0a,inset -1px -1px #fff}

/* 97 boot dialog */
#bootdlg{
  position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:600;background:#c0c0c0;
  box-shadow:var(--bevel-out),3px 3px 0 rgba(0,0,0,.4);width:320px;padding:2px;display:none;
  font-family:"Pixelated MS Sans Serif",Tahoma,sans-serif;font-size:12px;color:#000;
}
#bootdlg.on{display:block}
#bootdlg .bt{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:700;padding:2px 4px}
#bootdlg .bb{padding:14px 14px 16px}
#bootbar{height:18px;box-shadow:inset -1px -1px #fff,inset 1px 1px #808080;background:#fff;margin-top:10px;padding:2px;display:flex;gap:2px;overflow:hidden}
#bootbar i{width:10px;flex:0 0 auto;background:#000080;display:block}

/* misc */
.mono{font-family:var(--mono)}
@keyframes greenflash{from{background:rgba(22,163,74,.55)}to{background:transparent}}
.c.gsdone{animation:greenflash .6s ease-out}
#readonlyBar{
  position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:170;background:var(--accent);
  color:var(--accent-ink);padding:7px 14px;border-radius:999px;font-size:12px;display:none;
  align-items:center;gap:12px;box-shadow:var(--shadow-lg);
}
#readonlyBar.on{display:flex}
#readonlyBar button{background:var(--accent-ink);color:var(--accent);padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:650}
@media (max-width:720px){
  .brand .ver,.tb .lbl{display:none}
  #namebox{width:70px}
}
</style>
</head>
<body>

<div id="app">
  <!-- ===== Excel 97 chrome (hidden in modern themes) ===== -->
  <div id="titlebar">
    <svg class="tb-icon" viewBox="0 0 16 16"><rect width="16" height="16" fill="#fff"/><rect x="1" y="1" width="14" height="3" fill="#008000"/><rect x="1" y="5" width="6" height="4" fill="#c0c0c0"/><rect x="9" y="5" width="6" height="4" fill="#c0c0c0"/><rect x="1" y="10" width="6" height="4" fill="#c0c0c0"/><rect x="9" y="10" width="6" height="4" fill="#c0c0c0"/></svg>
    <span>Microsoft OneSheet - Book1</span><span class="sp"></span>
    <button class="tb-btn" data-fake="min">_</button>
    <button class="tb-btn" data-fake="max">□</button>
    <button class="tb-btn" data-fake="close">✕</button>
  </div>
  <div id="menubar"></div>

  <!-- ===== toolbar ===== -->
  <header id="toolbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M5 11h22M5 17h22M5 23h22M12 5v22M21 5v22" stroke="#fff" stroke-width="1.8" opacity=".8"/></svg>
      <b>OneSheet</b><span class="ver" id="verTag"></span>
    </div>
    <button class="tb" id="btnBold" title="Bold (Ctrl+B)"><b style="font-size:14px">B</b></button>
    <button class="tb" id="btnItalic" title="Italic (Ctrl+I)"><i style="font-family:Georgia,serif;font-size:14px">I</i></button>
    <div class="tb-sep"></div>
    <button class="tb" data-align="left" title="Align left"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 2h12M1 5.5h8M1 9h12M1 12.5h8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
    <button class="tb" data-align="center" title="Align center"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 2h12M3 5.5h8M1 9h12M3 12.5h8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
    <button class="tb" data-align="right" title="Align right"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 2h12M5 5.5h8M1 9h12M5 12.5h8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
    <select class="sel" id="numFmt" title="Number format">
      <option value="general">General</option>
      <option value="0.00">0.00</option>
      <option value="#,##0">#,##0</option>
      <option value="0%">0%</option>
      <option value="$#,##0.00">$#,##0.00</option>
      <option value="date">Date</option>
    </select>
    <div class="tb-sep"></div>
    <button class="tb" id="btnXray" title="Formula X-Ray (Ctrl+Shift+X)">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="3" cy="3" r="2"/><circle cx="11" cy="7" r="2"/><circle cx="3" cy="11" r="2"/><path d="M5 4l4 2M5 10l4-2"/></svg>
      <span class="lbl">X-Ray</span>
    </button>
    <button class="tb" id="btnTime" title="Time Travel (Ctrl+Shift+T)">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="5.6"/><path d="M7 3.6V7l2.4 1.6"/></svg>
      <span class="lbl">Time</span>
    </button>
    <button class="tb" id="btnChart" title="Instant chart (F9)">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 12.5h11"/><rect x="2.5" y="7" width="2.4" height="4.2"/><rect x="6" y="4" width="2.4" height="7.2"/><rect x="9.5" y="1.8" width="2.4" height="9.4"/></svg>
      <span class="lbl">Chart</span>
    </button>
    <div class="spacer"></div>
    <button class="tb" id="btn97" title="Party like it's 1997 (Ctrl+Shift+9)"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.2" y="2.6" width="11.6" height="9.4" rx="1"/><path d="M1.2 5.2h11.6M3.6 2.6V1.2M10.4 2.6V1.2"/><circle cx="7" cy="8.6" r="1.6"/></svg><span class="lbl">1997</span></button>
    <button class="tb" id="btnTheme" title="Toggle dark mode">◐</button>
    <button class="tb" id="btnPalette" title="Command palette">⌘K</button>
  </header>

  <!-- ===== formula bar ===== -->
  <div id="fbar">
    <div id="namebox">A1</div>
    <div id="fxlabel">fx</div>
    <div class="edit-shell" id="fxshell">
      <div class="ghost" id="fxghost"></div>
      <input id="fxinput" spellcheck="false" autocomplete="off" aria-label="Formula bar">
    </div>
  </div>

  <!-- ===== grid ===== -->
  <div id="gridwrap">
    <div id="corner" title="Select all (Ctrl+A)"></div>
    <div id="colhead"><div id="colheadInner"></div></div>
    <div id="rowhead"><div id="rowheadInner"></div></div>
    <div id="scroller">
      <div id="canvas">
        <div id="cellLayer"></div>
        <div id="refLayer"></div>
        <div id="cutmarch" class="hidden"></div>
        <div id="fillghost" class="hidden"></div>
        <div id="anchorbox" class="hidden"></div>
        <div id="selbox"><div id="fillnub"></div></div>
        <div id="edshell" class="hidden"><div class="ghost" id="edghost"></div><input id="edinput" spellcheck="false" autocomplete="off" aria-label="Cell editor"></div>
      </div>
    </div>
  </div>

  <!-- ===== status bar ===== -->
  <div id="statusbar">
    <span class="st" id="stSel">A1</span>
    <div class="stats" id="stStats"></div>
    <div class="spacer" style="flex:1"></div>
    <span class="st" id="stCells">0 cells</span>
    <span class="st" id="stEngine">—</span>
  </div>
</div>

<!-- ===== floating layers ===== -->
<div id="dimmer"></div>
<svg id="xray" class="hidden"></svg>
<div id="xrayHud" class="hidden"></div>
<div id="chartLayer"></div>

<div id="ttBanner">⏳ TIME TRAVEL — READ ONLY</div>
<div id="drawer">
  <div class="drow">
    <h4>Time Travel</h4>
    <span class="mono" id="ttPos" style="color:var(--muted);font-size:11.5px"></span>
    <div class="spacer" style="flex:1"></div>
    <button class="mini" id="ttPlay">▶ Play</button>
    <button class="mini" id="ttSpeed">×1</button>
    <button class="mini" id="ttNow">Jump to present</button>
    <button class="mini pri" id="ttRestore">Restore here</button>
    <button class="mini" id="ttClose">Esc</button>
  </div>
  <div id="ttTrackWrap">
    <div id="ttTicks"></div>
    <div id="ttLabel"></div>
    <input type="range" id="ttRange" min="0" max="0" value="0" step="1">
  </div>
</div>

<script>
"use strict";
/* eslint-disable no-unused-vars */
/* ============================================================ *
 * ===== UTIL ==================================================
 * Tiny helpers. No dependencies, no cleverness that costs
 * readability. `$` is querySelector, not a library.
 * ============================================================ */
const VERSION = "1.0.0";
const MAXROW = 5000, MAXCOL = 702;          // A .. ZZ
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? "⌘" : "Ctrl";

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const isNum = v => typeof v === "number" && isFinite(v);

/** A1 <-> (row,col). Columns are 1-based: A=1, Z=26, AA=27, ZZ=702. */
function colName(c) { let s = ""; while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = (c - 1 - m) / 26; } return s; }
function colIndex(s) { let n = 0; s = s.toUpperCase(); for (let i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64); return n; }
const K   = (r, c) => "R" + r + "C" + c;
const A1  = (r, c) => colName(c) + r;
function parseKey(k) { const m = /^R(\d+)C(\d+)$/.exec(k); return m ? { r: +m[1], c: +m[2] } : null; }
function parseA1(s) { const m = /^\$?([A-Za-z]{1,2})\$?(\d{1,5})$/.exec(s.trim()); if (!m) return null; const c = colIndex(m[1]), r = +m[2]; return (r >= 1 && r <= MAXROW && c >= 1 && c <= MAXCOL) ? { r, c } : null; }
const inBounds = (r, c) => r >= 1 && r <= MAXROW && c >= 1 && c <= MAXCOL;
/** Canonical "A1:B2" (or "A1" when degenerate) label for a rect. */
function rectLabel(r) { return r.r1 === r.r2 && r.c1 === r.c2 ? A1(r.r1, r.c1) : A1(r.r1, r.c1) + ":" + A1(r.r2, r.c2); }
function normRect(r) { return { r1: Math.min(r.r1, r.r2), c1: Math.min(r.c1, r.c2), r2: Math.max(r.r1, r.r2), c2: Math.max(r.c1, r.c2) }; }
function* rectKeys(rect) { for (let r = rect.r1; r <= rect.r2; r++) for (let c = rect.c1; c <= rect.c2; c++) yield K(r, c); }

const rafThrottle = fn => { let q = false, lastArgs; return (...a) => { lastArgs = a; if (q) return; q = true; requestAnimationFrame(() => { q = false; fn(...lastArgs); }); }; };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/** FNV-1a — used by Mock AI so "deterministic" is not a lie. */
function hash32(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return h >>> 0; }
/** mulberry32 — seeded PRNG so mock output is stable across reloads. */
function seeded(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- number formatting (exactly six patterns, per spec §4) ---------- */
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
/** Excel's epoch: serial 1 = 1900-01-01. The famous 1900-leap-year bug is honoured
 *  for serials >= 60 so imported xlsx dates line up with Excel's. */
const EXCEL_EPOCH = Date.UTC(1899, 11, 30);
function serialToDate(n) { return new Date(EXCEL_EPOCH + Math.round(n) * 86400000); }
function dateToSerial(d) { return Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - EXCEL_EPOCH) / 86400000); }

function group(s) { const p = s.split("."); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); return p.join("."); }
/** Render a number the way a bare `general` cell would. Trims float noise. */
function numToStr(n) {
  if (!isFinite(n)) return n > 0 ? "#DIV/0!" : "#DIV/0!";
  if (n === 0) return "0";
  const a = Math.abs(n);
  if (a >= 1e11 || a < 1e-9) return n.toExponential(5).replace(/e([+-])(\d)$/, "e$10$2");
  let s = String(Math.round(n * 1e10) / 1e10);
  if (s.length > 12 && s.includes(".")) s = String(+n.toPrecision(11));
  return s;
}
function fmtNumber(v, fmt) {
  if (!isNum(v)) return String(v);
  switch (fmt) {
    case "0.00":      return group(v.toFixed(2));
    case "#,##0":     return group(String(Math.round(v)));
    case "0%":        return Math.round(v * 100) + "%";
    case "$#,##0.00": return (v < 0 ? "-$" : "$") + group(Math.abs(v).toFixed(2));
    case "date": {
      const d = serialToDate(v);
      return String(d.getUTCDate()).padStart(2, "0") + " " + MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
    }
    default: return numToStr(v);
  }
}

/** The single source of truth for "what does this cell look like". */
function displayText(cell) {
  if (!cell) return "";
  const v = cell.value;
  if (v == null) return "";
  if (v instanceof Err) return v.code;
  if (typeof v === "boolean") return v ? "TRUE" : "FALSE";
  if (typeof v === "number") return fmtNumber(v, cell.fmt && cell.fmt.numFmt);
  if (typeof v === "object" && v.toString) return v.toString();
  return String(v);
}

/* ---------- toasts ---------- */
const Toast = (() => {
  const host = $("#toasts");
  function show(msg, opts) {
    opts = opts || {};
    while (host.children.length >= 2) host.firstChild.remove();
    const t = el("div", "toast");
    t.append(el("span", null, msg));
    if (opts.action) {
      const a = el("span", "tact", opts.action);
      a.onclick = () => { t.remove(); opts.onAction && opts.onAction(); };
      t.append(a);
    }
    host.append(t);
    const ms = opts.ms || 3000;
    setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 220); }, ms);
    return t;
  }
  return { show };
})();
const toast = (m, o) => Toast.show(m, o);

/* ---------- modal ---------- */
const Modal = (() => {
  const wrap = $("#modalWrap"), box = $("#modal");
  wrap.addEventListener("mousedown", e => { if (e.target === wrap) close(); });
  function open(title, sub, bodyNodes, buttons) {
    box.innerHTML = "";
    box.append(el("h3", null, title));
    const body = el("div", "body");
    if (sub) body.append(el("div", "sub", sub));
    (bodyNodes || []).forEach(n => body.append(n));
    const row = el("div", "row");
    (buttons || []).forEach(b => {
      const n = el("button", "mini" + (b.primary ? " pri" : ""), b.label);
      n.onclick = () => b.onClick(close);
      row.append(n);
    });
    body.append(row);
    box.append(body);
    wrap.classList.add("on");
    const first = box.querySelector("input,select,button");
    if (first) setTimeout(() => first.focus(), 20);
    return close;
  }
  function close() { wrap.classList.remove("on"); box.innerHTML = ""; Grid.focus(); }
  const isOpen = () => wrap.classList.contains("on");
  function field(label, attrs) {
    const l = el("label", null, label);
    const i = el("input");
    Object.assign(i, attrs || { type: "text" });
    const w = el("div"); w.append(l, i);
    return { wrap: w, input: i };
  }
  return { open, close, isOpen, field };
})();

/* ============================================================ *
 * ===== ENGINE ================================================
 * Zero DOM references live below this banner. Everything here
 * is drivable from the console:
 *     OneSheet.engine.set("A1", "=SUM(B1:B9)")
 *     OneSheet.engine.value("A1")
 * ============================================================ */

/** A first-class error value. Errors flow through formulas like numbers do. */
class Err { constructor(code) { this.code = code; } toString() { return this.code; } }
/** Thrown inside evaluation, caught at the cell boundary and turned into an Err. */
class CalcErr extends Error { constructor(code) { super(code); this.code = code; } }
/** A lazy window over the sparse map. We never materialise 700k empty cells. */
class RangeRef {
  constructor(r1, c1, r2, c2) { this.r1 = r1; this.c1 = c1; this.r2 = r2; this.c2 = c2; }
  get area() { return (this.r2 - this.r1 + 1) * (this.c2 - this.c1 + 1); }
}
/** Payload for =SPARK(); the renderer knows how to draw one, formulas treat it as text. */
class SparkVal { constructor(pts, type) { this.pts = pts; this.type = type; } toString() { return "▁▃▅▇"; } }
/** Placeholder while an =AI() call is in flight. */
class Pending { constructor(tag) { this.tag = tag; } toString() { return "⋯"; } }

const ERRCODES = ["#DIV/0!", "#REF!", "#NAME?", "#VALUE!", "#CYCLE!", "#N/A", "#AI!"];
const VOLATILE = new Set(["NOW", "TODAY", "RAND", "RANDBETWEEN"]);

/* ------------------------------------------------------------ *
 * Tokenizer
 * ------------------------------------------------------------ */
class ParseError extends Error {}
const REF_RE  = /^\$?([A-Za-z]{1,2})\$?(\d{1,5})(?![A-Za-z0-9_.$])/;
const NAME_RE = /^[A-Za-z_][A-Za-z0-9_.]*/;

function tokenize(src) {
  const out = [];
  let i = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === " " || ch === "\t" || ch === "\n" || ch === "\r") { i++; continue; }
    // number
    if ((ch >= "0" && ch <= "9") || (ch === "." && src[i + 1] >= "0" && src[i + 1] <= "9")) {
      let j = i;
      while (j < src.length && /[0-9.]/.test(src[j])) j++;
      if ((src[j] === "e" || src[j] === "E")) {
        let k = j + 1;
        if (src[k] === "+" || src[k] === "-") k++;
        if (src[k] >= "0" && src[k] <= "9") { while (src[k] >= "0" && src[k] <= "9") k++; j = k; }
      }
      const txt = src.slice(i, j), v = parseFloat(txt);
      if (isNaN(v)) throw new ParseError("bad number: " + txt);
      out.push({ t: "num", v }); i = j; continue;
    }
    // string, "" escapes a quote
    if (ch === '"') {
      let j = i + 1, s = "", closed = false;
      while (j < src.length) {
        if (src[j] === '"') { if (src[j + 1] === '"') { s += '"'; j += 2; continue; } j++; closed = true; break; }
        s += src[j++];
      }
      if (!closed) throw new ParseError("unterminated string");
      out.push({ t: "str", v: s }); i = j; continue;
    }
    // literal error value
    if (ch === "#") {
      const m = /^#[A-Za-z0-9\/]+[!?]/.exec(src.slice(i));
      if (m) { out.push({ t: "err", v: m[0].toUpperCase() }); i += m[0].length; continue; }
      throw new ParseError("bad token at " + i);
    }
    // reference or name
    if (ch === "$" || /[A-Za-z_]/.test(ch)) {
      const rest = src.slice(i);
      const mr = REF_RE.exec(rest);
      if (mr) {
        const c = colIndex(mr[1]), r = +mr[2];
        const ac = rest[0] === "$", ar = /\$\d/.test(mr[0]);
        out.push({ t: "ref", r, c, ar, ac, oob: !inBounds(r, c) });
        i += mr[0].length; continue;
      }
      const mn = NAME_RE.exec(rest);
      if (mn) { out.push({ t: "name", v: mn[0] }); i += mn[0].length; continue; }
      throw new ParseError("bad token at " + i);
    }
    // operators & punctuation
    const two = src.substr(i, 2);
    if (two === "<>" || two === "<=" || two === ">=") { out.push({ t: "op", v: two }); i += 2; continue; }
    if ("=<>+-*/^&%".includes(ch)) { out.push({ t: "op", v: ch }); i++; continue; }
    if (ch === "(") { out.push({ t: "lp" }); i++; continue; }
    if (ch === ")") { out.push({ t: "rp" }); i++; continue; }
    if (ch === "," || ch === ";") { out.push({ t: "comma" }); i++; continue; }
    if (ch === ":") { out.push({ t: "colon" }); i++; continue; }
    throw new ParseError("unexpected character '" + ch + "'");
  }
  return out;
}

/* ------------------------------------------------------------ *
 * Parser — precedence climbing, straight off the §5.1 grammar.
 * ------------------------------------------------------------ */
function parseFormula(src) {
  const tk = tokenize(src);
  let p = 0;
  const peek = () => tk[p];
  const eat = t => { const x = tk[p]; if (!x || x.t !== t) throw new ParseError("expected " + t); p++; return x; };
  const isOp = (...v) => tk[p] && tk[p].t === "op" && v.includes(tk[p].v);

  function expr() { return comparison(); }
  function comparison() {
    let l = concat();
    while (isOp("=", "<>", "<", ">", "<=", ">=")) { const op = tk[p++].v; l = { t: "bin", op, l, r: concat() }; }
    return l;
  }
  function concat() {
    let l = additive();
    while (isOp("&")) { p++; l = { t: "bin", op: "&", l, r: additive() }; }
    return l;
  }
  function additive() {
    let l = mult();
    while (isOp("+", "-")) { const op = tk[p++].v; l = { t: "bin", op, l, r: mult() }; }
    return l;
  }
  function mult() {
    let l = unary();
    while (isOp("*", "/")) { const op = tk[p++].v; l = { t: "bin", op, l, r: unary() }; }
    return l;
  }
  function unary() {
    // NOTE: §5.1 puts unary ABOVE power, so `-2^2` parses as `-(2^2)` = -4.
    // Excel itself does the opposite (`(-2)^2` = 4). The spec's grammar is
    // explicit, so the grammar wins; flagging it here because it will be the
    // first thing a spreadsheet person tries in the console.
    if (isOp("-", "+")) { const op = tk[p++].v; return { t: "un", op, e: unary() }; }
    return power();
  }
  function power() {
    const l = postfix();
    if (isOp("^")) { p++; return { t: "bin", op: "^", l, r: unary() }; }   // right-assoc
    return l;
  }
  function postfix() {
    let a = atom();
    while (isOp("%")) { p++; a = { t: "pct", e: a }; }
    return a;
  }
  function atom() {
    const x = peek();
    if (!x) throw new ParseError("unexpected end of formula");
    if (x.t === "num") { p++; return { t: "num", v: x.v }; }
    if (x.t === "str") { p++; return { t: "str", v: x.v }; }
    if (x.t === "err") { p++; return { t: "err", v: x.v }; }
    if (x.t === "lp")  { p++; const e = expr(); eat("rp"); return { t: "paren", e }; }
    if (x.t === "ref") {
      p++;
      const a = { r: x.r, c: x.c, ar: x.ar, ac: x.ac, oob: x.oob };
      if (peek() && peek().t === "colon" && tk[p + 1] && tk[p + 1].t === "ref") {
        p++; const y = tk[p++];
        return { t: "range", a, b: { r: y.r, c: y.c, ar: y.ar, ac: y.ac, oob: y.oob } };
      }
      return Object.assign({ t: "ref" }, a);
    }
    if (x.t === "name") {
      p++;
      const up = x.v.toUpperCase();
      if (peek() && peek().t === "lp") {
        p++;
        const args = [];
        if (peek() && peek().t !== "rp") {
          args.push(expr());
          while (peek() && peek().t === "comma") { p++; args.push(expr()); }
        }
        eat("rp");
        return { t: "call", n: up, args };
      }
      if (up === "TRUE")  return { t: "bool", v: true };
      if (up === "FALSE") return { t: "bool", v: false };
      return { t: "err", v: "#NAME?", name: x.v };     // bare identifier → #NAME?
    }
    throw new ParseError("unexpected token");
  }

  const ast = expr();
  if (p !== tk.length) throw new ParseError("trailing input");
  return ast;
}

/* ------------------------------------------------------------ *
 * AST utilities: stringify, shift (for fill/paste), remap (cut).
 * ------------------------------------------------------------ */
const refStr = n => (n.ac ? "$" : "") + colName(n.c) + (n.ar ? "$" : "") + n.r;
function stringifyAst(n) {
  switch (n.t) {
    case "num":   return numToStr(n.v);
    case "str":   return '"' + n.v.replace(/"/g, '""') + '"';
    case "bool":  return n.v ? "TRUE" : "FALSE";
    case "err":   return n.name || n.v;
    case "ref":   return n.oob ? "#REF!" : refStr(n);
    case "range": return (n.a.oob ? "#REF!" : refStr(n.a)) + ":" + (n.b.oob ? "#REF!" : refStr(n.b));
    case "call":  return n.n + "(" + n.args.map(stringifyAst).join(",") + ")";
    case "bin":   return stringifyAst(n.l) + n.op + stringifyAst(n.r);
    case "un":    return n.op + stringifyAst(n.e);
    case "pct":   return stringifyAst(n.e) + "%";
    case "paren": return "(" + stringifyAst(n.e) + ")";
    default:      return "";
  }
}
function mapRefs(n, f) {
  switch (n.t) {
    case "ref":   return Object.assign({ t: "ref" }, f(n));
    case "range": return { t: "range", a: f(n.a), b: f(n.b) };
    case "call":  return { t: "call", n: n.n, args: n.args.map(a => mapRefs(a, f)) };
    case "bin":   return { t: "bin", op: n.op, l: mapRefs(n.l, f), r: mapRefs(n.r, f) };
    case "un":    return { t: "un", op: n.op, e: mapRefs(n.e, f) };
    case "pct":   return { t: "pct", e: mapRefs(n.e, f) };
    case "paren": return { t: "paren", e: mapRefs(n.e, f) };
    default:      return n;
  }
}
/** Relative-reference shifting. `$` pins survive; out-of-grid becomes #REF!. */
const shiftAst = (ast, dr, dc) => mapRefs(ast, n => {
  if (n.oob) return n;
  const r = n.ar ? n.r : n.r + dr, c = n.ac ? n.c : n.c + dc;
  return { r, c, ar: n.ar, ac: n.ac, oob: !inBounds(r, c) };
});
/** Cut+paste redirection: rewrite refs that point at moved cells. */
const remapAst = (ast, moveMap) => mapRefs(ast, n => {
  if (n.oob) return n;
  const t = moveMap.get(K(n.r, n.c));
  return t ? { r: t.r, c: t.c, ar: n.ar, ac: n.ac, oob: false } : n;
});
/** Shift a formula string; used by fill handle and paste. */
function shiftFormula(raw, dr, dc) {
  try { return "=" + stringifyAst(shiftAst(parseFormula(raw.slice(1)), dr, dc)); }
  catch (e) { return raw; }
}

const Engine = (() => {
  /** key -> Cell. Sparse: only cells the user has touched exist. */
  const cells = new Map();
  /** key -> Set(dependent keys), for single-cell references only. */
  const rdeps = new Map();
  /** dependentKey -> rect[]; ranges are watched by rectangle, not per-cell,
   *  so =SUM(A1:A5000) costs one watcher instead of 5 000 graph edges. */
  const rangeWatchers = new Map();
  /** row-bucket (row>>6) -> Set(dependentKey) — keeps watcher lookup near O(1). */
  const buckets = new Map();
  const volatiles = new Set();
  /** Cells whose displayed value changed in the last recalc. The UI drains this. */
  const dirty = new Set();
  let lastStats = { evaluated: 0, ms: 0 };
  let suspend = false;
  const listeners = [];

  const rectOf = n => {
    if (n.a.oob || n.b.oob) return null;
    return { r1: Math.min(n.a.r, n.b.r), c1: Math.min(n.a.c, n.b.c), r2: Math.max(n.a.r, n.b.r), c2: Math.max(n.a.c, n.b.c) };
  };

  function blankCell() {
    return { raw: "", value: null, ast: null, refs: null, ranges: null, fmt: null, widget: null, imported: false, ai: null };
  }
  /** =TODAY() should look like a date, not like 46 227. Only ever applied to
   *  an unformatted cell, so an explicit user format always wins. */
  function dateHint(cell) {
    if (!cell.fmt && cell.ast && cell.ast.t === "call" && DATEFNS.has(cell.ast.n)) cell.fmt = { numFmt: "date" };
  }

  /* ---------- graph maintenance ---------- */
  function unlink(key) {
    const cell = cells.get(key);
    if (!cell) return;

def("COUNT", "COUNT(value1, …)", "Counts cells containing numbers.", a => nums(a).length);
def("COUNTA", "COUNTA(value1, …)", "Counts cells that are not empty.", a => collect(a).filter(v => v != null && v !== "").length);
def("ROUND", "ROUND(number, digits)", "Rounds to a number of digits.", a => { need(a, 1); return roundTo(N(a[0]), N(opt(a, 1, 0))); });
def("ROUNDUP", "ROUNDUP(number, digits)", "Rounds away from zero.", a => { need(a, 1); const d = Math.pow(10, N(opt(a, 1, 0))), v = N(a[0]); return (v >= 0 ? Math.ceil(v * d - 1e-9) : Math.floor(v * d + 1e-9)) / d; });
def("ROUNDDOWN", "ROUNDDOWN(number, digits)", "Rounds toward zero.", a => { need(a, 1); const d = Math.pow(10, N(opt(a, 1, 0))), v = N(a[0]); return (v >= 0 ? Math.floor(v * d + 1e-9) : Math.ceil(v * d - 1e-9)) / d; });
def("ABS", "ABS(number)", "Absolute value.", a => { need(a, 1); return Math.abs(N(a[0])); });
def("SQRT", "SQRT(number)", "Positive square root.", a => { need(a, 1); const v = N(a[0]); return v < 0 ? new Err("#VALUE!") : Math.sqrt(v); });
def("POWER", "POWER(number, power)", "Raises a number to a power.", a => { need(a, 2); const p = Math.pow(N(a[0]), N(a[1])); return isFinite(p) ? p : new Err("#VALUE!"); });
def("MOD", "MOD(number, divisor)", "Remainder after division.", a => { need(a, 2); const d = N(a[1]); if (d === 0) return new Err("#DIV/0!"); const n = N(a[0]); return n - d * Math.floor(n / d); });
def("INT", "INT(number)", "Rounds down to the nearest integer.", a => { need(a, 1); return Math.floor(N(a[0])); });
def("RAND", "RAND()", "Random number in [0,1). Volatile.", () => Math.random());
def("RANDBETWEEN", "RANDBETWEEN(low, high)", "Random integer in a range. Volatile.", a => { need(a, 2); const lo = Math.ceil(N(a[0])), hi = Math.floor(N(a[1])); if (hi < lo) return new Err("#VALUE!"); return lo + Math.floor(Math.random() * (hi - lo + 1)); });

/* ---------------- Logic ---------------- */
def("IF", "IF(test, then, else)", "Branches on a condition.", (nodes, ctx, ev) => {
  if (nodes.length < 2) return new Err("#VALUE!");
  const t = ev(nodes[0]);
  if (t instanceof Err) return t;
  return B(t) ? ev(nodes[1]) : (nodes.length > 2 ? ev(nodes[2]) : false);
}, { lazy: true });
def("IFERROR", "IFERROR(value, fallback)", "Swallows an error and returns the fallback.", (nodes, ctx, ev) => {
  if (nodes.length < 2) return new Err("#VALUE!");
  let v;
  try { v = ev(nodes[0]); } catch (e) { return ev(nodes[1]); }
  if (v instanceof RangeRef) v = flat1d(v)[0];
  return v instanceof Err ? ev(nodes[1]) : v;
}, { lazy: true });
def("AND", "AND(logical1, …)", "TRUE if every argument is TRUE.", a => { const v = collect(a).filter(x => x != null && x !== ""); if (!v.length) return new Err("#VALUE!"); return v.every(x => B(x)); });
def("OR", "OR(logical1, …)", "TRUE if any argument is TRUE.", a => { const v = collect(a).filter(x => x != null && x !== ""); if (!v.length) return new Err("#VALUE!"); return v.some(x => B(x)); });
def("NOT", "NOT(logical)", "Reverses a logical value.", a => { need(a, 1); return !B(a[0]); });
def("ISBLANK", "ISBLANK(value)", "TRUE when the cell is empty.", a => { need(a, 1); const v = a[0] instanceof RangeRef ? flat1d(a[0])[0] : a[0]; return v == null || v === ""; }, { eatsErrors: true });
def("ISNUMBER", "ISNUMBER(value)", "TRUE when the value is numeric.", a => { need(a, 1); const v = a[0] instanceof RangeRef ? flat1d(a[0])[0] : a[0]; return typeof v === "number"; }, { eatsErrors: true });

/* ---------------- Text ---------------- */
def("CONCAT", "CONCAT(text1, …)", "Joins text together.", a => collect(a).map(v => v == null ? "" : S(v)).join(""));
def("LEFT", "LEFT(text, n)", "Leftmost characters.", a => { need(a, 1); return S(a[0]).slice(0, Math.max(0, N(opt(a, 1, 1)))); });
def("RIGHT", "RIGHT(text, n)", "Rightmost characters.", a => { need(a, 1); const n = Math.max(0, N(opt(a, 1, 1))); return n === 0 ? "" : S(a[0]).slice(-n); });
def("MID", "MID(text, start, n)", "Characters from the middle.", a => { need(a, 3); const st = N(a[1]); if (st < 1) return new Err("#VALUE!"); return S(a[0]).substr(st - 1, Math.max(0, N(a[2]))); });
def("LEN", "LEN(text)", "Number of characters.", a => { need(a, 1); return S(a[0]).length; });
def("LOWER", "LOWER(text)", "Converts to lower case.", a => { need(a, 1); return S(a[0]).toLowerCase(); });
def("UPPER", "UPPER(text)", "Converts to UPPER CASE.", a => { need(a, 1); return S(a[0]).toUpperCase(); });
def("PROPER", "PROPER(text)", "Capitalises Each Word.", a => { need(a, 1); return S(a[0]).replace(/(^|[^A-Za-z'])([a-z])/g, (m, p, ch) => p + ch.toUpperCase()).replace(/([A-Za-z])([A-Z]+)/g, (m, x, y) => x + y.toLowerCase()); });
def("TRIM", "TRIM(text)", "Removes extra spaces.", a => { need(a, 1); return S(a[0]).replace(/\s+/g, " ").trim(); });
def("SUBSTITUTE", "SUBSTITUTE(text, old, new, [n])", "Replaces occurrences of text.", a => {
  need(a, 3);
  const s = S(a[0]), o = S(a[1]), nw = S(a[2]);
  if (o === "") return s;
  if (a.length > 3) {
    const which = N(a[3]); let i = 0, idx = -1;
    while (i++ < which) { idx = s.indexOf(o, idx + 1); if (idx < 0) return s; }
    return s.slice(0, idx) + nw + s.slice(idx + o.length);
  }
  return s.split(o).join(nw);

def("TEXT", "TEXT(value, format)", "Formats a number as text. Six patterns supported.", a => { need(a, 2); return fmtNumber(N(a[0]), S(a[1])); });
def("REPT", "REPT(text, times)", "Repeats text.", a => { need(a, 2); const n = Math.floor(N(a[1])); if (n < 0 || n > 5000) return new Err("#VALUE!"); return S(a[0]).repeat(n); });

/* ---------------- Lookup ---------------- */
function approxRow(col, target) {
  // Largest value <= target, assuming the column is sorted ascending.
  let best = -1;
  for (let i = 0; i < col.length; i++) {
    const v = col[i];
    if (v == null) continue;
    if (CMP(v, target) <= 0) best = i; else break;
  }
  return best;
}
def("VLOOKUP", "VLOOKUP(value, table, colIndex, [exact])", "Vertical table lookup.", a => {
  need(a, 3);
  const table = grid2d(a[1]), ci = Math.floor(N(a[2]));
  if (!table.length || ci < 1 || ci > table[0].length) return new Err("#REF!");
  const approx = a.length > 3 ? B(a[3]) : true;
  const col = table.map(r => r[0]);
  let i = -1;
  if (approx) i = approxRow(col, a[0]);
  else i = col.findIndex(v => CMP(v == null ? "" : v, a[0]) === 0);
  if (i < 0) return new Err("#N/A");
  const v = table[i][ci - 1];
  return v == null ? 0 : v;
}, { hint: "VLOOKUP" });
def("HLOOKUP", "HLOOKUP(value, table, rowIndex, [exact])", "Horizontal table lookup.", a => {
  need(a, 3);
  const table = grid2d(a[1]), ri = Math.floor(N(a[2]));
  if (!table.length || ri < 1 || ri > table.length) return new Err("#REF!");
  const approx = a.length > 3 ? B(a[3]) : true;
  const row = table[0];
  let i = -1;
  if (approx) i = approxRow(row, a[0]);
  else i = row.findIndex(v => CMP(v == null ? "" : v, a[0]) === 0);
  if (i < 0) return new Err("#N/A");
  const v = table[ri - 1][i];
  return v == null ? 0 : v;
});
def("INDEX", "INDEX(range, row, [col])", "Value at a position in a range.", a => {
  need(a, 2);
  const g = grid2d(a[0]);
  let r = Math.floor(N(a[1])), c = a.length > 2 ? Math.floor(N(a[2])) : 1;
  if (g.length === 1 && a.length <= 2) { c = r; r = 1; }        // 1-row range: single index means column
  if (r < 1 || r > g.length || c < 1 || c > g[0].length) return new Err("#REF!");
  const v = g[r - 1][c - 1];
  return v == null ? 0 : v;
});
def("MATCH", "MATCH(value, range, [type])", "Position of a value in a range.", a => {
  need(a, 2);
  const list = flat1d(a[1]), type = a.length > 2 ? Math.sign(N(a[2])) : 1;
  if (type === 0) { const i = list.findIndex(v => CMP(v == null ? "" : v, a[0]) === 0); return i < 0 ? new Err("#N/A") : i + 1; }
  if (type > 0) { const i = approxRow(list, a[0]); return i < 0 ? new Err("#N/A") : i + 1; }
  let best = -1;
  for (let i = 0; i < list.length; i++) { if (list[i] == null) continue; if (CMP(list[i], a[0]) >= 0) best = i; else break; }
  return best < 0 ? new Err("#N/A") : best + 1;
});
def("XLOOKUP", "XLOOKUP(value, lookupRange, returnRange, [ifMissing])", "Modern exact lookup.", a => {
  need(a, 3);
  const lk = flat1d(a[1]), rt = flat1d(a[2]);
  const i = lk.findIndex(v => CMP(v == null ? "" : v, a[0]) === 0);
  if (i < 0) return a.length > 3 ? a[3] : new Err("#N/A");
  const v = rt[i];
  return v == null ? 0 : v;
});

/* ---------------- Date ---------------- */
const DATEFNS = new Set(["TODAY", "NOW", "DATE"]);
def("TODAY", "TODAY()", "Today's date. Volatile.", () => { const d = new Date(); return dateToSerial(d); });
def("NOW", "NOW()", "Current date and time. Volatile.", () => { const d = new Date(); return dateToSerial(d) + (d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds()) / 86400; });
def("DATE", "DATE(year, month, day)", "Builds a date from parts.", a => { need(a, 3); const y = N(a[0]), m = N(a[1]), d = N(a[2]); return Math.round((Date.UTC(y, m - 1, d) - EXCEL_EPOCH) / 86400000); });
def("YEAR", "YEAR(date)", "Year of a date.", a => { need(a, 1); return serialToDate(N(a[0])).getUTCFullYear(); });
def("MONTH", "MONTH(date)", "Month of a date (1–12).", a => { need(a, 1); return serialToDate(N(a[0])).getUTCMonth() + 1; });

/* ---------------- Conditional aggregates ---------------- */
def("SUMIF", "SUMIF(range, criteria, [sumRange])", "Adds cells that meet a condition.", a => {
  need(a, 2);
  const test = criterion(a[1]);
  let s = 0;
  for (const [k, v] of ifPairs(a[0], a.length > 2 ? a[2] : undefined)) if (test(k)) { if (typeof v === "number") s += v; else if (v instanceof Err) throw new CalcErr(v.code); }
  return s;
});
def("COUNTIF", "COUNTIF(range, criteria)", "Counts cells that meet a condition.", a => {
  need(a, 2);
  const test = criterion(a[1]);
  let n = 0;
  eachValue(a[0], v => { if (test(v)) n++; });
  return n;
});
def("AVERAGEIF", "AVERAGEIF(range, criteria, [avgRange])", "Averages cells that meet a condition.", a => {
  need(a, 2);
  const test = criterion(a[1]);
  let s = 0, n = 0;
  for (const [k, v] of ifPairs(a[0], a.length > 2 ? a[2] : undefined)) if (test(k) && typeof v === "number") { s += v; n++; }
  return n ? s / n : new Err("#DIV/0!");
});

/* ---------------- Showpieces ---------------- */
def("SPARK", "SPARK(range, [\"line\"|\"bar\"|\"winloss\"])", "Draws an inline sparkline in the cell.", a => {
  need(a, 1);
  const type = a.length > 1 ? String(S(a[1])).toLowerCase() : "line";
  const pts = [];
  eachValue(a[0], v => { if (typeof v === "number") pts.push(v); else if (v instanceof Err) throw new CalcErr(v.code); });
  return new SparkVal(pts, ["line", "bar", "winloss"].includes(type) ? type : "line");

def("SLIDER", "SLIDER(min, max, [step], [value])", "Turns the cell into a draggable slider.", a => {
  const min = a.length > 0 ? N(a[0]) : 0, max = a.length > 1 ? N(a[1]) : 100;

def("CHECKBOX", "CHECKBOX([checked])", "Turns the cell into a checkbox.", a => a.length > 0 ? B(a[0]) : false);
def("RATING", "RATING([max], [value])", "Turns the cell into a star rating.", a => {

  A("panic", "Panic (undo ×10)", "View", () => {
    let n = 0;
    while (n < 10 && Commands.canUndo) { Commands.undo(); n++; }
    toast("Undid " + n + " thing" + (n === 1 ? "" : "s") + ". Breathe.");
  }, null, "↺");
  A("about", "About OneSheet", "View", () => {
    Modal.open("OneSheet v" + VERSION, "One HTML file. Zero human code.", [
      Object.assign(el("div", "note"), { innerHTML:
        "A real spreadsheet in a single offline file: Pratt-parsed formulas, an incremental dependency graph, " +
        "virtualised rendering, and a command log that powers undo, redo and time travel from one data structure.<br><br>" +
        "Planned by Claude Fable 5. Built by Claude Opus 5. " + Engine.size + " cells live right now; " +
        Commands.log.length + " commands in history.<br><br>Open devtools and try <code>OneSheet.engine.set(\"A1\",\"=SUM(B1:B3)\")</code>." })
    ], [{ label: "Nice", primary: true, onClick: c => c() }]);
  }, null, "?");

  const byId = id => list.find(a => a.id === id);
  function run(id) {
    const a = byId(id);
    if (!a) { console.warn("[OneSheet] no such action:", id); return; }
    try { a.run(); } catch (e) { console.warn("[OneSheet] action failed:", id, e); toast("That went sideways — nothing was changed"); }
  }
  return { list, run, byId };
})();

const Palette = (() => {
  const wrap = $("#paletteWrap"), input = $("#palInput"), listEl = $("#palList"), empty = $("#palEmpty");
  let open = false, results = [], idx = 0;

  /** Subsequence fuzzy match with bonuses for word starts and runs. */
  function score(q, text) {
    if (!q) return 1;
    const t = text.toLowerCase();
    let ti = 0, s = 0, run = 0;
    const hits = [];
    for (const ch of q) {
      const i = t.indexOf(ch, ti);
      if (i < 0) return -1;
      s += 12;
      if (i === ti && ti > 0) { run++; s += 8 + run * 2; } else run = 0;
      if (i === 0 || /[\s\-(]/.test(t[i - 1])) s += 14;
      hits.push(i);
      ti = i + 1;
    }
    return s - (t.length - q.length) * 0.12;
  }
  function markup(text, q) {
    if (!q) return escHtml(text);
    const t = text.toLowerCase();
    let out = "", ti = 0;
    for (const ch of q) {
      const i = t.indexOf(ch, ti);
      if (i < 0) break;
      out += escHtml(text.slice(ti, i)) + "<em>" + escHtml(text[i]) + "</em>";
      ti = i + 1;
    }
    return out + escHtml(text.slice(ti));
  }
  function refresh() {
    const q = input.value.trim().toLowerCase();
    results = Actions.list
      .map(a => ({ a, s: Math.max(score(q, a.title), score(q, a.group + " " + a.title) - 6) }))
      .filter(x => x.s > 0)
      .sort((x, y) => y.s - x.s)
      .slice(0, 40);
    idx = 0;
    draw(q);
  }
  function draw(q) {
    listEl.innerHTML = "";
    empty.classList.toggle("hidden", results.length > 0);
    results.forEach((r, i) => {
      const row = el("div", "pitem" + (i === idx ? " on" : ""));
      row.append(el("div", "pi-ic", r.a.icon || "›"));
      const t = el("div", "pi-t");
      t.innerHTML = markup(r.a.title, q);
      row.append(t, el("div", "pi-g", r.a.group));
      if (r.a.keys) { const k = el("kbd", null, r.a.keys); row.append(k); }
      row.onmousedown = e => { e.preventDefault(); idx = i; accept(); };
      row.onmouseenter = () => { idx = i; Array.from(listEl.children).forEach((n, j) => n.classList.toggle("on", j === idx)); };
      listEl.append(row);
    });
  }
  function accept() {
    const r = results[idx];
    close();
    if (r) setTimeout(() => Actions.run(r.a.id), 0);
  }
  function show() {
    open = true;
    wrap.classList.add("on");
    input.value = "";
    refresh();
    input.focus();
  }
  function close() { open = false; wrap.classList.remove("on"); Grid.focus(); }

  input.addEventListener("input", refresh);
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { idx = Math.min(idx + 1, results.length - 1); draw(input.value.trim().toLowerCase()); scrollTo(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { idx = Math.max(idx - 1, 0); draw(input.value.trim().toLowerCase()); scrollTo(); e.preventDefault(); }
    else if (e.key === "Enter") { accept(); e.preventDefault(); }
    else if (e.key === "Escape") { close(); e.preventDefault(); }
  });
  function scrollTo() { const n = listEl.children[idx]; if (n) n.scrollIntoView({ block: "nearest" }); }
  wrap.addEventListener("mousedown", e => { if (e.target === wrap) close(); });

  return { open: show, close, get isOpen() { return open; } };
})();

/* ============================================================ *
 * ===== THEMES + EXCEL 97 MODE (§8.3) =========================
 * The retro skin is one attribute flip: every component reads
 * its colours, bevels and metrics from CSS variables, so this
 * costs a repaint and nothing else. All features keep working
 * while skinned — that was the whole bet.
 * ============================================================ */
const Theme = (() => {
  let modernPref = "light";
  function set(name, silent) {
    const root = document.documentElement;
    if (root.dataset.theme !== "win97" && name === "win97") modernPref = root.dataset.theme || "light";
    root.dataset.theme = name;
    Grid.measure();
    Grid.scheduleRender();
    Charts.redrawAll();
    XRay.redraw();
    $("#btn97").classList.toggle("on", name === "win97");
    $("#btnTheme").textContent = name === "dark" ? "☀" : "◐";
    if (!silent) Persist.save();
  }
  const current = () => document.documentElement.dataset.theme || "light";
  function toggle() {
    if (current() === "win97") return Retro.toggle();
    set(current() === "dark" ? "light" : "dark");
  }
  return { set, toggle, current, get modernPref() { return modernPref; } };
})();

const Retro = (() => {
  const menubar = $("#menubar");
  let pop = null;

  const MENUS = [
    ["File", [["New empty sheet", "newsheet"], ["Import…", "import"], null, ["Export as CSV", "export-csv"], ["Export as .xlsx", "export-xlsx"], null, ["Copy share link", "share"], ["Save", "save"]]],
    ["Edit", [["Undo", "undo"], ["Redo", "redo"], null, ["Paste values only", "paste-values"], ["Paste formats only", "paste-formats"], ["Copy as Markdown", "copy-md"], null, ["Clear cells", "clear"], ["Select All", "selectall"]]],
    ["View", [["Time Travel", "timetravel"], ["Formula X-Ray", "xray"], null, ["Close all charts", "chart-clear"], ["Sounds", "sounds"], null, ["Exit 1997", "retro"]]],
    ["Insert", [["Chart", "chart"], ["Sparkline", "spark"], null, ["Slider", "widget-slider"], ["Check Box", "widget-checkbox"], ["Star Rating", "widget-rating"]]],
    ["Format", [["Bold", "bold"], ["Italic", "italic"], null, ["Align Left", "align-left"], ["Align Center", "align-center"], ["Align Right", "align-right"], null, ["Number", "fmt-0.00"], ["Currency", "fmt-$#,##0.00"], ["Percent", "fmt-0%"], ["Date", "fmt-date"], null, ["Autofit column", "autofit"]]],
    ["Tools", [["Goal Seek…", "goalseek"], ["Shake volatiles", "shake"], null, ["AI settings…", "ai-settings"], ["Clear AI cache", "ai-clear"]]],
    ["Data", [["Import…", "import"], ["Instant chart", "chart"], ["Sparkline", "spark"]]],
    ["Help", [["About OneSheet", "about"], null, ["Summon Clippy", "clippy"], ["Banish Clippy", "clippy-off"]]],
  ];

  function build() {
    if (menubar.children.length) return;
    MENUS.forEach(([name, items]) => {
      const b = el("div", "mtop", name);
      b.onmousedown = e => { e.preventDefault(); openMenu(b, items); };
      b.onmouseenter = () => { if (pop) openMenu(b, items); };
      menubar.append(b);
    });
  }
  function openMenu(anchor, items) {
    closeMenus();
    const r = anchor.getBoundingClientRect();
    pop = el("div", "menu-pop");
    pop.style.left = r.left + "px";
    pop.style.top = r.bottom + "px";
    items.forEach(it => {
      if (!it) { pop.append(el("div", "msep")); return; }
      const [label, id] = it;
      const a = Actions.byId(id);
      const row = el("div", "mi");
      row.append(el("span", null, label));
      if (a && a.keys) row.append(el("span", "sc", a.keys));
      row.onmousedown = e => { e.preventDefault(); closeMenus(); setTimeout(() => Actions.run(id), 0); };
      pop.append(row);
    });
    document.body.append(pop);
    anchor.classList.add("open");
  }
  function closeMenus() {
    if (pop) pop.remove();
    pop = null;
    $$(".mtop").forEach(n => n.classList.remove("open"));
  }
  document.addEventListener("mousedown", e => { if (pop && !e.target.closest(".menu-pop") && !e.target.closest("#menubar")) closeMenus(); });

  /** The 300 ms fake loading dialog, with a progress bar that jumps unevenly
   *  because that is exactly how they always did. */
  function bootSplash() {
    const dlg = $("#bootdlg"), bar = $("#bootbar");
    bar.innerHTML = "";
    dlg.classList.add("on");
    let n = 0;
    const steps = [3, 1, 5, 2, 6, 3];
    let i = 0;
    const t = setInterval(() => {
      const add = steps[i++ % steps.length];
      for (let k = 0; k < add && n < 20; k++, n++) bar.append(el("i"));
      if (n >= 20) { clearInterval(t); setTimeout(() => dlg.classList.remove("on"), 90); }
    }, 42);
    setTimeout(() => { clearInterval(t); dlg.classList.remove("on"); }, 700);
  }

  function toggle() {
    const t0 = performance.now();
    if (Theme.current() === "win97") {
      Theme.set(Theme.modernPref || "light");
      Clippy.hide();
      closeMenus();
      toast("Back to " + (Theme.modernPref || "light") + " mode");
    } else {
      Theme.set("win97");
      build();
      bootSplash();
      setTimeout(() => Clippy.summon("hello"), 620);
      toast("It is 1997. Your model still works.");
    }
    console.log("[OneSheet] theme flip took " + (performance.now() - t0).toFixed(1) + " ms");
  }

  $$("#titlebar .tb-btn").forEach(b => b.onclick = () => {
    if (b.dataset.fake === "close") Clippy.say("close", true);
    else Clippy.say("fake", true);
  });

  return { toggle, build, closeMenus, get menuOpen() { return !!pop; } };
})();

/* ------------------------------------------------------------ *
 * Clippy. Rule-driven, rate-limited, and dismissible from his
 * own bubble — the one piece of 1997 UX we improved on.
 * ------------------------------------------------------------ */
const Clippy = (() => {
  const node = $("#clippy"), bubble = $("#clippyBubble");
  let enabled = true, lastSpoke = 0, seenVlookup = false, idleTimer = null, visible = false;

  const LINES = {
    hello:  "Hi! It looks like you're using a spreadsheet. Would you like help, or would you like me to hover ominously?",
    vlookup:"It looks like you're writing a VLOOKUP. Have you considered that INDEX/MATCH people will judge you?",
    cycle:  "You've created a circular reference. Bold. Incorrect, but bold.",
    undo10: "We've all been there.",
    ai:     "In my day we called this “asking a coworker.”",
    idle:   "Still with me? The cells miss you.",
    xray:   "Ooh, arrows. In 1997 we called this “printing it out and using a highlighter.”",
    close:  "You can't close me. I'm load-bearing.",
    fake:   "That button does nothing. Authentically.",
  };

  function show() { node.classList.add("on"); visible = true; }
  function hide() { node.classList.remove("on"); bubble.classList.remove("on"); visible = false; }
  function bounce() { node.classList.remove("bounce"); void node.offsetWidth; node.classList.add("bounce"); }

  function say(kind, force) {
    if (!enabled) return;
    const text = LINES[kind];
    if (!text) return;
    const now = Date.now();
    if (!force && now - lastSpoke < 60000) return;      // max one quip a minute
    lastSpoke = now;
    if (!visible && Theme.current() !== "win97" && !force) return;
    show();
    bounce();
    bubble.innerHTML = "";
    bubble.append(el("div", null, text));
    const acts = el("div", "cb-acts");
    const off = el("button", null, "Don't show tips");
    off.onclick = () => disable();
    const ok = el("button", null, "OK");
    ok.onclick = () => bubble.classList.remove("on");
    acts.append(off, ok);
    bubble.append(acts);
    bubble.classList.add("on");
    clearTimeout(bubble._t);
    bubble._t = setTimeout(() => bubble.classList.remove("on"), 9000);
  }
  function summon(kind) { enabled = true; show(); say(kind || "hello", true); }
  function disable() { enabled = false; hide(); toast("Clippy will see himself out"); }

  node.addEventListener("click", () => { bounce(); say("hello", true); });

  /** Watch what the user types for quip-worthy moments. */
  function watchFormula(raw) {
    const up = String(raw).toUpperCase();
    if (!seenVlookup && up.includes("VLOOKUP(")) { seenVlookup = true; say("vlookup"); }
    if (/\bAI\s*\(/.test(up)) say("ai");
    resetIdle();
  }
  function resetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => say("idle"), 90000);
  }
  ["mousedown", "keydown"].forEach(ev => document.addEventListener(ev, resetIdle, { passive: true }));
  Engine.on(kind => { if (kind === "cycle") say("cycle"); });
  resetIdle();

  return { say, summon, disable, hide, watchFormula, get enabled() { return enabled; } };
})();

 * ===== BOOT ==================================================
 * Wire the chrome, seed a sheet that demos itself on the very
 * first screen, restore whatever the user had, and hand the
 * whole thing to the console under `OneSheet`.
 * ============================================================ */

  /* ---------- toolbar ---------- */

    $("#btnItalic").onclick = () => Actions.run("italic");

    $("#btnTime").onclick = () => Actions.run("timetravel");
    $("#btnChart").onclick = () => Actions.run("chart");
    $("#btn97").onclick = () => Actions.run("retro");

    $("#btnPalette").onclick = () => Palette.open();
    $("#btnPalette").textContent = IS_MAC ? "⌘K" : "Ctrl K";

  }

  /* ---------- the demo sheet (§9: the first screen demos itself) ---------- */
  const DEMO = [
    ["A1", "OneSheet — Loan Calculator", { bold: true }],
    ["C1", "one HTML file · zero human code"],
    ["A3", "Principal"],            ["B3", "250000", { numFmt: "$#,##0.00" }],

    ["A8", "Monthly payment"],      ["B8", "=ROUND(B3*B6/(1-POWER(1+B6,-B7)),2)", { numFmt: "$#,##0.00", bold: true }],
    ["A9", "Total paid"],           ["B9", "=ROUND(B8*B7,2)", { numFmt: "$#,##0.00" }],
    ["A10", "Total interest"],      ["B10", "=ROUND(B9-B3,2)", { numFmt: "$#,##0.00" }],
    ["A11", "Happy with it?"],      ["B11", "=CHECKBOX(TRUE)"],
    ["A12", "Rate this deal"],      ["B12", "=RATING(5,4)"],

    ["D2", "Year", { bold: true }], ["E2", "Balance", { bold: true }], ["F2", "Interest paid", { bold: true }],
    ["H2", "Sparklines", { bold: true }],
    ["H3", "=SPARK(E3:E12)"],
    ["H4", '=SPARK(F3:F12,"bar")'],

    ["A15", "Mock AI — no key, no network", { bold: true }],
    ["A16", "Tomato"],  ["B16", '=AI("categorize as fruit/vegetable",A16)'],
    ["A17", "Carrot"],  ["B17", '=AI("categorize as fruit/vegetable",A17)'],
    ["A18", "Rhubarb"], ["B18", '=AI("categorize as fruit/vegetable",A18)'],
    ["A20", "Try: ⌘K for commands · Ctrl+Shift+X on B8 · Ctrl+Shift+9 for 1997"],

  function demoWrites() {

    for (let i = 0; i < 10; i++) {
      const r = 3 + i;
      w.push(["D" + r, { raw: String(i + 1) }]);
      w.push(["E" + r, { raw: "=ROUND(MAX(0,$B$3*POWER(1+$B$6,D" + r + "*12)-$B$8*(POWER(1+$B$6,D" + r + "*12)-1)/$B$6),2)", fmt: { numFmt: "#,##0" } }]);
      w.push(["F" + r, { raw: "=ROUND(D" + r + "*12*$B$8-($B$3-E" + r + "),2)", fmt: { numFmt: "#,##0" } }]);
    }

  const DEMO_COLS = { 1: 168, 2: 128, 4: 56, 5: 104, 6: 108, 8: 132 };

  function seedDemo(asCommand) {

  async function start() {

      }

      seedDemo(false);

    }

    Grid.focus();
    Grid.scheduleRender();

    window.OneSheet = {
      VERSION, engine: Engine, commands: Commands, ui: Grid,
      charts: Charts, xray: XRay, time: TimeTravel, ai: AIRuntime,
      actions: Actions, persist: Persist, io: IO, theme: Theme, clippy: Clippy,
      clipboard: Clipboard, fill: FillEngine, widgets: Widgets, goalSeek: GoalSeek,
      palette: Palette, retro: Retro, editor: Editor, fn: FN,
      // handy console shorthands
      set: (a1, v) => Engine.set(a1, v),
      get: a1 => Engine.value(a1),
      run: id => Actions.run(id),
      parse: parseFormula,
      selfTest: SelfTest.run,
    };
    console.log("%cOneSheet v" + VERSION, "font:600 14px system-ui;color:#4f46e5",
      "\n→ OneSheet.engine.set(\"A1\",\"=SUM(B1:B3)\")\n→ OneSheet.selfTest()\n→ " + Object.keys(FN).length + " functions, " + MAXROW + "×" + MAXCOL + " grid");

    if (/[?&]test=1/.test(location.search)) setTimeout(() => SelfTest.run(), 60);
  }

  return { start, seedDemo, fresh, demoWrites };
})();

/* ============================================================ *
 * ===== SELF TEST =============================================
 * `?test=1` (or OneSheet.selfTest()) walks the §14 acceptance
 * checklist that can be verified without a human. It runs
 * against the live engine, then restores whatever was there.
 * ============================================================ */
const SelfTest = (() => {
  function run() {
    const results = [];
    const saved = Engine.snapshot();
    const ok = (name, cond, detail) => results.push({ name, pass: !!cond, detail: cond ? "" : String(detail == null ? "" : detail) });
    const eq = (name, got, want) => ok(name, sameish(got, want), "got " + fmtv(got) + ", wanted " + fmtv(want));
    const fmtv = v => v instanceof Err ? v.code : typeof v === "string" ? JSON.stringify(v) : String(v);
    const sameish = (a, b) => (typeof a === "number" && typeof b === "number") ? Math.abs(a - b) < 1e-9 : (a instanceof Err ? a.code === b : a === b);
    const S = (a1, raw) => Engine.set(a1, raw);
    const V = a1 => Engine.value(a1);

    try {
      Engine.restore([]);

      /* --- parser + evaluator --- */
      S("A1", "1"); S("A2", "5"); S("A3", "9");
      S("B1", "hello");
      S("C1", "b");
      S("D1", "a"); S("E1", "10"); S("D2", "b"); S("E2", "20"); S("D3", "c"); S("E3", "30");
      S("F1", '=IF(SUM(A1:A3)>10, UPPER(B1)&"!", VLOOKUP(C1,D1:E9,2,FALSE))');
      eq("§14 headline formula", V("F1"), "HELLO!");
      S("A3", "1");
      eq("  …and the other branch", V("F1"), 20);

      eq("operator precedence", (S("G1", "=2+3*4"), V("G1")), 14);
      eq("unary above power, per §5.1 grammar (Excel says 4)", (S("G2", "=-2^2"), V("G2")), -4);
      eq("right-assoc power", (S("G3", "=2^3^2"), V("G3")), 512);
      eq("percent postfix", (S("G4", "=50%"), V("G4")), 0.5);
      eq("string concat", (S("G5", '="a"&1&TRUE'), V("G5")), "a1TRUE");
      eq("escaped quotes", (S("G6", '="say ""hi"""'), V("G6")), 'say "hi"');
      eq("case-insensitive", (S("G7", "=sum(a1:a3)"), V("G7")), 7);
      eq("div by zero", (S("G8", "=1/0"), V("G8")), "#DIV/0!");
      eq("unknown name", (S("G9", "=NOPE(1)"), V("G9")), "#NAME?");
      eq("text arithmetic", (S("G10", "=B1+1"), V("G10")), "#VALUE!");
      eq("blank is zero", (S("G11", "=ZZ5000+5"), V("G11")), 5);
      eq("error propagates", (S("G12", "=G8+1"), V("G12")), "#DIV/0!");
      eq("IFERROR catches", (S("G13", "=IFERROR(1/0,\"safe\")"), V("G13")), "safe");
      eq("leading apostrophe forces text", (S("G14", "'007"), V("G14")), "007");
      eq("leading zeros stay text", (S("G15", "007"), V("G15")), "007");

      /* --- function library --- */
      eq("ROUND", (S("H1", "=ROUND(2.345,2)"), V("H1")), 2.35);
      eq("ROUNDUP", (S("H2", "=ROUNDUP(2.341,2)"), V("H2")), 2.35);
      eq("MOD negative", (S("H3", "=MOD(-3,5)"), V("H3")), 2);
      eq("MID", (S("H4", '=MID("spreadsheet",7,5)'), V("H4")), "sheet");
      eq("PROPER", (S("H5", '=PROPER("hELLO wORLD")'), V("H5")), "Hello World");
      eq("SUBSTITUTE nth", (S("H6", '=SUBSTITUTE("a-a-a","-","+",2)'), V("H6")), "a-a+a");
      eq("REPT", (S("H7", '=REPT("ab",3)'), V("H7")), "ababab");
      eq("TEXT percent", (S("H8", '=TEXT(0.25,"0%")'), V("H8")), "25%");
      eq("COUNTA", (S("H9", "=COUNTA(A1:A3)"), V("H9")), 3);
      eq("MATCH exact", (S("H10", '=MATCH("b",D1:D3,0)'), V("H10")), 2);
      eq("INDEX", (S("H11", "=INDEX(D1:E3,2,2)"), V("H11")), 20);
      eq("XLOOKUP", (S("H12", '=XLOOKUP("c",D1:D3,E1:E3)'), V("H12")), 30);
      // HLOOKUP scans the first ROW and returns from row N of that column.
      S("D5", "q"); S("E5", "r"); S("F5", "s"); S("D6", "1"); S("E6", "2"); S("F6", "3");
      eq("HLOOKUP", (S("H13", '=HLOOKUP("r",D5:F6,2,FALSE)'), V("H13")), 2);
      eq("HLOOKUP down a column", (S("H21", '=HLOOKUP("a",D1:E3,3,FALSE)'), V("H21")), "c");
      eq("VLOOKUP approx", (S("H14", "=VLOOKUP(2,A1:A3,1,TRUE)"), V("H14")), 1);
      eq("SUMIF criteria", (S("H15", '=SUMIF(E1:E3,">15")'), V("H15")), 50);
      eq("COUNTIF wildcard", (S("H16", '=COUNTIF(D1:D3,"?")'), V("H16")), 3);
      eq("AVERAGEIF", (S("H17", '=AVERAGEIF(D1:D3,"<>a",E1:E3)'), V("H17")), 25);
      eq("DATE→YEAR", (S("H18", "=YEAR(DATE(2026,7,25))"), V("H18")), 2026);
      eq("DAYS", (S("H19", "=DAYS(DATE(2026,7,25),DATE(2026,7,1))"), V("H19")), 24);
      eq("nested lazy IF", (S("H20", "=IF(FALSE,1/0,42)"), V("H20")), 42);
      ok("all §6 functions present", Object.keys(FN).length >= 45, Object.keys(FN).length + " defined");

      /* --- number formats --- */
      eq("fmt 0.00", fmtNumber(1234.5, "0.00"), "1,234.50");
      eq("fmt #,##0", fmtNumber(1234.5, "#,##0"), "1,235");
      eq("fmt currency", fmtNumber(-12.5, "$#,##0.00"), "-$12.50");
      eq("fmt date", fmtNumber(46228, "date"), "25 Jul 2026");

      /* --- implied formats must survive the command layer --- */
      Engine.restore([]); Commands.reset(Engine.snapshot());
      Commands.apply("typed", [["A1", { raw: "50%" }], ["A2", { raw: "2026-01-01" }], ["A3", { raw: "=TODAY()" }], ["A4", { raw: "$1,250.00" }]]);
      eq("typed percent keeps its format", Engine.text("A1"), "50%");
      eq("  …and its underlying value", V("A1"), 0.5);
      eq("typed ISO date renders as a date", Engine.text("A2"), "01 Jan 2026");
      ok("=TODAY() renders as a date", /^\d{2} \w{3} \d{4}$/.test(Engine.text("A3")), Engine.text("A3"));
      eq("typed currency keeps its format", Engine.text("A4"), "$1,250.00");
      Commands.undo();
      ok("undo clears the implied format with the value", Engine.cell("A1") === null, JSON.stringify(Engine.cell("A1")));

      /* --- dependency graph, cycles, incremental recalc --- */
      Engine.restore([]);
      for (let i = 1; i <= 20; i++) S("A" + i, i === 1 ? "1" : "=A" + (i - 1) + "+1");
      eq("20-deep chain", V("A20"), 20);
      S("A1", "10");
      eq("  …recalculates incrementally", V("A20"), 29);
      ok("  …and only touched the chain", Engine.stats.evaluated <= 20, Engine.stats.evaluated + " evaluated");
      S("B1", "=B2"); S("B2", "=B1");
      eq("cycle → #CYCLE!", V("B1"), "#CYCLE!");
      ok("  …sheet still responsive", (S("C9", "=1+1"), V("C9")) === 2);
      S("B1", "3");
      eq("  …and cycles recover", V("B1"), 3);
      S("D1", "=SUM(D2:D5000)");
      S("D4000", "7");
      eq("big range watcher fires", V("D1"), 7);

      /* --- fill patterns (§7.3) --- */
      Engine.restore([]); Commands.reset(Engine.snapshot());
      S("A1", "1"); S("A2", "2");
      Grid.selectRect({ r1: 1, c1: 1, r2: 2, c2: 1 }, true);
      FillEngine.run({ r1: 1, c1: 1, r2: 2, c2: 1 }, { r1: 1, c1: 1, r2: 100, c2: 1 });
      eq("fill 1,2 → 100 rows", V("A100"), 100);
      S("B1", "Item 1");
      FillEngine.run({ r1: 1, c1: 2, r2: 1, c2: 2 }, { r1: 1, c1: 2, r2: 4, c2: 2 });
      eq("fill 'Item 1' down", V("B4"), "Item 4");
      S("C1", "Jan"); S("D1", "Feb");
      FillEngine.run({ r1: 1, c1: 3, r2: 1, c2: 4 }, { r1: 1, c1: 3, r2: 1, c2: 8 });
      eq("fill Jan/Feb across", V("G1"), "May");
      S("A200", "5"); S("A201", "10");
      FillEngine.run({ r1: 200, c1: 1, r2: 201, c2: 1 }, { r1: 200, c1: 1, r2: 203, c2: 1 });
      eq("constant delta series", V("A203"), 20);
      S("E1", "MON");
      FillEngine.run({ r1: 1, c1: 5, r2: 1, c2: 5 }, { r1: 1, c1: 5, r2: 3, c2: 5 });
      eq("day cycle preserves case", V("E3"), "WED");

      /* --- formula shifting, paste, cut redirect --- */
      eq("relative shift", shiftFormula("=A1+B$2", 1, 1), "=B2+C$2");
      eq("$ pins hold", shiftFormula("=$A$1+A1", 2, 3), "=$A$1+D3");
      eq("out of grid → #REF!", shiftFormula("=A1", -5, 0), "=#REF!");
      Engine.restore([]); Commands.reset(Engine.snapshot());
      S("A1", "1"); S("A2", "2"); S("A3", "=A1+A2");
      S("C1", "=A3*2");
      const moveMap = new Map([["R3C1", { r: 8, c: 1 }]]);
      const w = [["R3C1", null], ["R8C1", { raw: Engine.cell("A3").raw }]];
      Commands.apply("test move", w.concat([["R1C3", { raw: "=" + stringifyAst(remapAst(Engine.cell("C1").ast, moveMap)) }]]));
      eq("cut+paste redirects inbound refs", Engine.raw("C1"), "=A8*2");
      eq("  …and the moved cell still computes", V("A8"), 3);
      eq("  …so the dependent is right", V("C1"), 6);

      /* --- commands, undo/redo, time travel --- */
      Engine.restore([]);
      S("Z1", "=SUM(A1:A60)");                 // a formula that lives in the BASE snapshot
      Commands.reset(Engine.snapshot());
      for (let i = 1; i <= 60; i++) Commands.apply("edit " + i, [["A" + i, { raw: String(i) }]]);
      ok("60 commands logged", Commands.log.length === 60, Commands.log.length);
      const t0 = performance.now();
      Commands.materialise(30);
      const seekMs = performance.now() - t0;
      eq("scrub to #30", V("A30"), 30);
      eq("  …future is gone", V("A31"), null);
      eq("  …base-snapshot formulas still evaluate", V("Z1"), 465);
      ok("  …seek under 100 ms", seekMs < 100, seekMs.toFixed(1) + " ms");
      Commands.materialise(60);
      eq("jump to present", V("A60"), 60);
      eq("  …and recompute at the present", V("Z1"), 1830);
      Commands.undo();
      eq("undo", V("A60"), null);
      Commands.redo();
      eq("redo", V("A60"), 60);
      ok("snapshots taken", Commands.snapshotIndices.length >= 1, Commands.snapshotIndices.join(","));

      /* --- goal seek --- */
      Engine.restore([]); Commands.reset(Engine.snapshot());
      S("A1", "250000"); S("A2", "5"); S("A3", "=A2/100/12"); S("A4", "300");
      S("A5", "=ROUND(A1*A3/(1-POWER(1+A3,-A4)),2)");
      ok("goal seek reaches through the graph", GoalSeek.reaches("R2C1", "R5C1"));
      const gs = GoalSeek.solve("R2C1", "R5C1", 1500, null);
      ok("goal seek converges", gs.ok, gs.reason);
      if (gs.ok) {
        Engine.set("A2", numToStr(gs.x));
        ok("  …within 4 decimals", Math.abs(V("A5") - 1500) < 1e-3, "payment " + V("A5"));
      }

      /* --- widgets --- */
      Engine.restore([]);
      S("A1", "=SLIDER(0,100,5,40)");
      eq("slider value participates", (S("A2", "=A1*2"), V("A2")), 80);
      const wc = widgetOf(Engine.cell("A1"));
      ok("slider config parsed", wc && wc.type === "slider" && wc.max === 100, JSON.stringify(wc));
      eq("slider rewrite", widgetFormula(Engine.cell("A1"), 75), "=SLIDER(0,100,5,75)");
      S("A3", "=CHECKBOX(TRUE)");
      eq("checkbox is a boolean", V("A3"), true);
      S("A4", "=RATING(5,3)");
      eq("rating is a number", V("A4"), 3);

      /* --- sparkline + AI --- */
      Engine.restore([]);
      S("A1", "3"); S("A2", "1"); S("A3", "4");
      S("B1", "=SPARK(A1:A3)");
      ok("SPARK returns a sparkline", V("B1") instanceof SparkVal && V("B1").pts.length === 3);
      S("C1", '=AI("categorize as fruit/vegetable","Tomato")');
      const ai1 = V("C1");
      S("C2", '=AI("categorize as fruit/vegetable","Tomato")');
      ok("mock AI is deterministic", ai1 === V("C2") && ["fruit", "vegetable"].includes(String(ai1)), String(ai1));
      S("C3", '=AI("sentiment","great news")');
      ok("mock AI knows sentiment", ["positive", "negative", "neutral"].includes(String(V("C3"))), String(V("C3")));
      S("C4", '=AI("summarize this","the quick brown fox jumps over the lazy dog again and again")');
      ok("mock AI summarises", String(V("C4")).endsWith("…"), String(V("C4")));

      /* --- CSV round trip --- */
      const rows = Clipboard.parseDelimited('a,"b,c"\r\n1,"line\nbreak"\r\n', ",");
      ok("CSV parser handles quotes/CRLF", rows.length === 2 && rows[0][1] === "b,c" && rows[1][1] === "line\nbreak", JSON.stringify(rows));

      /* --- bounds --- */
      eq("column names", colName(702), "ZZ");
      eq("column round trip", colIndex("ZZ"), 702);
      Engine.restore([]);
      eq("out of range ref", (S("A1", "=AAA1"), V("A1")), "#NAME?");
    } catch (e) {
      results.push({ name: "harness crashed", pass: false, detail: String(e && e.stack || e) });
      console.error(e);
    } finally {
      Engine.restore(saved);
      Commands.reset(Engine.snapshot());
      Grid.scheduleRender();
    }

    const failed = results.filter(r => !r.pass);
    console.group("%cOneSheet self-test — " + (results.length - failed.length) + "/" + results.length + " passed",
      "font:600 13px system-ui;color:" + (failed.length ? "#dc2626" : "#16a34a"));
    results.forEach(r => console.log((r.pass ? "%c✓ " : "%c✗ ") + r.name + (r.detail ? " — " + r.detail : ""), "color:" + (r.pass ? "#16a34a" : "#dc2626")));
    console.groupEnd();
    window.__ONESHEET_TEST__ = { total: results.length, failed: failed.length, results };
    toast(failed.length ? failed.length + " self-test failures — see console" : "Self-test: " + results.length + "/" + results.length + " passed", { ms: 5000 });
    return window.__ONESHEET_TEST__;
  }
  return { run };
})();

Boot.start();

</script>

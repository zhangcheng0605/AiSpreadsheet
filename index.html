def("AI", "AI(\"prompt\", [range])", "Asks a model. Mock Mode by default — no key needed.", (a, ctx) => AIRuntime.evaluate(a, ctx));

/** Widget config is read straight off the AST, so it round-trips through
 *  copy/paste, undo, time travel and the URL hash for free. */
const WIDGET_FNS = { SLIDER: "slider", CHECKBOX: "checkbox", RATING: "rating" };
function widgetOf(cell) {
  if (!cell || !cell.ast || cell.ast.t !== "call") return null;
  const kind = WIDGET_FNS[cell.ast.n];
  if (!kind) return null;
  const lit = i => { const n = cell.ast.args[i]; return n && n.t === "num" ? n.v : n && n.t === "un" && n.e.t === "num" ? (n.op === "-" ? -n.e.v : n.e.v) : n && n.t === "bool" ? n.v : undefined; };
  if (kind === "slider") return { type: "slider", min: lit(0) ?? 0, max: lit(1) ?? 100, step: lit(2) ?? 1, valueIdx: 3 };
  if (kind === "checkbox") return { type: "checkbox", valueIdx: 0 };
  return { type: "rating", max: lit(0) ?? 5, valueIdx: 1 };
}
/** Rewrite a widget formula with a new value — the only way widgets mutate. */
function widgetFormula(cell, v) {
  const w = widgetOf(cell);
  if (!w) return cell.raw;
  if (w.type === "slider")  return "=SLIDER(" + numToStr(w.min) + "," + numToStr(w.max) + "," + numToStr(w.step) + "," + numToStr(v) + ")";
  if (w.type === "checkbox") return "=CHECKBOX(" + (v ? "TRUE" : "FALSE") + ")";
  return "=RATING(" + numToStr(w.max) + "," + numToStr(v) + ")";
}
const FN_NAMES = Object.keys(FN).sort();

/* ============================================================ *
 * ===== COMMANDS ==============================================
 * Every mutation in the app funnels through here. One choke
 * point buys us three features: undo/redo, time travel, and
 * autosave. No UI code below ever touches Engine.writeRaw.
 *
 * A history entry is { seq, ts, label, before, after } where
 * before/after are *exact* cell specs, not deltas — replaying
 * either direction is therefore idempotent and order-free.
 * ============================================================ */
const Commands = (() => {
  const MAX_LOG = 5000, SNAP_EVERY = 50;
  const log = [];
  let cursor = 0;              // number of entries currently applied
  let seqCounter = 0;
  let base = [];               // engine snapshot at log index 0
  const snaps = new Map();     // logIndex -> engine snapshot
  const listeners = [];
  let gesture = null;
  let frozen = false;          // true while time-travelling (read-only)

  const emit = kind => listeners.forEach(f => f(kind));
  const specsOf = keys => keys.map(k => [k, Engine.exactCell(k)]);

  /** Apply a list of exact specs with a single recalculation at the end. */
  function applyExact(list) {
    Engine.suspend(true);
    const keys = [];
    for (const [k, spec] of list) { Engine.putCell(k, spec); keys.push(k); }
    Engine.suspend(false);
    Engine.recalc(keys);
    return keys;
  }

  /** Turn the friendly write form into exact specs, preserving untouched fields. */
  function resolve(writes) {
    const out = [];
    for (const [k0, spec] of writes) {
      const k = Engine.norm(k0);
      if (spec === null) { out.push([k, null]); continue; }
      const cur = Engine.cell(k);
      const raw = "raw" in spec ? spec.raw : (cur ? cur.raw : "");
      let fmt;
      if ("fmt" in spec) fmt = spec.fmt === null ? null : Object.assign({}, cur && cur.fmt, spec.fmt);
      else fmt = cur && cur.fmt ? JSON.parse(JSON.stringify(cur.fmt)) : null;
      // A literal that implies a format keeps it: typing 50% should stay 50%.
      if (!fmt && "raw" in spec) { const inf = Engine.inferFormat(spec.raw); if (inf) fmt = { numFmt: inf }; }
      if (fmt) { for (const kk of Object.keys(fmt)) if (fmt[kk] == null) delete fmt[kk]; if (!Object.keys(fmt).length) fmt = null; }
      const imported = "imported" in spec ? spec.imported : !!(cur && cur.imported);
      if (!raw && !fmt) out.push([k, null]);
      else out.push([k, Object.assign({ raw }, fmt ? { fmt } : {}, imported ? { imported: true } : {})]);
    }
    return out;
  }

  function push(label, before, after, extra) {
    if (log.length > cursor) log.length = cursor;          // a new branch truncates the future
    const entry = Object.assign({ seq: ++seqCounter, ts: Date.now(), label, before, after }, extra || {});
    log.push(entry);
    cursor = log.length;
    if (log.length > MAX_LOG) {
      // FIFO: drop the oldest entry and fold it into the base snapshot.
      const drop = log.length - MAX_LOG;
      const keep = seek0(drop);
      base = keep;
      log.splice(0, drop);
      cursor = log.length;
      const remap = new Map();
      for (const [i, s] of snaps) if (i - drop > 0) remap.set(i - drop, s);
      snaps.clear();
      for (const [i, s] of remap) snaps.set(i, s);
    }
    if (cursor % SNAP_EVERY === 0) snaps.set(cursor, Engine.snapshot());
    emit("commit");
    return entry;
  }
  /** Rebuild the sheet state as of index `n` and return a snapshot of it,
   *  without disturbing the live sheet. Only used when trimming the log. */
  function seek0(n) {
    const live = Engine.snapshot();
    materialise(n);
    const out = Engine.snapshot();
    Engine.restore(live);
    return out;
  }

  /** Main entry point. `writes` is [[key, spec], …]; spec fields are optional
   *  and anything absent is preserved. Pass null to erase a cell. */
  function apply(label, writes, extra) {
    if (frozen) { toast("Time travel is read-only — jump to the present first."); return null; }
    const resolved = resolve(writes);
    const keys = resolved.map(([k]) => k);
    const before = specsOf(keys);
    let after;
    try {
      applyExact(resolved);
      after = specsOf(keys);
    } catch (e) {
      // §12: an engine explosion is a rollback, never a dead tab.
      console.warn("[OneSheet] command failed, rolling back:", label, e);
      applyExact(before);
      toast("That went sideways — the edit was rolled back");
      return null;
    }
    if (JSON.stringify(before) === JSON.stringify(after)) return null;   // no-op, don't pollute history
    return push(label, before, after, extra);
  }

  /* ---------- gestures: many mutations, one history entry ---------- */
  function beginGesture(label, keys) {
    if (frozen) return false;
    const ks = (keys || []).map(Engine.norm);
    gesture = { label, keys: new Set(ks), before: specsOf(ks) };
    return true;
  }
  function gestureTouch(key) {
    const k = Engine.norm(key);
    if (!gesture || gesture.keys.has(k)) return;
    gesture.keys.add(k);
    gesture.before.push([k, Engine.exactCell(k)]);
  }
  /** Write during a gesture: applies immediately, no history entry of its own.
   *  Slider drags and Goal Seek iterations use this so 300 mutations collapse
   *  into a single undo step at endGesture(). */
  function gestureWrite(key, spec) {
    const k = Engine.norm(key);
    gestureTouch(k);
    applyExact(resolve([[k, spec]]));
  }
  function endGesture() {
    if (!gesture) return null;
    const g = gesture; gesture = null;
    const after = specsOf(Array.from(g.keys));
    if (JSON.stringify(g.before) === JSON.stringify(after)) return null;
    return push(g.label, g.before, after);
  }
  function cancelGesture() { if (gesture) { applyExact(gesture.before); gesture = null; } }

  /* ---------- undo / redo: cursor movement over the same log ---------- */
  let undoBurst = 0, undoBurstAt = 0;
  function undo() {
    if (frozen) { TimeTravel.jumpToPresent(); }
    if (!cursor) { toast("Nothing left to undo"); return false; }
    const e = log[--cursor];
    applyExact(e.before);
    const now = Date.now();
    undoBurst = now - undoBurstAt < 1400 ? undoBurst + 1 : 1;
    undoBurstAt = now;
    if (undoBurst === 10) Clippy.say("undo10");
    emit("move");
    return e;
  }
  function redo() {
    if (frozen) { TimeTravel.jumpToPresent(); }
    if (cursor >= log.length) { toast("Nothing to redo"); return false; }
    const e = log[cursor++];
    applyExact(e.after);
    emit("move");
    return e;
  }

  /* ---------- time-travel support ---------- */
  /** Put the engine into the state it had after `n` commands. */
  function materialise(n) {
    n = clamp(n, 0, log.length);
    let bestIdx = 0, bestSnap = base;
    for (const [i, s] of snaps) if (i <= n && i > bestIdx) { bestIdx = i; bestSnap = s; }
    // restore() must run UNsuspended: it re-parses and re-links every formula
    // and then evaluates them. Suspending here would leave the whole snapshot
    // linked but unevaluated, and only the replayed patches would have values.
    Engine.restore(bestSnap);
    const touched = new Set();
    Engine.suspend(true);
    for (let i = bestIdx; i < n; i++) for (const [k, spec] of log[i].after) { Engine.putCell(k, spec); touched.add(k); }
    Engine.suspend(false);
    // one incremental pass propagates the replayed patches to their dependents
    if (touched.size) Engine.recalc(Array.from(touched));
    return n;
  }
  function setFrozen(v) { frozen = v; }

  function reset(seedSnapshot) {
    log.length = 0; cursor = 0; seqCounter = 0; snaps.clear();
    base = seedSnapshot || Engine.snapshot();
    emit("reset");
  }

  return {
    apply, push, applyExact, resolve, specsOf,
    beginGesture, gestureTouch, gestureWrite, endGesture, cancelGesture,
    undo, redo, materialise, setFrozen, reset,
    on: f => listeners.push(f),
    get log() { return log; },
    get cursor() { return cursor; },
    set cursor(v) { cursor = clamp(v, 0, log.length); },
    get canUndo() { return cursor > 0; },
    get canRedo() { return cursor < log.length; },
    get frozen() { return frozen; },
    get snapshotIndices() { return Array.from(snaps.keys()); },
  };
})();

/* ============================================================ *
 * ===== GRID ==================================================
 * A virtualised DOM grid: 5 000 × 702 = 3.5 M cells addressable,
 * only ~1 200 nodes ever exist. DOM rather than canvas because
 * cells host real <input> widgets and inline SVG sparklines.
 * One render pass per animation frame, driven by a dirty set.
 * ============================================================ */
const Grid = (() => {
  const scroller = $("#scroller"), canvas = $("#canvas"), layer = $("#cellLayer");
  const colheadInner = $("#colheadInner"), rowheadInner = $("#rowheadInner");
  const selbox = $("#selbox"), anchorbox = $("#anchorbox"), refLayer = $("#refLayer");
  const DEFAULT_W = 92;
  const colW = new Map();                     // sparse overrides
  let prefix = new Float64Array(MAXCOL + 2);  // prefix[c] = x of column c's left edge
  const M = { rowh: 24, headw: 48, headh: 24 };
  let totalW = 0, totalH = 0;

  /** Selection is an anchor plus an active cell; the rect is derived. */
  const sel = { ar: 1, ac: 1, r: 1, c: 1 };
  let view = { r1: 1, r2: 1, c1: 1, c2: 1 };
  const live = new Map();       // key -> node currently in the DOM
  const pool = [];              // recycled nodes
  const hpool = { col: [], row: [] };
  const liveH = { col: new Map(), row: new Map() };
  let needFull = true;
  let refBoxes = [];            // colored outlines for refs in the editor
  const flashes = new Map();    // key -> css class to apply on next paint

  scroller.tabIndex = 0;

  /* ---------- geometry ---------- */
  function width(c) { return colW.get(c) || DEFAULT_W; }
  function rebuildPrefix() {
    let x = 0;
    for (let c = 1; c <= MAXCOL; c++) { prefix[c] = x; x += width(c); }
    prefix[MAXCOL + 1] = x;
    totalW = x;
    totalH = MAXROW * M.rowh;
    canvas.style.width = totalW + "px";
    canvas.style.height = totalH + "px";
  }
  function colAt(x) {
    let lo = 1, hi = MAXCOL;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (prefix[mid] <= x) lo = mid; else hi = mid - 1; }
    return lo;
  }
  const rowAt = y => clamp(Math.floor(y / M.rowh) + 1, 1, MAXROW);
  const cellRect = (r, c) => ({ x: prefix[c], y: (r - 1) * M.rowh, w: width(c), h: M.rowh });
  function rangePx(rect) {
    return { x: prefix[rect.c1], y: (rect.r1 - 1) * M.rowh, w: prefix[rect.c2 + 1] - prefix[rect.c1], h: (rect.r2 - rect.r1 + 1) * M.rowh };
  }
  function measure() {
    const cs = getComputedStyle(document.documentElement);
    M.rowh  = parseInt(cs.getPropertyValue("--cell-h")) || 24;
    M.headw = parseInt(cs.getPropertyValue("--head-w")) || 48;
    M.headh = parseInt(cs.getPropertyValue("--head-h")) || 24;
    rebuildPrefix();
    needFull = true;
  }

  const rect = () => normRect({ r1: sel.ar, c1: sel.ac, r2: sel.r, c2: sel.c });
  const activeKey = () => K(sel.r, sel.c);

  /* ---------- painting one cell ---------- */
  const measurer = document.createElement("canvas").getContext("2d");
  function textWidth(s, bold) {
    const cs = getComputedStyle(document.body);
    measurer.font = (bold ? "700 " : "") + (parseInt(cs.getPropertyValue("--cell-fs")) || 13) + "px " + cs.fontFamily;
    return measurer.measureText(s).width;
  }

  function sparkSVG(sv, w, h) {
    const pts = sv.pts;
    const W = Math.max(20, w - 8), H = Math.max(8, h - 8);
    if (!pts.length) return "";
    let lo = Math.min(...pts), hi = Math.max(...pts);
    if (hi === lo) { hi = lo + 1; lo -= 1; }
    const X = i => pts.length === 1 ? W / 2 : (i / (pts.length - 1)) * W;
    const Y = v => H - ((v - lo) / (hi - lo)) * H;
    let body = "";
    if (sv.type === "bar" || sv.type === "winloss") {
      const bw = Math.max(1, W / pts.length - 1);
      const zero = sv.type === "winloss" ? H / 2 : H;
      body = pts.map((v, i) => {
        const x = (i / pts.length) * W;
        let y, hh;
        if (sv.type === "winloss") { const up = v >= 0; hh = H / 2 - 1; y = up ? 0 : H / 2 + 1; }
        else { y = Y(v); hh = Math.max(1, H - y); }
        const col = sv.type === "winloss" ? (v >= 0 ? "var(--green)" : "var(--red)") : "var(--accent)";
        return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" fill="${col}" opacity=".85"/>`;
      }).join("");
    } else {
      const d = pts.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" ");
      const last = pts.length - 1;
      body = `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-linejoin="round"/>` +
             `<circle cx="${X(last).toFixed(1)}" cy="${Y(pts[last]).toFixed(1)}" r="1.9" fill="var(--orange)"/>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="100%">${body}</svg>`;
  }

  function paint(node, key, r, c) {
    const cell = Engine.cell(key);
    const w = width(c);
    const inSel = (() => { const q = rect(); return r >= q.r1 && r <= q.r2 && c >= q.c1 && c <= q.c2; })();
    const wcfg = widgetOf(cell);
    const v = cell ? cell.value : null;
    const fmt = cell && cell.fmt;
    const txt = displayText(cell);

    // Text spills into empty neighbours, the way it has since VisiCalc.
    // clip-path bounds the overflow at the first occupied column.
    let spill = 0;
    if (txt && !wcfg && typeof v === "string" && !(fmt && (fmt.align === "right" || fmt.align === "center"))) {
      if (textWidth(txt, fmt && fmt.bold) > w - 10) {
        for (let cc = c + 1; cc <= Math.min(MAXCOL, c + 8); cc++) {
          const nb = Engine.cell(K(r, cc));
          if (nb && displayText(nb) !== "") break;
          spill += width(cc);
        }
      }
    }

    // A cheap signature avoids touching the DOM when nothing observable changed.
    const sig = [txt, w, spill, inSel ? 1 : 0, fmt ? JSON.stringify(fmt) : "", wcfg ? wcfg.type + ":" + txt : "",
                 v instanceof Err ? "e" : "", cell && cell.imported ? "i" : "", cell && cell.ai ? "a" : "",
                 v instanceof SparkVal ? "s" + v.pts.length + ":" + v.pts.join(",") + v.type : ""].join("|");
    if (node._sig === sig && node._k === key) return;
    node._sig = sig; node._k = key;

    let cls = "c";
    if (typeof v === "number" && !wcfg) cls += " num";
    else if (typeof v === "boolean" && !wcfg) cls += " bool";
    if (v instanceof Err) cls += " err";
    if (inSel) cls += " insel";
    if (cell && cell.imported) cls += " imported";
    if (cell && cell.ai) cls += " aicell";
    if (fmt) {
      if (fmt.bold) cls += " b";
      if (fmt.italic) cls += " i";
      if (fmt.align) cls += fmt.align === "left" ? " al" : fmt.align === "center" ? " ac" : " ar";
    }
    if (spill) cls += " spill";
    node.className = cls;
    node.style.width = w + "px";
    node.style.clipPath = spill ? "inset(0 -" + spill + "px 0 0)" : "";
    node.style.color = (fmt && fmt.color) || "";
    node.style.background = (fmt && fmt.bg) || "";

    if (wcfg) {
      Widgets.render(node, key, cell, wcfg);
    } else if (v instanceof SparkVal) {
      node.innerHTML = '<span class="sparkwrap">' + sparkSVG(v, w, M.rowh) + "</span>";
    } else {
      if (node.firstChild && node.childNodes.length === 1 && node.firstChild.nodeType === 3) node.firstChild.data = txt;
      else node.textContent = txt;
    }
    if (v instanceof Err) node.title = errorHelp(v.code);
    else if (cell && cell.imported) node.title = "imported as value — the original formula didn't parse in our grammar";
    else if (cell && cell.ai) node.title = AIRuntime.hasKey() ? "Answered by claude-haiku-latest" : "Mock AI — add a key in Settings for the real thing.";
    else if (node.title) node.removeAttribute("title");
  }
  function errorHelp(code) {
    return {
      "#DIV/0!": "#DIV/0! — something is divided by zero or by an empty cell.",
      "#REF!":   "#REF! — this formula points outside the grid, or at a cell that was removed.",
      "#NAME?":  "#NAME? — unknown function or a typo in a reference.",
      "#VALUE!": "#VALUE! — wrong kind of value; usually text where a number belongs.",
      "#CYCLE!": "#CYCLE! — circular reference: this cell depends on itself.",
      "#N/A":    "#N/A — a lookup found nothing.",
      "#AI!":    "#AI! — the AI call failed. Check your key in AI settings.",
    }[code] || code;
  }

  /* ---------- the render loop ---------- */
  function computeView() {
    const st = scroller.scrollTop, sl = scroller.scrollLeft;
    const vh = scroller.clientHeight, vw = scroller.clientWidth;
    return {
      r1: clamp(Math.floor(st / M.rowh) + 1 - 5, 1, MAXROW),
      r2: clamp(Math.ceil((st + vh) / M.rowh) + 5, 1, MAXROW),
      c1: clamp(colAt(sl) - 3, 1, MAXCOL),
      c2: clamp(colAt(sl + vw) + 3, 1, MAXCOL),
    };
  }

  function renderCells() {
    const nv = computeView();
    view = nv;
    const wanted = new Set();
    for (let r = nv.r1; r <= nv.r2; r++) for (let c = nv.c1; c <= nv.c2; c++) wanted.add(K(r, c));
    // recycle anything that scrolled away
    for (const [k, node] of live) {
      if (!wanted.has(k)) {
        if (node._pinned) continue;
        live.delete(k);
        node.remove();
        node._sig = null;
        if (pool.length < 3000) pool.push(node);
      }
    }
    for (let r = nv.r1; r <= nv.r2; r++) {
      for (let c = nv.c1; c <= nv.c2; c++) {
        const k = K(r, c);
        let node = live.get(k);
        if (!node) {
          node = pool.pop() || el("div", "c");
          node.style.transform = "translate(" + prefix[c] + "px," + ((r - 1) * M.rowh) + "px)";
          node._pos = k;
          live.set(k, node);
          node._sig = null;
          layer.append(node);
        } else if (node._pos !== k) {
          node.style.transform = "translate(" + prefix[c] + "px," + ((r - 1) * M.rowh) + "px)";
          node._pos = k;
        }
        paint(node, k, r, c);
      }
    }
    // flashes queued by the engine
    if (flashes.size) {
      for (const [k, cls] of flashes) {
        const n = live.get(k);
        if (n) { n.classList.remove(cls); void n.offsetWidth; n.classList.add(cls); setTimeout(() => n.classList.remove(cls), 1000); }
      }
      flashes.clear();
    }
  }

  function renderHeaders() {
    const sl = scroller.scrollLeft, st = scroller.scrollTop;
    colheadInner.style.transform = "translateX(" + (-sl) + "px)";
    rowheadInner.style.transform = "translateY(" + (-st) + "px)";
    const q = rect();
    // columns
    const wantC = new Set();
    for (let c = view.c1; c <= view.c2; c++) wantC.add(c);
    for (const [c, n] of liveH.col) if (!wantC.has(c)) { liveH.col.delete(c); n.remove(); hpool.col.push(n); }
    for (let c = view.c1; c <= view.c2; c++) {
      let n = liveH.col.get(c);
      if (!n) {
        n = hpool.col.pop();
        if (!n) { n = el("div", "hcell"); n.append(el("span"), Object.assign(el("div", "hres"), {})); }
        liveH.col.set(c, n); colheadInner.append(n);
      }
      n.style.transform = "translateX(" + prefix[c] + "px)";
      n.style.width = width(c) + "px";
      n.dataset.col = c;
      const on = c >= q.c1 && c <= q.c2;
      if (n._on !== on) { n.classList.toggle("on", on); n._on = on; }
      const label = colName(c);
      if (n.firstChild.textContent !== label) n.firstChild.textContent = label;
      n.lastChild.style.right = "-3px";
    }
    // rows
    const wantR = new Set();
    for (let r = view.r1; r <= view.r2; r++) wantR.add(r);
    for (const [r, n] of liveH.row) if (!wantR.has(r)) { liveH.row.delete(r); n.remove(); hpool.row.push(n); }
    for (let r = view.r1; r <= view.r2; r++) {
      let n = liveH.row.get(r);
      if (!n) { n = hpool.row.pop() || el("div", "hcell rowh"); liveH.row.set(r, n); rowheadInner.append(n); }
      n.style.transform = "translateY(" + ((r - 1) * M.rowh) + "px)";
      n.style.height = M.rowh + "px";
      n.dataset.row = r;
      const on = r >= q.r1 && r <= q.r2;
      if (n._on !== on) { n.classList.toggle("on", on); n._on = on; }
      const label = String(r);
      if (n.textContent !== label) n.textContent = label;
    }
  }

  function renderSelection() {
    const q = rect();
    const p = rangePx(q);
    selbox.style.transform = "translate(" + p.x + "px," + p.y + "px)";
    selbox.style.width = p.w + "px";
    selbox.style.height = p.h + "px";
    const single = q.r1 === q.r2 && q.c1 === q.c2;
    anchorbox.classList.toggle("hidden", single);
    if (!single) {
      const a = cellRect(sel.r, sel.c);
      anchorbox.style.transform = "translate(" + a.x + "px," + a.y + "px)";
      anchorbox.style.width = a.w + "px";
      anchorbox.style.height = a.h + "px";
    }
    $("#namebox").textContent = rectLabel(q);
    $("#stSel").textContent = rectLabel(q);
    renderStats(q);
    for (const f of renderHooks) f(q);
  }
  const renderHooks = [];

  function renderStats(q) {
    const host = $("#stStats");
    let sum = 0, n = 0, count = 0;
    const area = (q.r2 - q.r1 + 1) * (q.c2 - q.c1 + 1);
    if (area <= 200000) {
      for (let r = q.r1; r <= q.r2; r++) for (let c = q.c1; c <= q.c2; c++) {
        const v = Engine.rawValue(r, c);
        if (v == null || v === "") continue;
        count++;
        if (typeof v === "number") { sum += v; n++; }
      }
    }
    host.innerHTML = "";
    if (count > 1 || n > 1) {
      const add = (l, v) => host.append(el("span", "st", l + ": " + v));
      if (n) { add("Sum", numToStr(Math.round(sum * 1e9) / 1e9)); add("Avg", numToStr(Math.round((sum / n) * 1e6) / 1e6)); }
      add("Count", String(count));
    }
    $("#stCells").textContent = Engine.size + " cells";
    const s = Engine.stats;
    $("#stEngine").textContent = s.evaluated ? s.evaluated + " calc / " + s.ms.toFixed(1) + " ms" : "idle";
  }

  /** Colored outlines for the ranges referenced by the formula being edited. */
  function setRefBoxes(list) { refBoxes = list || []; drawRefBoxes(); }
  function drawRefBoxes() {
    refLayer.innerHTML = "";
    refBoxes.forEach((rb, i) => {
      const p = rangePx(rb.rect);
      const n = el("div", "refbox");
      n.style.cssText = "transform:translate(" + p.x + "px," + p.y + "px);width:" + p.w + "px;height:" + p.h + "px;border-color:" + REF_COLORS[rb.color % REF_COLORS.length];
      refLayer.append(n);
    });
  }

  const scheduleRender = rafThrottle(() => {
    if (needFull) {
      rebuildPrefix();
      needFull = false;
      // Column widths or the row height changed (a theme flip does both), so
      // every live node needs a fresh transform, not just fresh content.
      for (const [k, n] of live) { n._sig = null; n._pos = null; }
    }
    renderCells();
    renderHeaders();
    renderSelection();
    drawRefBoxes();
    if (XRay.active) XRay.redraw();
    Charts.reposition();
  });
  /** Repaint just the cells the engine says changed, plus the chrome. */
  function invalidate(keys) {
    if (keys) for (const k of keys) { const n = live.get(k); if (n) n._sig = null; }
    scheduleRender();
  }
  /** Flash priority: a #CYCLE! pulse or a time-travel diff must not be
   *  overwritten by the ordinary recalc tint queued in the same frame. */
  const FLASH_RANK = { flash: 0, tt: 1, ripple: 1, cyc: 2 };
  function flash(key, cls) {
    cls = cls || "flash";
    const cur = flashes.get(key);
    if (cur && (FLASH_RANK[cur] || 0) >= (FLASH_RANK[cls] || 0)) return;
    flashes.set(key, cls);
  }

  /* ---------- selection & scrolling ---------- */
  function ensureVisible(r, c) {
    const y = (r - 1) * M.rowh, x = prefix[c], w = width(c);
    const vh = scroller.clientHeight, vw = scroller.clientWidth;
    if (y < scroller.scrollTop) scroller.scrollTop = y;
    else if (y + M.rowh > scroller.scrollTop + vh) scroller.scrollTop = y + M.rowh - vh;
    if (x < scroller.scrollLeft) scroller.scrollLeft = x;
    else if (x + w > scroller.scrollLeft + vw) scroller.scrollLeft = x + w - vw;
  }
  function select(r, c, extend, noScroll) {
    r = clamp(r, 1, MAXROW); c = clamp(c, 1, MAXCOL);
    sel.r = r; sel.c = c;
    if (!extend) { sel.ar = r; sel.ac = c; }
    if (!noScroll) ensureVisible(r, c);
    Editor.syncFromSelection();
    scheduleRender();
    if (XRay.active) XRay.retarget();
  }
  function selectRect(q, noScroll) {
    sel.ar = q.r1; sel.ac = q.c1; sel.r = q.r2; sel.c = q.c2;
    if (!noScroll) ensureVisible(q.r1, q.c1);
    Editor.syncFromSelection();
    scheduleRender();
  }
  /** Ctrl+Arrow, with Excel's three cases:
   *  in a run  → last cell of the run;
   *  at a gap  → first cell of the next block;
   *  no data   → the edge of the grid. */
  function jump(dr, dc, extend) {
    let r = sel.r, c = sel.c;
    const filled = (rr, cc) => { const v = Engine.rawValue(rr, cc); return v != null && v !== ""; };
    let nr = r + dr, nc = c + dc;
    if (!inBounds(nr, nc)) return select(r, c, extend);
    if (filled(r, c) && filled(nr, nc)) {
      while (inBounds(nr, nc) && filled(nr, nc)) { r = nr; c = nc; nr = r + dr; nc = c + dc; }
    } else {
      let found = false;
      while (inBounds(nr, nc)) {
        if (filled(nr, nc)) { r = nr; c = nc; found = true; break; }
        nr += dr; nc += dc;
      }
      if (!found) { r = dr > 0 ? MAXROW : dr < 0 ? 1 : r; c = dc > 0 ? MAXCOL : dc < 0 ? 1 : c; }
    }
    select(r, c, extend);
  }

  /* ---------- pointer interaction ---------- */
  function hit(ev) {
    const b = scroller.getBoundingClientRect();
    const x = ev.clientX - b.left + scroller.scrollLeft;
    const y = ev.clientY - b.top + scroller.scrollTop;
    return { r: rowAt(y), c: colAt(clamp(x, 0, totalW - 1)), x, y };
  }
  let drag = null;
  scroller.addEventListener("mousedown", ev => {
    if (ev.button !== 0) return;
    if (ev.target.closest("#fillnub")) return startFill(ev);
    if (ev.target.closest(".wg")) return;                 // let widgets have their clicks
    const h = hit(ev);
    // point mode owns the click, and the drag that may follow it
    if (Editor.pointMode(h)) { drag = { kind: "point" }; ev.preventDefault(); return; }
    Editor.commitIfEditing();
    if (ev.shiftKey) select(h.r, h.c, true);
    else select(h.r, h.c, false);
    drag = { kind: "cells" };
    ev.preventDefault();
    scroller.focus();
  });
  scroller.addEventListener("dblclick", ev => {
    if (ev.target.closest(".wg")) return;
    const h = hit(ev);
    select(h.r, h.c, false);
    Editor.begin(null, true);
  });
  window.addEventListener("mousemove", ev => {
    if (!drag) return;
    const h = hit(ev);
    if (drag.kind === "point") { Editor.dragRef(h); autoScroll(ev); }
    else if (drag.kind === "cells") { select(h.r, h.c, true, true); autoScroll(ev); }
    else if (drag.kind === "fill") moveFill(h);
    else if (drag.kind === "colresize") doColResize(ev);
    else if (drag.kind === "rowsel") { selectRect(normRect({ r1: drag.a, c1: 1, r2: h.r, c2: MAXCOL }), true); }
    else if (drag.kind === "colsel") { selectRect(normRect({ r1: 1, c1: drag.a, r2: MAXROW, c2: h.c }), true); }
  });
  window.addEventListener("mouseup", () => {
    if (!drag) return;
    if (drag.kind === "fill") endFill();
    if (drag.kind === "colresize") endColResize();
    drag = null;
  });
  let autoTimer = null;
  function autoScroll(ev) {
    const b = scroller.getBoundingClientRect();
    const dx = ev.clientX < b.left + 30 ? -20 : ev.clientX > b.right - 30 ? 20 : 0;
    const dy = ev.clientY < b.top + 24 ? -20 : ev.clientY > b.bottom - 24 ? 20 : 0;
    clearTimeout(autoTimer);
    if (dx || dy) { scroller.scrollLeft += dx; scroller.scrollTop += dy; autoTimer = setTimeout(() => autoScroll(ev), 40); }
  }
  scroller.addEventListener("scroll", () => { Editor.reposition(); scheduleRender(); }, { passive: true });

  // header interactions
  $("#colhead").addEventListener("mousedown", ev => {
    const res = ev.target.closest(".hres");
    const hc = ev.target.closest(".hcell");
    if (!hc) return;
    const c = +hc.dataset.col;
    if (res) { drag = { kind: "colresize", c, x0: ev.clientX, w0: width(c) }; ev.preventDefault(); return; }
    Editor.commitIfEditing();
    selectRect(ev.shiftKey ? normRect({ r1: 1, c1: sel.ac, r2: MAXROW, c2: c }) : { r1: 1, c1: c, r2: MAXROW, c2: c }, true);
    sel.r = 1; sel.c = c; sel.ar = MAXROW; sel.ac = c;
    drag = { kind: "colsel", a: c };
    ev.preventDefault();
  });
  $("#colhead").addEventListener("dblclick", ev => {
    const res = ev.target.closest(".hres");
    if (!res) return;
    const c = +ev.target.closest(".hcell").dataset.col;
    autofit(c);
  });
  $("#rowhead").addEventListener("mousedown", ev => {
    const hc = ev.target.closest(".hcell");
    if (!hc) return;
    const r = +hc.dataset.row;
    Editor.commitIfEditing();
    selectRect(ev.shiftKey ? normRect({ r1: sel.ar, c1: 1, r2: r, c2: MAXCOL }) : { r1: r, c1: 1, r2: r, c2: MAXCOL }, true);
    sel.r = r; sel.c = 1; sel.ar = r; sel.ac = MAXCOL;
    drag = { kind: "rowsel", a: r };
    ev.preventDefault();
  });
  $("#corner").addEventListener("mousedown", () => selectAll());

  function doColResize(ev) {
    const w = clamp(drag.w0 + (ev.clientX - drag.x0), 26, 640);
    colW.set(drag.c, w);
    needFull = true;
    scheduleRender();
  }
  function endColResize() { Persist.save(); }
  function autofit(c) {
    let w = 40;
    const q = Engine.usedRange();
    for (let r = 1; r <= Math.min(q.r2, 2000); r++) {
      const cell = Engine.cell(K(r, c));
      if (!cell) continue;
      const t = displayText(cell);
      if (!t) continue;
      w = Math.max(w, textWidth(t, cell.fmt && cell.fmt.bold) + 14);
    }
    colW.set(c, clamp(Math.ceil(w), 40, 480));
    needFull = true;
    scheduleRender();
    Persist.save();
  }

  /* ---------- fill handle (§7.3) ---------- */
  let fillState = null;
  function startFill(ev) {
    drag = { kind: "fill" };
    fillState = { src: rect(), cur: rect() };

        if (parts[0] && (parts.length === 1 || parts[1])) {
